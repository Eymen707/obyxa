<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gamerwost - Mobile Multiplayer</title>
    <!-- Include PeerJS from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e2e8f0;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            background: #0284c7;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background: #0369a1;
        }
        #chat-box {
            height: 150px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .msg-log {
            color: #94a3b8;
            word-break: break-word;
        }
        .msg-peer {
            color: #38bdf8;
            word-break: break-word;
        }
        .msg-self {
            color: #4ade80;
            word-break: break-word;
        }
        .hidden {
            display: none !important;
        }
        #status {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🎮 gamerwost multiplayer</h1>
    <div id="status">Status: Disconnected</div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="card">
        <h2>Connection Setup</h2>
        <button id="btn-host">Host New Game</button>
        <p style="text-align: center; margin: 10px 0; color: #64748b;">OR</p>
        <input type="text" id="input-peer-id" placeholder="Enter Host Peer ID">
        <button id="btn-join">Join Game</button>
    </div>

    <!-- Game/Lobby Screen -->
    <div id="game-screen" class="card hidden">
        <h2 id="connection-info">Connected Room</h2>
        <div id="chat-box"></div>
        <input type="text" id="input-msg" placeholder="Type a message...">
        <button id="btn-send">Send Data</button>
    </div>

    <script>
        let peer;
        let conn;
        let myId = '';

        const statusEl = document.getElementById('status');
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const chatBox = document.getElementById('chat-box');
        const connectionInfo = document.getElementById('connection-info');

        function logMessage(text, type = 'log') {
            const div = document.createElement('div');
            div.className = `msg-${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 1. Host a game
        document.getElementById('btn-host').addEventListener('click', () => {
            // Generate a random short ID or let PeerJS handle it
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                statusEl.textContent = `Hosting! Your ID: ${id}`;
                connectionInfo.textContent = `Room ID: ${id} (Waiting for player...)`;
                setupScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionHandlers();
                statusEl.textContent = 'Player Connected!';
                logMessage('Another player joined the game!', 'log');
            });

            peer.on('error', (err) => {
                alert('Peer error: ' + err.type);
            });
        });

        // 2. Join a game
        document.getElementById('btn-join').addEventListener('click', () => {
            const hostId = document.getElementById('input-peer-id').value.trim();
            if (!hostId) {
                alert('Please enter a valid Host Peer ID.');
                return;
            }

            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                statusEl.textContent = 'Connecting to host...';
                
                conn = peer.connect(hostId);
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                alert('Connection failed: ' + err.type);
                statusEl.textContent = 'Status: Connection Failed';
            });
        });

        // 3. Setup data channel handlers
        function setupConnectionHandlers() {
            conn.on('open', () => {
                statusEl.textContent = 'Connected Successfully!';
                setupScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                connectionInfo.textContent = `Connected to Peer`;
                logMessage('Data channel open! You can chat or send sync data.', 'log');
            });

            conn.on('data', (data) => {
                logMessage(`Peer: ${data}`, 'peer');
            });

            conn.on('close', () => {
                statusEl.textContent = 'Disconnected';
                logMessage('Peer disconnected.', 'log');
                setTimeout(() => location.reload(), 2000);
            });
        }

        // 4. Send Data
        document.getElementById('btn-send').addEventListener('click', sendMessage);
        document.getElementById('input-msg').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('input-msg');
            const msg = input.value.trim();
            if (!msg || !conn || !conn.open) return;

            conn.send(msg);
            logMessage(`You: ${msg}`, 'self');
            input.value = '';
        }
    </script>
</body>
</html>
