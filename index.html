<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>obyxa001 - Retro Roblox 2014 & Simulator Studio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Character & Games -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap');

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Source Sans Pro', Arial, sans-serif;
            background-color: #e3e3e3;
            color: #222222;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .dark-mode {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        .dark-mode .roblox-card {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        .roblox-header {
            background: linear-gradient(180deg, #0074e8 0%, #004fb0 100%);
            border-bottom: 2px solid #00367d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .roblox-sidebar {
            background: #ffffff;
            border-right: 1px solid #c3c3c3;
        }

        .dark-mode .roblox-sidebar {
            background: #1e293b;
            border-color: #334155;
        }

        .btn-retro-green {
            background: linear-gradient(180deg, #02b700 0%, #008200 100%);
            border: 1px solid #004d00;
            color: white;
            text-shadow: 0px -1px 0px rgba(0,0,0,0.5);
        }
        .btn-retro-green:hover {
            background: linear-gradient(180deg, #03cc01 0%, #009600 100%);
        }

        .game-card {
            background: #ffffff;
            border: 1px solid #c3c3c3;
            transition: all 0.15s ease;
        }
        .game-card:hover {
            border-color: #0055b3;
            box-shadow: 0 4px 12px rgba(0, 85, 179, 0.3);
            transform: translateY(-2px);
        }

        /* Mobile Joystick */
        #virtual-joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 40px;
            left: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.7);
            pointer-events: auto !important;
            touch-action: none;
            display: block;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #virtual-joystick-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            left: 32px;
            top: 32px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #a1a5ab 100%);
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            pointer-events: none;
            transform: translate(0px, 0px);
        }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col">

    <!-- TOP HEADER BAR -->
    <header class="roblox-header text-white text-sm h-16 flex items-center justify-between px-3 sm:px-6 sticky top-0 z-40">
        <div class="flex items-center space-x-3 sm:space-x-5">
            <button onclick="toggleMobileSidebar()" class="md:hidden text-white text-2xl px-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div onclick="showTab('games')" class="flex items-center cursor-pointer">
                <div class="bg-red-600 text-white font-black italic text-lg sm:text-2xl px-3 py-1 rounded border border-red-800 tracking-tighter transform -rotate-1 shadow-md">
                    obyxa<span class="text-yellow-300">001</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-1.5 font-bold text-sm">
                <button onclick="showTab('games')" class="px-3 py-1.5 hover:bg-blue-600 rounded transition">Games</button>
                <button onclick="showTab('simulators')" class="px-3 py-1.5 hover:bg-blue-600 rounded transition text-yellow-300 font-extrabold">Simulators</button>
                <button onclick="showTab('avatar')" class="px-3 py-1.5 hover:bg-blue-600 rounded transition text-blue-300 font-bold">Character</button>
                <button onclick="showTab('friends')" class="px-3 py-1.5 hover:bg-blue-600 rounded transition">Friends</button>
                <button onclick="showTab('develop')" class="px-3 py-1.5 hover:bg-blue-600 rounded transition text-yellow-400 font-extrabold">Develop</button>
            </nav>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleTheme()" class="bg-blue-900 border border-blue-500 hover:bg-blue-800 text-yellow-300 px-2.5 py-1 rounded text-xs font-bold transition flex items-center shadow">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <div class="hidden sm:flex items-center space-x-1.5 text-xs font-semibold bg-blue-950 px-2.5 py-1.5 rounded border border-blue-500/50">
                <span class="text-green-400 font-bold">BR$</span>
                <span>86,400</span>
                <span class="text-amber-400 font-bold ml-1">TIX</span>
                <span>19,250</span>
            </div>
        </div>
    </header>

    <!-- MOBILE SIDEBAR -->
    <div id="mobile-sidebar" class="fixed inset-0 bg-black/80 z-50 hidden md:hidden" onclick="toggleMobileSidebar()">
        <div class="w-72 bg-white dark:bg-slate-900 h-full p-5 space-y-4 shadow-2xl text-gray-900 dark:text-white" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b pb-3">
                <span class="font-extrabold text-blue-600 text-lg">obyxa001 Menu</span>
                <button onclick="toggleMobileSidebar()" class="text-gray-500 text-2xl font-bold">&times;</button>
            </div>
            <nav class="flex flex-col space-y-2 font-bold text-sm">
                <button onclick="showTab('games'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded flex items-center gap-2"><i class="fa-solid fa-gamepad text-blue-500"></i> Games</button>
                <button onclick="showTab('simulators'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded text-amber-500 font-black flex items-center gap-2"><i class="fa-solid fa-bolt"></i> Simulators</button>
                <button onclick="showTab('profile'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded flex items-center gap-2"><i class="fa-solid fa-user text-blue-500"></i> Profile</button>
                <button onclick="showTab('friends'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded flex items-center gap-2"><i class="fa-solid fa-user-group text-blue-500"></i> Friends</button>
                <button onclick="showTab('avatar'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded flex items-center gap-2"><i class="fa-solid fa-shirt text-blue-500"></i> Character</button>
                <button onclick="showTab('develop'); toggleMobileSidebar()" class="text-left py-2 px-3 hover:bg-blue-50 rounded text-yellow-600 font-black flex items-center gap-2"><i class="fa-solid fa-hammer text-yellow-500"></i> Develop</button>
            </nav>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex gap-4">
        <aside class="w-48 shrink-0 hidden md:flex flex-col space-y-3">
            <div class="roblox-sidebar p-3 rounded-lg shadow-sm space-y-2">
                <nav class="space-y-0.5 text-xs font-semibold">
                    <a href="#" onclick="showTab('games')" class="flex items-center p-2 rounded hover:bg-blue-100 gap-2.5"><i class="fa-solid fa-house text-blue-500 w-4"></i> Home</a>
                    <a href="#" onclick="showTab('simulators')" class="flex items-center p-2 rounded hover:bg-blue-100 text-amber-600 font-extrabold gap-2.5"><i class="fa-solid fa-bolt text-amber-500 w-4"></i> Simulators</a>
                    <a href="#" onclick="showTab('profile')" class="flex items-center p-2 rounded hover:bg-blue-100 gap-2.5"><i class="fa-solid fa-user text-blue-500 w-4"></i> Profile</a>
                    <a href="#" onclick="showTab('friends')" class="flex items-center p-2 rounded hover:bg-blue-100 gap-2.5"><i class="fa-solid fa-user-group text-blue-500 w-4"></i> Friends</a>
                    <a href="#" onclick="showTab('avatar')" class="flex items-center p-2 rounded hover:bg-blue-100 gap-2.5"><i class="fa-solid fa-shirt text-blue-500 w-4"></i> Character</a>
                    <a href="#" onclick="showTab('catalog')" class="flex items-center p-2 rounded hover:bg-blue-100 gap-2.5"><i class="fa-solid fa-store text-blue-500 w-4"></i> Catalog</a>
                    <a href="#" onclick="showTab('develop')" class="flex items-center p-2 rounded hover:bg-blue-100 text-yellow-600 font-extrabold gap-2.5"><i class="fa-solid fa-hammer text-yellow-500 w-4"></i> Develop</a>
                </nav>
            </div>
        </aside>

        <main class="flex-1 min-w-0 space-y-4">
            <!-- GAMES TAB -->
            <div id="tab-games" class="space-y-4">
                <div class="roblox-card bg-white p-3 rounded border border-gray-300 shadow-sm">
                    <h1 class="font-black text-lg text-blue-600">Games & Simulators</h1>
                </div>

                <div class="space-y-2">
                    <h2 class="font-extrabold text-blue-600 text-sm">⚡ Interactive Simulators</h2>
                    <div id="grid-simulators-main" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
                </div>

                <div class="space-y-2">
                    <h2 class="font-extrabold text-blue-600 text-sm">Popular Classics</h2>
                    <div id="grid-popular" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-3"></div>
                </div>
            </div>

            <!-- SIMULATORS TAB -->
            <div id="tab-simulators" class="hidden space-y-4">
                <div class="roblox-card bg-white p-5 rounded border border-gray-300 shadow-sm space-y-4">
                    <h1 class="text-xl font-black text-blue-600">⚡ Roblox Simulator Worlds</h1>
                    <div id="grid-simulators-full" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- GAME / SIMULATOR PLAY MODAL WITH 3D WORLD -->
    <div id="game-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col">
        <div class="roblox-header p-3 flex justify-between items-center text-white z-10">
            <span id="active-game-title" class="font-bold text-sm">Playing Game</span>
            <button onclick="closeGameModal()" class="text-white font-bold text-lg px-3 py-1 bg-red-600 rounded">&times; Exit</button>
        </div>
        <div id="game-canvas-container" class="relative flex-1 w-full h-full overflow-hidden">
            <div id="virtual-joystick-base">
                <div id="virtual-joystick-stick"></div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT WITH 3D ENGINE -->
    <script>
        const simulatorsData = [
            { id: 'muscle', title: '💪 Muscle Legends 2014', desc: 'Train to get huge and strong!', players: '1.2K', color: 'from-orange-500 to-red-600' },
            { id: 'speed', title: '⚡ Speed Run 4 Retro', desc: 'Click to run faster and break records!', players: '950', color: 'from-yellow-400 to-amber-600' },
            { id: 'jump', title: '🚀 Mega Jump Simulator', desc: 'Upgrade springs and jump into the clouds!', players: '820', color: 'from-blue-500 to-indigo-600' }
        ];

        const popularGames = [
            { id: 'pizzaplace', title: 'Work at a Pizza Place', desc: 'Classic 2014 roleplay & job game.', players: '3.4K' },
            { id: 'naturaldisaster', title: 'Natural Disaster Survival', desc: 'Survive floods, meteors, and storms.', players: '2.1K' },
            { id: 'swordfight', title: 'SFOTH IV (Sword Fight)', desc: 'Classic sword fighting arena.', players: '1.4K' }
        ];

        function renderGames() {
            const simMain = document.getElementById('grid-simulators-main');
            const simFull = document.getElementById('grid-simulators-full');
            const popGrid = document.getElementById('grid-popular');

            if(simMain) {
                simMain.innerHTML = simulatorsData.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-28 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-lg shadow-inner">${g.title.split(' ')[1]}</div>
                        <h3 class="font-bold text-xs truncate">${g.title}</h3>
                        <p class="text-[10px] text-gray-500 truncate">${g.desc}</p>
                        <div class="text-[10px] text-green-600 font-bold"><i class="fa-solid fa-user"></i> ${g.players} Playing</div>
                    </div>
                `).join('');
            }

            if(simFull) {
                simFull.innerHTML = simulatorsData.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-32 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-xl shadow-inner">${g.title}</div>
                        <h3 class="font-bold text-sm">${g.title}</h3>
                        <p class="text-xs text-gray-500">${g.desc}</p>
                        <button class="w-full btn-retro-green py-1 rounded text-xs font-bold">Play Simulator</button>
                    </div>
                `).join('');
            }

            if(popGrid) {
                popGrid.innerHTML = popularGames.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-24 rounded bg-blue-500 flex items-center justify-center text-white font-black text-sm">${g.title}</div>
                        <h3 class="font-bold text-xs truncate">${g.title}</h3>
                        <div class="text-[10px] text-green-600 font-bold"><i class="fa-solid fa-user"></i> ${g.players} Playing</div>
                    </div>
                `).join('');
            }
        }

        function showTab(tabId) {
            ['games', 'simulators', 'catalog', 'profile', 'friends', 'avatar', 'develop'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById('tab-' + tabId);
            if(target) target.classList.remove('hidden');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            if(sidebar) sidebar.classList.toggle('hidden');
        }

        function toggleTheme() {
            document.getElementById('app-body').classList.toggle('dark-mode');
        }

        let gameScene, gameCamera, gameRenderer, playerMesh, animationFrameId;
        let moveX = 0, moveZ = 0;

        function openGameModal(title) {
            document.getElementById('active-game-title').innerText = title;
            document.getElementById('game-modal').classList.remove('hidden');
            init3DGame();
        }

        function closeGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            const container = document.getElementById('game-canvas-container');
            const canvas = container.querySelector('canvas');
            if(canvas) canvas.remove();
        }

        function init3DGame() {
            const container = document.getElementById('game-canvas-container');
            const oldCanvas = container.querySelector('canvas');
            if(oldCanvas) oldCanvas.remove();

            gameScene = new THREE.Scene();
            gameScene.background = new THREE.Color(0x87ceeb);

            gameCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            gameCamera.position.set(0, 5, 10);

            gameRenderer = new THREE.WebGLRenderer({ antialias: true });
            gameRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(gameRenderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            gameScene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            gameScene.add(dirLight);

            // Zemin (Baseplate)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x339933 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            gameScene.add(floor);

            // Bacon Hair Karakteri (Retro Blok)
            const playerGroup = new THREE.Group();
            
            // Gövde
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.5, 0.6);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.75;
            playerGroup.add(body);

            // Kafa (Bacon Hair Kahverengi Saç)
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.8;
            playerGroup.add(head);

            const hairMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const hairGeo = new THREE.BoxGeometry(0.9, 0.3, 0.9);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 3.2;
            playerGroup.add(hair);

            playerMesh = playerGroup;
            gameScene.add(playerMesh);

            // Joystick Kontrolleri
            setupJoystick();

            function animate() {
                animationFrameId = requestAnimationFrame(animate);

                if(playerMesh) {
                    playerMesh.position.x += moveX * 0.1;
                    playerMesh.position.z += moveY_val * 0.1;
                    gameCamera.position.x = playerMesh.position.x;
                    gameCamera.position.z = playerMesh.position.z + 10;
                    gameCamera.lookAt(playerMesh.position);
                }

                gameRenderer.render(gameScene, gameCamera);
            }
            animate();
        }

        let moveY_val = 0;
        function setupJoystick() {
            const base = document.getElementById('virtual-joystick-base');
            const stick = document.getElementById(
