    <script>
        // ... (simulatorsData ve popularGames aynı kalacak) ...
        const simulatorsData = [
            { id: 'muscle', title: '💪 Muscle Legends 2014', desc: 'Train to get huge and strong!', players: '1.2K', color: 'from-orange-500 to-red-600' },
            { id: 'speed', title: '⚡ Speed Run 4 Retro', desc: 'Click to run faster and break records!', players: '950', color: 'from-yellow-400 to-amber-600' },
            { id: 'jump', title: '🚀 Mega Jump Simulator', desc: 'Upgrade springs and jump into the clouds!', players: '820', color: 'from-blue-500 to-indigo-600' }
        ];

        const popularGames = [
            { id: 'pizzaplace', title: 'Work at a Pizza Place', desc: 'Classic 2014 roleplay & job game.', players: '3.4K' },
            { id: 'naturaldisaster', title: 'Natural Disaster Survival', desc: 'Survive floods, meteors, and storms.', players: '2.1K' },
            { id: 'swordfight', title: 'SFOTH IV (Sword Fight)', desc: 'Classic sword fighting arena.', players: '1.4K' }
        ];

        function renderGames() {
            const simMain = document.getElementById('grid-simulators-main');
            const simFull = document.getElementById('grid-simulators-full');
            const popGrid = document.getElementById('grid-popular');

            if(simMain) {
                simMain.innerHTML = simulatorsData.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-28 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-lg shadow-inner">${g.title.split(' ')[1]}</div>
                        <h3 class="font-bold text-xs truncate">${g.title}</h3>
                        <p class="text-[10px] text-gray-500 truncate">${g.desc}</p>
                        <div class="text-[10px] text-green-600 font-bold"><i class="fa-solid fa-user"></i> ${g.players} Playing</div>
                    </div>
                `).join('');
            }

            if(simFull) {
                simFull.innerHTML = simulatorsData.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-32 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-xl shadow-inner">${g.title}</div>
                        <h3 class="font-bold text-sm">${g.title}</h3>
                        <p class="text-xs text-gray-500">${g.desc}</p>
                        <button class="w-full btn-retro-green py-1 rounded text-xs font-bold">Play Simulator</button>
                    </div>
                `).join('');
            }

            if(popGrid) {
                popGrid.innerHTML = popularGames.map(g => `
                    <div class="game-card p-3 rounded cursor-pointer space-y-2 shadow-sm bg-white dark:bg-slate-800 border" onclick="openGameModal('${g.title}')">
                        <div class="h-24 rounded bg-blue-500 flex items-center justify-center text-white font-black text-sm">${g.title}</div>
                        <h3 class="font-bold text-xs truncate">${g.title}</h3>
                        <div class="text-[10px] text-green-600 font-bold"><i class="fa-solid fa-user"></i> ${g.players} Playing</div>
                    </div>
                `).join('');
            }
        }

        function showTab(tabId) {
            ['games', 'simulators', 'catalog', 'profile', 'friends', 'avatar', 'develop'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById('tab-' + tabId);
            if(target) target.classList.remove('hidden');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            if(sidebar) sidebar.classList.toggle('hidden');
        }

        function toggleTheme() {
            document.getElementById('app-body').classList.toggle('dark-mode');
        }

        let gameScene, gameCamera, gameRenderer, playerMesh, animationFrameId;
        let moveX = 0, moveY_val = 0;

        function openGameModal(title) {
            document.getElementById('active-game-title').innerText = title;
            document.getElementById('game-modal').classList.remove('hidden');
            
            // Boyutların oturması için çok kısa bir gecikme (100 milisaniye) ekledik
            setTimeout(() => {
                init3DGame();
            }, 100);
        }

        function closeGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            const container = document.getElementById('game-canvas-container');
            const canvas = container.querySelector('canvas');
            if(canvas) canvas.remove();
        }

        function init3DGame() {
            const container = document.getElementById('game-canvas-container');
            if (!container) return;
            
            const oldCanvas = container.querySelector('canvas');
            if(oldCanvas) oldCanvas.remove();

            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || 400;

            gameScene = new THREE.Scene();
            gameScene.background = new THREE.Color(0x87ceeb);

            gameCamera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            gameCamera.position.set(0, 5, 10);

            gameRenderer = new THREE.WebGLRenderer({ antialias: true });
            gameRenderer.setSize(width, height);
            container.appendChild(gameRenderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            gameScene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            gameScene.add(dirLight);

            // Zemin
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x339933 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            gameScene.add(floor);

            // Bacon Hair Karakteri
            const playerGroup = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.5, 0.6);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.75;
            playerGroup.add(body);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.8;
            playerGroup.add(head);

            const hairMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const hairGeo = new THREE.BoxGeometry(0.9, 0.3, 0.9);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 3.2;
            playerGroup.add(hair);

            playerMesh = playerGroup;
            gameScene.add(playerMesh);

            setupJoystick();

            function animate() {
                animationFrameId = requestAnimationFrame(animate);

                if(playerMesh) {
                    playerMesh.position.x += moveX * 0.1;
                    playerMesh.position.z += moveY_val * 0.1;
                    gameCamera.position.x = playerMesh.position.x;
                    gameCamera.position.z = playerMesh.position.z + 10;
                    gameCamera.lookAt(playerMesh.position);
                }

                gameRenderer.render(gameScene, gameCamera);
            }
            animate();
        }

        function setupJoystick() {
            const base = document.getElementById('virtual-joystick-base');
            const stick = document.getElementById('virtual-joystick-stick');
            if(!base || !stick) return;

            let isDragging = false;
            let center = { x: 60, y: 60 };

            base.ontouchstart = base.onmousedown = () => { isDragging = true; };

            window.ontouchend = window.onmouseup = () => {
                isDragging = false;
                moveX = 0;
                moveY_val = 0;
                stick.style.transform = `translate(0px, 0px)`;
            };

            window.ontouchmove = window.onmousemove = (e) => {
                if(!isDragging) return;
                const rect = base.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                let x = clientX - rect.left - center.x;
                let y = clientY - rect.top - center.y;
                
                const dist = Math.sqrt(x*x + y*y);
                const maxDist = 40;
                if(dist > maxDist) {
                    x = (x / dist) * maxDist;
                    y = (y / dist) * maxDist;
                }

                stick.style.transform = `translate(${x}px, ${y}px)`;
                moveX = x / maxDist;
                moveY_val = y / maxDist;
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderGames();
        });
    </script>
