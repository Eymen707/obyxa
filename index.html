<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craft Multiplayer - PeerJS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 8px; z-index: 10; pointer-events: auto;
        }
        input, button { padding: 8px; margin-top: 5px; border-radius: 4px; border: none; }
        button { background: #4f46e5; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #4338ca; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); border: 2px solid white; border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #inventory {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; z-index: 10;
        }
        .inv-slot {
            width: 50px; height: 50px; background: #333; border: 2px solid #555; display: flex;
            align-items: center; justify-content: center; color: white; cursor: pointer; border-radius: 4px;
        }
        .inv-slot.active { border-color: #f59e0b; }
    </style>
    <!-- Three.js ve PeerJS Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="ui">
        <h2>Mini Craft 1.19 Online</h2>
        <p id="status">Bağlantı kuruluyor...</p>
        <div id="connection-box">
            <input type="text" id="peer-id-input" placeholder="Arkadaşın ID'sini gir">
            <button onclick="connectToPeer()">Bağlan</button>
        </div>
        <p style="font-size: 11px; margin-top: 8px;">Benim ID: <span id="my-id" style="color: #34d399;">Bekleniyor...</span></p>
    </div>

    <div id="inventory">
        <div class="inv-slot active" onclick="selectBlock(1)" style="background: #8B4513;">Odun</div>
        <div class="inv-slot" onclick="selectBlock(2)" style="background: #A9A9A9;">Taş</div>
        <div class="inv-slot" onclick="selectBlock(3)" style="background: #228B22;">Yaprak</div>
    </div>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let myId = '';
        let moveable = true;
        let blocks = [];
        let selectedBlockType = 1; // 1: Odun, 2: Taş, 3: Yaprak

        // Karakter ve Oyuncu Pozisyonları
        let playerPos = { x: 0, y: 2, z: 5 };
        let otherPlayer;
        let velocityY = 0;
        let isGrounded = false;

        // Kontroller
        let keys = { forward: false, backward: false, left: false, right: false, jump: false };
        let pitch = 0, yaw = 0;

        init3D();
        initPeer();
        initControls();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Gökyüzü rengi

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Zemin (Çim)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x557a2b });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 1.19 Ağaçları ve Başlangıç Dünyası
            createInitialWorld();

            // Verity Adlı Sarı Top (İstediğin sarı gülümseyen top)
            const sphereGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffeb3b'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(80, 90, 15, 0, Math.PI*2); ctx.arc(176, 90, 15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(128, 140, 50, 0, Math.PI); ctx.stroke();
            
            const texture = new THREE.CanvasTexture(canvas);
            const sphereMat = new THREE.MeshBasicMaterial({ map: texture });
            const verityBall = new THREE.Mesh(sphereGeo, sphereMat);
            verityBall.position.set(5, 2, -5);
            scene.add(verityBall);

            // Diğer Oyuncu Karakteri (Saç ve kollar dahil detaylı model)
            otherPlayer = createCharacterModel();
            otherPlayer.position.set(0, 0, -3);
            scene.add(otherPlayer);

            window.addEventListener('resize', onWindowResize);
        }

        // Karakter Modeli Oluşturucu (Saç, gövde, kollar)
        function createCharacterModel() {
            const group = new THREE.Group();

            // Gövde (Mor/Mavi tonlar)
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            group.add(body);

            // Kafa
            const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.4;
            group.add(head);

            // Şapka/Saç Detayı
            const hairGeo = new THREE.BoxGeometry(0.44, 0.15, 0.44);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.62;
            group.add(hair);

            // Kollar
            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
            
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.45, 0.8, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.45, 0.8, 0);
            group.add(rightArm);

            // Bacaklar
            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x312e81 });
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.15, 0.35, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.15, 0.35, 0);
            group.add(rightLeg);

            return group;
        }

        function createInitialWorld() {
            // Birkaç başlangıç bloğu (Odun ve Yapraklar)
            for (let i = -2; i <= 2; i++) {
                addBlock(i, 0.5, -5, 1); // Odunlar
                addBlock(i, 1.5, -5, 3); // Yapraklar
            }
        }

        function addBlock(x, y, z, type) {
            let color = 0x8B4513; // Odun
            if (type === 2) color = 0xA9A9A9; // Taş
            if (type === 3) color = 0x228B22; // Yaprak

            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push({ mesh, x, y, z, type });
        }

        // PeerJS Bağlantı Sistemi
        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('my-id').innerText = id;
                document.getElementById('status').innerText = 'Çevrimiçi - Bağlantı Bekleniyor';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                document.getElementById('status').innerText = 'Bağlantı Kuruldu!';
            });
        }

        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value.trim();
            if (!peerId) return alert('Lütfen geçerli bir ID girin!');
            conn = peer.connect(peerId);
            setupConnectionEvents();
            document.getElementById('status').innerText = 'Bağlanılıyor...';
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                document.getElementById('status').innerText = 'Oyuncu Bağlandı!';
            });
            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    otherPlayer.position.set(data.x, data.y, data.z);
                    otherPlayer.rotation.y = data.yaw;
                } else if (data.type === 'addBlock') {
                    addBlock(data.x, data.y, data.z, data.blockType);
                } else if (data.type === 'removeBlock') {
                    removeBlockByIndex(data.index);
                }
            });
        }

        // Kontroller ve Mouse Kilitleme
        function initControls() {
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== document.body) return;
                yaw -= e.movementX * 0.003;
                pitch -= e.movementY * 0.003;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => handleKeys(e, true));
            document.addEventListener('keyup', (e) => handleKeys(e, false));
            document.addEventListener('mousedown', (e) => handleMouseClick(e));
        }

        function handleKeys(e, isDown) {
            switch (e.code) {
                case 'KeyW': keys.forward = isDown; break;
                case 'KeyS': keys.backward = isDown; break;
                case 'KeyA': keys.left = isDown; break;
                case 'KeyD': keys.right = isDown; break;
                case 'Space': if (isDown && isGrounded) { velocityY = 0.12; isGrounded = false; } break;
            }
        }

        function selectBlock(type) {
            selectedBlockType = type;
            document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Blok Koyma ve Kırma (Odun Kır / Ev Yap)
        function handleMouseClick(e) {
            if (document.pointerLockElement !== document.body) return;

            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);

            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const index = blocks.findIndex(b => b.mesh === hit.object);

                if (e.button === 0) { // Sol tık: Blok Kır (Odun kırma vb.)
                    if (index > -1) {
                        scene.remove(blocks[index].mesh);
                        blocks.splice(index, 1);
                        if (conn && conn.open) conn.send({ type: 'removeBlock', index: index });
                    }
                } else if (e.button === 2) { // Sağ tık: Blok Koy (Ev yapma)
                    const normal = hit.face.normal;
                    const pos = hit.object.position.clone().add(normal);
                    addBlock(pos.x, pos.y, pos.z, selectedBlockType);
                    if (conn && conn.open) {
                        conn.send({ type: 'addBlock', x: pos.x, y: pos.y, z: pos.z, blockType: selectedBlockType });
                    }
                }
            }
        }

        // Sağ tık menüsünü engelle
        document.addEventListener('contextmenu', e => e.preventDefault());

        function removeBlockByIndex(index) {
            if (blocks[index]) {
                scene.remove(blocks[index].mesh);
                blocks.splice(index, 1);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Oyun Döngüsü (Animasyon ve Fizik)
        function animate() {
            requestAnimationFrame(animate);

            // Hareket Hesaplama
            const speed = 0.08;
            const dir = new THREE.Vector3();
            if (keys.forward) dir.z -= 1;
            if (keys.backward) dir.z += 1;
            if (keys.left) dir.x -= 1;
            if (keys.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            playerPos.x += dir.x * speed;
            playerPos.z += dir.z * speed;

            // Basit Yerçekimi
            velocityY -= 0.006;
            playerPos.y += velocityY;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            camera.position.set(playerPos.x, playerPos.y, playerPos.z);

            // Konumu karşı tarafa gönder
            if (conn && conn.open) {
                conn.send({ type: 'pos', x: playerPos.x, y: playerPos.y, z: playerPos.z, yaw: yaw });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
