<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GAMERWOST Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b071a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    
    /* LAUNCHER & MENÜ */
    #launcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: linear-gradient(135deg, #0b071a 0%, #1b0c3a 50%, #080314 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .badge { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(255,170,0,0.2); }
    .title { font-size: 36px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(45deg, #a855f7, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(168,85,247,0.4); margin-bottom: 10px; }
    .dev-status { color: #94a3b8; font-size: 14px; margin-bottom: 30px; text-align: center; }
    .play-btn { background: linear-gradient(90deg, #8b5cf6, #3b82f6); border: none; color: #fff; padding: 16px 48px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px rgba(139,92,246,0.6); transition: transform 0.2s; }
    .play-btn:active { transform: scale(0.95); }

    /* OYUN İÇİ ARAYÜZ (GAME UI) */
    #game-container { width: 100vw; height: 100vh; position: relative; }
    .touch-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
    
    /* KONTROLLER - YUKARIDA VE ERİŞİLEBİLİR KONUMDA */
    #joystick-zone { position: absolute; bottom: 70px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px); }
    #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: radial-gradient(circle, #a855f7, #6366f1); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 15px rgba(168,85,247,0.8); }
    
    #jump-btn { position: absolute; bottom: 80px; right: 40px; width: 85px; height: 85px; background: radial-gradient(circle, #06b6d4, #3b82f6); border: 3px solid #fff; border-radius: 50%; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 0 20px rgba(6,182,212,0.6); }
    #jump-btn:active { transform: scale(0.9); }

    #exit-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: bold; pointer-events: auto; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- LAUNCHER / ANA MENÜ -->
  <div id="launcher">
    <div class="badge">Uygulama Hali Gelişme Aşamasında</div>
    <div class="title">GAMERWOST</div>
    <div class="dev-status">Sürüm v0.2 | obyxa yapımı</div>
    <button class="play-btn" onclick="startGame()">OYUNA BAŞLA</button>
  </div>

  <!-- 3D OYUN ALANI -->
  <div id="game-container">
    <div class="touch-ui" id="game-ui">
      <button id="exit-btn" onclick="stopGame()">Menüye Dön</button>
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <div id="jump-btn">ZILPA</div>
    </div>
  </div>

<script>
  let scene, camera, renderer, animationFrameId;
  let playerGroup, playerBox;
  let collidableBoxes = [];
  let moveVector = { x: 0, z: 0 };
  let velocityY = 0;
  let isGrounded = true;
  const speed = 0.16;
  const gravity = -0.014;
  const jumpForce = 0.35;
  let walkTime = 0;
  let leftArm, rightArm, leftLeg, rightLeg;

  function initEngine() {
    const container = document.getElementById('game-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(30, 50, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Logo Kaplaması
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#2b1464'; ctx.fillRect(0, 0, 512, 512);
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#a855f7'); grad.addColorStop(1, '#06b6d4');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(256, 256, 180, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1464';
    ctx.beginPath(); ctx.arc(275, 256, 110, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = grad; ctx.fillRect(230, 216, 180, 80);
    ctx.fillStyle = '#c77dff'; ctx.fillRect(140, 236, 50, 16); ctx.fillRect(157, 219, 16, 50);
    const logoTex = new THREE.CanvasTexture(canvas);

    // Karakter (GAMERWOST)
    playerGroup = new THREE.Group();
    playerBox = new THREE.Box3();

    const torsoMat = [
      new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
      new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
      new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
      new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
      new THREE.MeshStandardMaterial({ map: logoTex }),
      new THREE.MeshStandardMaterial({ color: 0x2b1464 })
    ];
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.3, 0.7), torsoMat);
    torso.position.y = 1.45; torso.castShadow = true;
    playerGroup.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
    head.position.y = 2.5; head.castShadow = true;
    playerGroup.add(head);

    const capMat = new THREE.MeshStandardMaterial({ color: 0x1e4ba0 });
    const capTop = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.25, 0.85), capMat);
    capTop.position.set(0, 2.9, 0);
    const capVisor = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.05, 0.35), capMat);
    capVisor.position.set(0, 2.8, 0.5);
    playerGroup.add(capTop, capVisor);

    const cyanMat = new THREE.MeshStandardMaterial({ color: 0x1bb5a6 });
    const purpleMat = new THREE.MeshStandardMaterial({ color: 0x2b1464 });

    function makeLimb(mat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.1, 0.45), mat);
      m.castShadow = true; return m;
    }

    leftArm = makeLimb(cyanMat); leftArm.position.set(-0.85, 1.35, 0);
    rightArm = makeLimb(cyanMat); rightArm.position.set(0.85, 1.35, 0);
    leftLeg = makeLimb(purpleMat); leftLeg.position.set(-0.35, 0.55, 0);
    rightLeg = makeLimb(purpleMat); rightLeg.position.set(0.35, 0.55, 0);
    playerGroup.add(leftArm, rightArm, leftLeg, rightLeg);
    scene.add(playerGroup);

    // Zemin ve Engeller (Fizik / Çarpışma Kutuları Eklendi)
    collidableBoxes = [];
    const floorGeo = new THREE.BoxGeometry(80, 2, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -1; floor.receiveShadow = true;
    scene.add(floor);
    
    const floorBox = new THREE.Box3().setFromObject(floor);
    collidableBoxes.push(floorBox);

    // Platformlar ve Duvarlar (Karakter İçinden Geçemez)
    const pColors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6];
    for(let i = 0; i < 20; i++) {
      const w = 4 + Math.random() * 3;
      const h = 2 + Math.random() * 5;
      const d = 4 + Math.random() * 3;
      const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: pColors[i % pColors.length] }));
      p.position.set((Math.random() - 0.5) * 50, h / 2, (Math.random() - 0.5) * 50);
      p.castShadow = true; p.receiveShadow = true;
      scene.add(p);

      const pBox = new THREE.Box3().setFromObject(p);
      collidableBoxes.push(pBox);
    }
  }

  // ÇARPIŞMA KONTROLÜ (SOLID COLLISION)
  function checkCollision(newPos) {
    const tempGroup = playerGroup.clone();
    tempGroup.position.copy(newPos);
    const tempBox = new THREE.Box3().setFromObject(tempGroup);

    for (let box of collidableBoxes) {
      if (box.intersectsBox(tempBox)) {
        return true; // Engel var, geçilemez
      }
    }
    return false;
  }

  function startGame() {
    document.getElementById('launcher').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';
    if(!scene) initEngine();
    animate();
  }

  function stopGame() {
    document.getElementById('launcher').style.display = 'flex';
    document.getElementById('game-ui').style.display = 'none';
    cancelAnimationFrame(animationFrameId);
  }

  // JOUSTICK HAREKETİ
  const joystickZone = document.getElementById('joystick-zone');
  const joystickKnob = document.getElementById('joystick-knob');
  let dragging = false, touchId = null, center = { x: 0, y: 0 };

  joystickZone.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchId = t.identifier; dragging = true;
    const r = joystickZone.getBoundingClientRect();
    center = { x: r.left + r.width/2, y: r.top + r.height/2 };
    updateJ(t);
  });

  window.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    for(let t of e.changedTouches) if(t.identifier === touchId) updateJ(t);
  });

  window.addEventListener('touchend', (e) => {
    for(let t of e.changedTouches) {
      if(t.identifier === touchId) {
        dragging = false; joystickKnob.style.transform = `translate(0px, 0px)`;
        moveVector = { x: 0, z: 0 };
      }
    }
  });

  function updateJ(t) {
    let dx = t.clientX - center.x, dy = t.clientY - center.y;
    let dist = Math.hypot(dx, dy), maxR = 35;
    if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    moveVector.x = dx / maxR; moveVector.z = dy / maxR;
  }

  document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(isGrounded) { velocityY = jumpForce; isGrounded = false; }
  });

  function animate() {
    animationFrameId = requestAnimationFrame(animate);

    // Y Ekseni Fizik ve Yerçekimi
    velocityY += gravity;
    let nextPosY = playerGroup.position.y + velocityY;

    if (nextPosY <= 0) {
      nextPosY = 0; velocityY = 0; isGrounded = true;
    }
    playerGroup.position.y = nextPosY;

    // X/Z Pozisyon Kontrolü (Duvar Çarpışması)
    let nextPosX = playerGroup.position.x + moveVector.x * speed;
    let nextPosZ = playerGroup.position.z + moveVector.z * speed;

    let targetPos = playerGroup.position.clone();
    targetPos.x = nextPosX;

    if (!checkCollision(targetPos)) {
      playerGroup.position.x = nextPosX;
    }

    targetPos.x = playerGroup.position.x;
    targetPos.z = nextPosZ;

    if (!checkCollision(targetPos)) {
      playerGroup.position.z = nextPosZ;
    }

    // Yürüme Animasyonu & Dönüş
    if(moveVector.x !== 0 || moveVector.z !== 0) {
      playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
      walkTime += 0.2;
      leftArm.rotation.x = Math.sin(walkTime) * 0.5;
      rightArm.rotation.x = -Math.sin(walkTime) * 0.5;
      leftLeg.rotation.x = -Math.sin(walkTime) * 0.5;
      rightLeg.rotation.x = Math.sin(walkTime) * 0.5;
    } else {
      leftArm.rotation.x = 0; rightArm.rotation.x = 0;
      leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
    }

    // Kamera Takibi
    camera.position.x = playerGroup.position.x;
    camera.position.y = playerGroup.position.y + 5.5;
    camera.position.z = playerGroup.position.z + 8.5;
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.4, playerGroup.position.z);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    if(camera && renderer) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });
</script>
</body>
</html>
