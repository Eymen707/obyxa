<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamerwost - Otomatik Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.7); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #status-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px;
            font-size: 12px; z-index: 10; pointer-events: none;
        }
        /* Mobil Kontrol Tuşları */
        #mobile-controls {
            position: absolute; bottom: 90px; left: 0; width: 100%; display: flex;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .m-btn {
            width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; color: white; font-size: 18px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
        }
        .m-btn:active { background: rgba(255,255,255,0.5); }
        
        #action-buttons {
            position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10;
        }
        .act-btn {
            width: 65px; height: 65px; border-radius: 50%; border: none; font-weight: bold; color: white; font-size: 11px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-break { background: #ef4444; }
        #btn-place { background: #22c55e; }

        /* Envanter Çubuğu */
        #inventory {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; z-index: 10;
        }
        .inv-slot {
            width: 45px; height: 45px; background: #222; border: 2px solid #555; display: flex;
            align-items: center; justify-content: center; color: white; cursor: pointer; border-radius: 6px; font-size: 11px;
        }
        .inv-slot.active { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.6); }
    </style>
    <!-- Three.js ve PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="status-bar">Gamerwost - Otomatik bağlanılıyor...</div>

    <!-- Mobil Yön Tuşları -->
    <div id="mobile-controls">
        <div class="control-group">
            <div style="display:flex; justify-content:center;"><div class="m-btn" ontouchstart="setKey('forward', true)" ontouchend="setKey('forward', false)">⬆️</div></div>
            <div style="display:flex; gap:20px;">
                <div class="m-btn" ontouchstart="setKey('left', true)" ontouchend="setKey('left', false)">⬅️</div>
                <div class="m-btn" ontouchstart="setKey('right', true)" ontouchend="setKey('right', false)">➡️</div>
            </div>
            <div style="display:flex; justify-content:center;"><div class="m-btn" ontouchstart="setKey('backward', true)" ontouchend="setKey('backward', false)">⬇️</div></div>
        </div>
    </div>

    <!-- Aksiyon Tuşları (Zıpla / Kır / Koy) -->
    <div id="action-buttons">
        <button class="act-btn" onclick="triggerJump()" style="background:#3b82f6;">Zıpla</button>
        <button class="act-btn" id="btn-break" onclick="breakBlock()">Kır</button>
        <button class="act-btn" id="btn-place" onclick="placeBlock()">Koy</button>
    </div>

    <!-- Envanter -->
    <div id="inventory">
        <div class="inv-slot active" onclick="selectBlock(1)" style="background: #8B4513;">Odun</div>
        <div class="inv-slot" onclick="selectBlock(2)" style="background: #A9A9A9;">Taş</div>
        <div class="inv-slot" onclick="selectBlock(3)" style="background: #228B22;">Yaprak</div>
    </div>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let blocks = [];
        let selectedBlockType = 1;

        let playerPos = { x: 0, y: 2, z: 5 };
        let velocityY = 0;
        let isGrounded = false;
        let pitch = 0, yaw = 0;

        let keys = { forward: false, backward: false, left: false, right: false };
        let otherPlayer, myHands;

        let touchX = 0, touchY = 0, isTouchingScreen = false;

        init3D();
        initAutoPeer();
        initControls();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Zemin
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x557a2b }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createVerity();
            createInitialWorld();

            // Karşı Oyuncu (Saç, gövde, kollar)
            otherPlayer = createFullCharacterModel();
            otherPlayer.position.set(0, 0, -4);
            scene.add(otherPlayer);

            // Kendi Kollarımız
            myHands = createFirstPersonHands();
            camera.add(myHands);
            scene.add(camera);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Verity - Sarı Gülümseyen Top
        function createVerity() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffeb3b'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(80, 90, 14, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(176, 90, 14, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 8; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.arc(128, 130, 45, 0, Math.PI); ctx.stroke();

            const verity = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
            verity.position.set(5, 1.5, -5);
            scene.add(verity);
        }

        function createFullCharacterModel() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x4f46e5 }));
            body.position.y = 0.8; group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.4; group.add(head);
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.15, 0.44), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
            hair.position.y = 1.62; group.add(hair);

            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
            const lArm = new THREE.Mesh(armGeo, armMat); lArm.position.set(-0.45, 0.8, 0); group.add(lArm);
            const rArm = new THREE.Mesh(armGeo, armMat); rArm.position.set(0.45, 0.8, 0); group.add(rArm);

            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x312e81 });
            const lLeg = new THREE.Mesh(legGeo, legMat); lLeg.position.set(-0.15, 0.35, 0); group.add(lLeg);
            const rLeg = new THREE.Mesh(legGeo, legMat); rLeg.position.set(0.15, 0.35, 0); group.add(rLeg);

            return group;
        }

        function createFirstPersonHands() {
            const group = new THREE.Group();
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }));
            rArm.position.set(0.4, -0.3, -0.5);
            group.add(rArm);
            return group;
        }

        function createInitialWorld() {
            for (let i = -3; i <= 3; i++) {
                addBlock(i, 0.5, -6, 1);
                addBlock(i, 1.5, -6, 3);
            }
        }

        function addBlock(x, y, z, type) {
            let color = 0x8B4513;
            if (type === 2) color = 0xA9A9A9;
            if (type === 3) color = 0x228B22;

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: color }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push({ mesh, x, y, z, type });
        }

        // --- ID'SİZ OTOMATİK BAĞLANTI (Gamerwost Özel Oda) ---
        function initAutoPeer() {
            const roomId = "gamerwost-global-room-2026";
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                document.getElementById('status-bar').innerText = 'Gamerwost - Oda Kuruldu (Oyuncu Bekleniyor)';
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Oda zaten doluysa 2. oyuncu olarak direkt bağlan
                    connectToRoom(roomId);
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                document.getElementById('status-bar').innerText = 'Gamerwost - Biri Katıldı!';
            });
        }

        function connectToRoom(roomId) {
            setTimeout(() => {
                if (!conn) {
                    conn = peer.connect(roomId);
                    setupConnectionEvents();
                    document.getElementById('status-bar').innerText = 'Gamerwost - Oyuncuya Bağlandı!';
                }
            }, 500);
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                document.getElementById('status-bar').innerText = 'Gamerwost - Bağlantı Aktif!';
            });
            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    otherPlayer.position.set(data.x, data.y, data.z);
                    otherPlayer.rotation.y = data.yaw;
                } else if (data.type === 'addBlock') {
                    addBlock(data.x, data.y, data.z, data.blockType);
                } else if (data.type === 'removeBlock') {
                    removeBlockByIndex(data.index);
                }
            });
        }

        function setKey(action, state) {
            keys[action] = state;
        }

        function triggerJump() {
            if (isGrounded) { velocityY = 0.12; isGrounded = false; }
        }

        function initControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.classList.contains('inv-slot')) return;
                isTouchingScreen = true;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            document.addEventListener('touchmove', (e) => {
                if (!isTouchingScreen) return;
                let dx = e.touches[0].clientX - touchX;
                let dy = e.touches[0].clientY - touchY;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;

                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('touchend', () => { isTouchingScreen = false; });
        }

        function selectBlock(type) {
            selectedBlockType = type;
            document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function breakBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const index = blocks.findIndex(b => b.mesh === hit.object);
                if (index > -1) {
                    scene.remove(blocks[index].mesh);
                    blocks.splice(index, 1);
                    if (conn && conn.open) conn.send({ type: 'removeBlock', index: index });
                }
            }
        }

        function placeBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const normal = hit.face.normal;
                const pos = hit.object.position.clone().add(normal);
                addBlock(pos.x, pos.y, pos.z, selectedBlockType);
                if (conn && conn.open) {
                    conn.send({ type: 'addBlock', x: pos.x, y: pos.y, z: pos.z, blockType: selectedBlockType });
                }
            }
        }

        function removeBlockByIndex(index) {
            if (blocks[index]) {
                scene.remove(blocks[index].mesh);
                blocks.splice(index, 1);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.08;
            const dir = new THREE.Vector3();
            if (keys.forward) dir.z -= 1;
            if (keys.backward) dir.z += 1;
            if (keys.left) dir.x -= 1;
            if (keys.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            playerPos.x += dir.x * speed;
            playerPos.z += dir.z * speed;

            velocityY -= 0.006;
            playerPos.y += velocityY;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            camera.position.set(playerPos.x, playerPos.y, playerPos.z);

            if (conn && conn.open) {
                conn.send({ type: 'pos', x: playerPos.x, y: playerPos.y, z: playerPos.z, yaw: yaw });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
