<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craft 3D - Direct PeerJS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.8);
            padding: 15px; border-radius: 8px; z-index: 10; border: 1px solid #444;
        }
        input, button { padding: 8px; margin-top: 5px; border-radius: 4px; border: none; font-weight: bold; }
        button { background: #6366f1; color: white; cursor: pointer; }
        button:hover { background: #4f46e5; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.7); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #inventory {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; z-index: 10;
        }
        .inv-slot {
            width: 55px; height: 55px; background: #222; border: 2px solid #555; display: flex;
            align-items: center; justify-content: center; color: white; cursor: pointer; border-radius: 6px; font-size: 12px;
        }
        .inv-slot.active { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.5); }
    </style>
    <!-- Three.js ve PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="ui">
        <h3 style="margin:0 0 5px 0; color:#818cf8;">Minecraft 1.19 P2P Multiplayer</h3>
        <p id="status" style="font-size:13px; margin:5px 0;">Bağlantı başlatılıyor...</p>
        <div id="connection-box">
            <input type="text" id="peer-id-input" placeholder="Arkadaşın ID'sini yaz...">
            <button onclick="connectToPeer()">Bağlan</button>
        </div>
        <p style="font-size: 11px; margin: 8px 0 0 0;">Benim ID'im: <span id="my-id" style="color: #34d399; user-select:all;">Yükleniyor...</span></p>
    </div>

    <!-- Envanter / Blok Seçimi -->
    <div id="inventory">
        <div class="inv-slot active" onclick="selectBlock(1)" style="background: #8B4513;">Odun</div>
        <div class="inv-slot" onclick="selectBlock(2)" style="background: #A9A9A9;">Taş</div>
        <div class="inv-slot" onclick="selectBlock(3)" style="background: #228B22;">Yaprak</div>
    </div>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let myId = '';
        let blocks = [];
        let selectedBlockType = 1;

        // Oyuncu Pozisyonu ve Görüş Açısı
        let playerPos = { x: 0, y: 2, z: 5 };
        let velocityY = 0;
        let isGrounded = false;
        let pitch = 0, yaw = 0;

        let keys = { forward: false, backward: false, left: false, right: false };
        let otherPlayer;
        let myHands; // Birinci şahısta kendi kollarımız

        init3D();
        initPeer();
        initControls();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Gökyüzü

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Işıklar
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Çim Zemin
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x557a2b });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // --- VERITY (Sarı Gülümseyen Top) ---
            createVerity();

            // Başlangıç Ağaçları / Blokları (Odun kırıp ev yapmak için)
            createInitialWorld();

            // Karşı Tarafın Karakteri (Senin dışındaki oyuncu seni saçınla, gövdenle ve kollarınla görür)
            otherPlayer = createFullCharacterModel();
            otherPlayer.position.set(0, 0, -4);
            scene.add(otherPlayer);

            // Senin Birinci Şahıs Kolların (Kendi ekranında kollarını görürsün)
            myHands = createFirstPersonHands();
            camera.add(myHands);
            scene.add(camera);

            window.addEventListener('resize', onWindowResize);
        }

        // Verity - Sarı Gülümseyen Top Sahnede
        function createVerity() {
            const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
            
            // Yüz deseni için Canvas Texture oluşturma
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffeb3b'; ctx.fillRect(0, 0, 256, 256); // Sarı zemin
            // Gözler
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(80, 90, 14, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(176, 90, 14, 0, Math.PI * 2); ctx.fill();
            // Gülümseme
            ctx.lineWidth = 8; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.arc(128, 130, 45, 0, Math.PI); ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: texture });
            const verity = new THREE.Mesh(sphereGeo, mat);
            verity.position.set(6, 1.5, -6);
            scene.add(verity);
        }

        // Karşı Oyuncu İçin Tam Model (Saç, Gövde, Kollar, Bacaklar)
        function createFullCharacterModel() {
            const group = new THREE.Group();

            // Gövde
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x4f46e5 }));
            body.position.y = 0.8; group.add(body);

            // Kafa ve Saç
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.4; group.add(head);
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.15, 0.44), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
            hair.position.y = 1.62; group.add(hair);

            // Kollar
            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
            const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.45, 0.8, 0); group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.45, 0.8, 0); group.add(rightArm);

            // Bacaklar
            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x312e81 });
            const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.15, 0.35, 0); group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.15, 0.35, 0); group.add(rightLeg);

            return group;
        }

        // Birinci Şahıs Görüşü İçin Kendi Ellerimiz/Kollarımız
        function createFirstPersonHands() {
            const group = new THREE.Group();
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
            
            // Sağ Kol
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), armMat);
            rArm.position.set(0.4, -0.3, -0.5);
            group.add(rArm);

            return group;
        }

        function createInitialWorld() {
            // Başlangıç odunları ve yaprakları (Odun kırıp ev yapmak için)
            for (let i = -3; i <= 3; i++) {
                addBlock(i, 0.5, -6, 1); // Odun blokları
                addBlock(i, 1.5, -6, 3); // Yaprak blokları
            }
        }

        function addBlock(x, y, z, type) {
            let color = 0x8B4513; // Odun
            if (type === 2) color = 0xA9A9A9; // Taş
            if (type === 3) color = 0x228B22; // Yaprak

            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push({ mesh, x, y, z, type });
        }

        // PeerJS Bağlantısı
        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('my-id').innerText = id;
                document.getElementById('status').innerText = 'Bağlantıya hazır. ID paylaş veya bağlan!';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                document.getElementById('status').innerText = 'Arkadaşın bağlandı!';
            });
        }

        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value.trim();
            if (!peerId) return alert('Lütfen arkadaşının Peer ID kodunu gir!');
            conn = peer.connect(peerId);
            setupConnectionEvents();
            document.getElementById('status').innerText = 'Bağlanılıyor...';
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                document.getElementById('status').innerText = 'Online Oynanıyor!';
            });
            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    otherPlayer.position.set(data.x, data.y, data.z);
                    otherPlayer.rotation.y = data.yaw;
                } else if (data.type === 'addBlock') {
                    addBlock(data.x, data.y, data.z, data.blockType);
                } else if (data.type === 'removeBlock') {
                    removeBlockByIndex(data.index);
                }
            });
        }

        // Kontroller ve Mouse Kilitleme
        function initControls() {
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== document.body) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => handleKeys(e, true));
            document.addEventListener('keyup', (e) => handleKeys(e, false));
            document.addEventListener('mousedown', (e) => handleMouseClick(e));
        }

        function handleKeys(e, isDown) {
            switch (e.code) {
                case 'KeyW': keys.forward = isDown; break;
                case 'KeyS': keys.backward = isDown; break;
                case 'KeyA': keys.left = isDown; break;
                case 'KeyD': keys.right = isDown; break;
                case 'Space': if (isDown && isGrounded) { velocityY = 0.12; isGrounded = false; } break;
            }
        }

        function selectBlock(type) {
            selectedBlockType = type;
            document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Blok Kırma (Odun kırma) ve Blok Koyma (Ev yapma)
        function handleMouseClick(e) {
            if (document.pointerLockElement !== document.body) return;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const index = blocks.findIndex(b => b.mesh === hit.object);

                if (e.button === 0) { // Sol Tık: Odun / Blok Kır
                    if (index > -1) {
                        scene.remove(blocks[index].mesh);
                        blocks.splice(index, 1);
                        if (conn && conn.open) conn.send({ type: 'removeBlock', index: index });
                    }
                } else if (e.button === 2) { // Sağ Tık: Blok Koy (Ev yap)
                    const normal = hit.face.normal;
                    const pos = hit.object.position.clone().add(normal);
                    addBlock(pos.x, pos.y, pos.z, selectedBlockType);
                    if (conn && conn.open) {
                        conn.send({ type: 'addBlock', x: pos.x, y: pos.y, z: pos.z, blockType: selectedBlockType });
                    }
                }
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());

        function removeBlockByIndex(index) {
            if (blocks[index]) {
                scene.remove(blocks[index].mesh);
                blocks.splice(index, 1);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Oyun Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            // Hareket Mantığı
            const speed = 0.08;
            const dir = new THREE.Vector3();
            if (keys.forward) dir.z -= 1;
            if (keys.backward) dir.z += 1;
            if (keys.left) dir.x -= 1;
            if (keys.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            playerPos.x += dir.x * speed;
            playerPos.z += dir.z * speed;

            // Yerçekimi
            velocityY -= 0.006;
            playerPos.y += velocityY;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            camera.position.set(playerPos.x, playerPos.y, playerPos.z);

            // Pozisyonu arkadaşına PeerJS ile bildir
            if (conn && conn.open) {
                conn.send({ type: 'pos', x: playerPos.x, y: playerPos.y, z: playerPos.z, yaw: yaw });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
