<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GAMERWOST - Voxel Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090514; color: #fff; }
        
        /* ARAYÜZ STİLLERİ */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: #0d091a; }
        .hidden { display: none !important; }
        .logo { font-size: 3rem; font-weight: bold; color: #a855f7; margin-bottom: 20px; text-shadow: 0 0 20px #a855f7; }
        
        /* MOBİL SOL ALT MARKA BİLGİSİ */
        #watermark { position: absolute; bottom: 15px; left: 15px; font-weight: bold; font-size: 14px; color: rgba(255,255,255,0.7); z-index: 20; pointer-events: none; }
        
        .card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px; border: 1px solid #a855f7; width: 90%; max-width: 400px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-size: 1rem; }
        input { background: #1a152b; color: white; border: 1px solid #4c1d95; }
        button { background: #9333ea; color: white; font-weight: bold; cursor: pointer; }

        /* DÜNYA LİSTESİ */
        .world-list { width: 100%; max-height: 200px; overflow-y: auto; margin-top: 15px; }
        .world-item { background: rgba(255,255,255,0.1); padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

        #game-hud { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- SOL ALT YAZI -->
    <div id="watermark">obyxa</div>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="screen">
        <h1 class="logo">GAMERWOST</h1>
        <div class="card">
            <h2>Kullanıcı Girişi</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="login()">Giriş Yap / Kaydol</button>
        </div>
    </div>

    <!-- ANA MENÜ / DÜNYA SEÇİMİ VE YAYINLAMA -->
    <div id="menu-screen" class="screen hidden">
        <h1 class="logo">GAMERWOST LOBİ</h1>
        <div class="card">
            <h3>Topluluk Dünyaları</h3>
            <div class="world-list" id="world-list"></div>
            <hr style="margin: 15px 0; border-color: #4c1d95;">
            <h3>Kendi Dünyanı Oluştur & Yayınla</h3>
            <input type="text" id="new-world-name" placeholder="Dünya Adı">
            <button onclick="createWorld()">Dünyayı Oluştur & Yayınla</button>
        </div>
    </div>

    <!-- OYUN HUD -->
    <div id="game-hud" class="hidden">
        <div class="crosshair"></div>
        <button onclick="exitGame()" style="position: absolute; top: 15px; right: 15px; width: auto; pointer-events: auto; background: #ef4444;">Ayrıl</button>
    </div>

    <div id="canvas-container" style="width:100%; height:100%;"></div>

    <script>
        // Örnek Veritabanı Mantığı (Local Storage)
        let currentUser = "";
        let worlds = JSON.parse(localStorage.getItem('gw_worlds')) || [
            { name: "Aop Eşya Dünyası", author: "Aop", id: 1 },
            { name: "Mega Blok Parkur", author: "GamerWost", id: 2 }
        ];

        function login() {
            const user = document.getElementById('username').value.trim();
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('menu-screen').classList.remove('hidden');
                renderWorlds();
            }
        }

        function renderWorlds() {
            const list = document.getElementById('world-list');
            list.innerHTML = "";
            worlds.forEach(w => {
                const item = document.createElement('div');
                item.className = "world-item";
                item.innerHTML = `<span><b>${w.name}</b> (${w.author})</span> <button onclick="joinWorld('${w.name}')" style="width:auto; padding:5px 10px;">Katıl</button>`;
                list.appendChild(item);
            });
        }

        function createWorld() {
            const name = document.getElementById('new-world-name').value.trim();
            if (name) {
                worlds.push({ name: name, author: currentUser, id: Date.now() });
                localStorage.setItem('gw_worlds', JSON.stringify(worlds));
                renderWorlds();
                document.getElementById('new-world-name').value = "";
            }
        }

        /* 3D MOTOR BAŞLANGICI */
        let scene, camera, renderer;

        function joinWorld(worldName) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Zemin Blokları
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshLambertMaterial({ color: 0x9333ea });
            for(let x = -5; x <= 5; x++) {
                for(let z = -5; z <= 5; z++) {
                    const block = new THREE.Mesh(geo, mat);
                    block.position.set(x, 0, z);
                    scene.add(block);
                }
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function exitGame() {
            location.reload();
        }
    </script>
</body>
</html>
