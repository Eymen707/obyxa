<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamerwost - Minecraft Web Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0f1020; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #menu {
            position: absolute; z-index: 10; background: rgba(15, 16, 32, 0.95);
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px;
            border: 4px solid #7c3aed; padding: 20px; text-align: center;
        }
        h1 { font-size: 3rem; color: #a855f7; text-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        .btn {
            background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none;
            padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        input { padding: 12px; font-size: 1rem; border-radius: 6px; border: 2px solid #7c3aed; background: #1e1b4b; color: white; width: 250px; text-align: center; }
        
        #ui { position: absolute; top: 15px; left: 15px; z-index: 5; pointer-events: none; font-size: 1rem; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; z-index: 5; pointer-events: none; }
        
        #inventory {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; z-index: 5;
            border: 2px solid #7c3aed;
        }
        .slot {
            width: 45px; height: 45px; border: 2px solid #555; display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; border-radius: 6px; background: #222; font-size: 0.75rem; text-align: center;
        }
        .slot.active { border-color: #a855f7; box-shadow: 0 0 10px #a855f7; }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: 90px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 5; pointer-events: none;
        }
        .control-group { display: flex; gap: 10px; pointer-events: auto; }
        .m-btn {
            background: rgba(124, 58, 237, 0.7); border: 2px solid #a855f7; color: white; width: 60px; height: 60px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .m-btn:active { background: rgba(139, 92, 246, 0.9); transform: scale(0.95); }

        #action-buttons {
            position: absolute; right: 20px; bottom: 90px; display: flex; flex-direction: column; gap: 10px; z-index: 5;
        }

        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Three.js & PeerJS CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>GAMERWOST</h1>
        <p>Minecraft Web Edition (PC & Mobile Multiplayer)</p>
        <button class="btn" onclick="startGame()">START GAME</button>
        <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center;">
            <input type="text" id="roomIdInput" placeholder="Enter Room ID to Join">
            <button class="btn" style="padding: 12px 20px; font-size: 1rem;" onclick="joinGame()">JOIN</button>
        </div>
        <p id="roomStatus" style="font-size: 0.9rem; color: #a855f7;"></p>
    </div>

    <div id="ui">
        <div>Mode: <span id="modeText">Host / Single</span></div>
        <div>Room ID: <span id="myIdDisplay">-</span></div>
        <div>Blocks: <span id="blockCount">0</span></div>
    </div>

    <div id="crosshair"></div>

    <!-- Mobile On-Screen Controls -->
    <div id="mobile-controls">
        <div class="control-group">
            <button class="m-btn" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)" onmousedown="setMove('left', true)" onmouseup="setMove('left', false)">◀</button>
            <button class="m-btn" ontouchstart="setMove('backward', true)" ontouchend="setMove('backward', false)" onmousedown="setMove('backward', true)" onmouseup="setMove('backward', false)">▼</button>
            <button class="m-btn" ontouchstart="setMove('forward', true)" ontouchend="setMove('forward', false)" onmousedown="setMove('forward', true)" onmouseup="setMove('forward', false)">▲</button>
            <button class="m-btn" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)">▶</button>
        </div>
    </div>

    <div id="action-buttons">
        <button class="m-btn" style="background: rgba(220, 38, 38, 0.7); border-color: #ef4444;" onclick="mobileAction('break')">⛏</button>
        <button class="m-btn" style="background: rgba(16, 185, 129, 0.7); border-color: #34d399;" onclick="mobileAction('place')">➕</button>
        <button class="m-btn" onclick="mobileJump()">⬆</button>
    </div>

    <div id="inventory">
        <div class="slot active" style="background:#55aa55;" onclick="selectBlock(1, this)">Grass</div>
        <div class="slot" style="background:#8b4513;" onclick="selectBlock(2, this)">Dirt</div>
        <div class="slot" style="background:#808080;" onclick="selectBlock(3, this)">Stone</div>
        <div class="slot" style="background:#deb887;" onclick="selectBlock(4, this)">Wood</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let blocks = {};
        let selectedBlockType = 1;
        let peer, conn;
        let isHost = true;
        let roomId = "";
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2(0, 0);

        const blockColors = {
            1: 0x55aa55, // Grass
            2: 0x8b4513, // Dirt
            3: 0x808080, // Stone
            4: 0xdeb887  // Wood
        };

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            loadWorld();

            window.addEventListener('resize', onWindowResize);
            initControls();
            animate();
        }

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();

        function setMove(dir, status) {
            if(dir === 'forward') moveForward = status;
            if(dir === 'backward') moveBackward = status;
            if(dir === 'left') moveLeft = status;
            if(dir === 'right') moveRight = status;
        }

        function mobileJump() {
            if(canJump) { velocity.y += 8; canJump = false; }
        }

        function mobileAction(actionType) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if(intersects.length > 0) {
                const intersect = intersects[0];
                const pos = intersect.object.userData;
                if(pos && pos.y !== undefined) {
                    if(actionType === 'break') {
                        removeBlock(pos.x, pos.y, pos.z);
                    } else if(actionType === 'place') {
                        const normal = intersect.face.normal;
                        createBlock(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z, selectedBlockType);
                    }
                }
            }
        }

        function initControls() {
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveForward = true;
                if(e.code === 'KeyS') moveBackward = true;
                if(e.code === 'KeyA') moveLeft = true;
                if(e.code === 'KeyD') moveRight = true;
                if(e.code === 'Space' && canJump) { velocity.y += 8; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveForward = false;
                if(e.code === 'KeyS') moveBackward = false;
                if(e.code === 'KeyA') moveLeft = false;
                if(e.code === 'KeyD') moveRight = false;
            });

            // Touch look controls for mobile / Mouse look for PC
            let isDragging = false;
            let previousTouchPosition = { x: 0, y: 0 };

            document.addEventListener('touchstart', (e) => {
                if(e.touches.length === 1 && e.target.tagName === 'DIV' && e.target.id === 'canvas-container') {
                    isDragging = true;
                    previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            document.addEventListener('touchmove', (e) => {
                if(!isDragging) return;
                let currentTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                let deltaX = currentTouch.x - previousTouchPosition.x;
                let deltaY = currentTouch.y - previousTouchPosition.y;

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));

                previousTouchPosition = currentTouch;
            });

            document.addEventListener('touchend', () => { isDragging = false; });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            document.body.addEventListener('click', () => {
                if(document.getElementById('menu').style.display === 'none' && window.innerWidth > 768) {
                    document.body.requestPointerLock();
                }
            });
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            initEngine();
            initPeer();
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => {
                roomId = id;
                document.getElementById('myIdDisplay').innerText = id;
            });
            peer.on('connection', (connection) => {
                conn = connection;
                isHost = true;
                document.getElementById('modeText').innerText = "Host (Connected)";
                setupConnection();
                conn.on('open', () => {
                    conn.send({ type: 'WORLD_SYNC', blocks: blocks });
                });
            });
        }

        function joinGame() {
            const idToJoin = document.getElementById('roomIdInput').value;
            if(!idToJoin) return alert("Please enter a valid Room ID!");
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(idToJoin);
                isHost = false;
                document.getElementById('modeText').innerText = "Client (Joined)";
                setupConnection();
                document.getElementById('menu').style.display = 'none';
                initEngine();
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if(data.type === 'BLOCK_ACTION') {
                    if(data.action === 'add') {
                        createBlock(data.x, data.y, data.z, data.blockType, false);
                    } else if(data.action === 'remove') {
                        removeBlock(data.x, data.y, data.z, false);
                    }
                } else if(data.type === 'WORLD_SYNC' && !isHost) {
                    blocks = data.blocks;
                    rebuildWorld();
                }
            });
        }

        function selectBlock(type, element) {
            selectedBlockType = type;
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function saveWorld() {
            localStorage.setItem('gamerwost_world', JSON.stringify(blocks));
        }

        function loadWorld() {
            const saved = localStorage.getItem('gamerwost_world');
            if(saved) {
                blocks = JSON.parse(saved);
                rebuildWorld();
            } else {
                for(let x = -4; x <= 4; x++) {
                    for(let z = -4; z <= 4; z++) {
                        createBlock(x, 0, z, 1, false);
                    }
                }
            }
        }

        function rebuildWorld() {
            scene.children.forEach(child => {
                if(child.isMesh && child.geometry.type === 'BoxGeometry') {
                    scene.remove(child);
                }
            });
            for(let key in blocks) {
                let coords = key.split(',').map(Number);
                createBlock(coords[0], coords[1], coords[2], blocks[key], false);
            }
        }

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function createBlock(x, y, z, type, broadcast = true) {
            const key = `${x},${y},${z}`;
            if(blocks[key] && broadcast) return;

            blocks[key] = type;
            const material = new THREE.MeshLambertMaterial({ color: blockColors[type] });
            const cube = new THREE.Mesh(boxGeo, material);
            cube.position.set(x, y, z);
            cube.userData = { x, y, z, type };
            scene.add(cube);

            saveWorld();
            updateCount();

            if(broadcast && conn && conn.open) {
                conn.send({ type: 'BLOCK_ACTION', action: 'add', x, y, z, blockType: type });
            }
        }

        function removeBlock(x, y, z, broadcast = true) {
            const key = `${x},${y},${z}`;
            if(!blocks[key]) return;

            delete blocks[key];
            scene.children.forEach(child => {
                if(child.isMesh && child.userData && child.userData.x === x && child.userData.y === y && child.userData.z === z) {
                    scene.remove(child);
                }
            });

            saveWorld();
            updateCount();

            if(broadcast && conn && conn.open) {
                conn.send({ type: 'BLOCK_ACTION', action: 'remove', x, y, z });
            }
        }

        function updateCount() {
            document.getElementById('blockCount').innerText = Object.keys(blocks).length;
        }

        window.addEventListener('click', (e) => {
            if(document.getElementById('menu').style.display !== 'none' || window.innerWidth <= 768) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if(intersects.length > 0) {
                const pos = intersects[0].object.userData;
                if(pos && pos.y !== undefined && e.button === 0) removeBlock(pos.x, pos.y, pos.z);
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if(document.getElementById('menu').style.display !== 'none' || window.innerWidth <= 768) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if(intersects.length > 0) {
                const intersect = intersects[0];
                const normal = intersect.face.normal;
                const pos = intersect.object.userData;
                if(pos) createBlock(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z, selectedBlockType);
            }
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 3.0 * delta;

            let dirZ = Number(moveForward) - Number(moveBackward);
            let dirX = Number(moveRight) - Number(moveLeft);

            if (moveForward || moveBackward) velocity.z -= dirZ * 40.0 * delta;
            if (moveLeft || moveRight) velocity.x -= dirX * 40.0 * delta;

            camera.translateX(velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
                canJump = true;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
