<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>obyxa001 - Retro Roblox 2014 & 3D Simülatör Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: Arial, sans-serif; background-color: #e3e3e3; margin: 0; padding: 0; }
        .roblox-header { background: linear-gradient(180deg, #0074e8 0%, #004fb0 100%); border-bottom: 2px solid #00367d; }
        .roblox-card { background-color: #ffffff; border: 1px solid #c3c3c3; }
        .btn-green { background: linear-gradient(180deg, #02b700 0%, #008200 100%); border: 1px solid #004d00; color: white; font-weight: bold; }
        #joystick-base { position: absolute; bottom: 30px; left: 30px; width: 110px; height: 110px; background: rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; z-index: 100; touch-action: none; }
        #joystick-stick { position: absolute; top: 27px; left: 27px; width: 50px; height: 50px; background: radial-gradient(circle, #ffffff 0%, #a1a5ab 100%); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="roblox-header text-white h-16 flex items-center justify-between px-4 sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-black italic text-xl px-3 py-1 rounded shadow">obyxa<span class="text-yellow-300">001</span></div>
            <span class="font-bold text-sm">Retro Roblox 2014 & 3D Studio</span>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-4">
        <div class="roblox-card p-4 rounded-lg shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-blue-600">3D Simülatör ve Oyun Dünyaları</h1>
                <p class="text-xs text-gray-500">Muscle, Speed, Futbol ve Araba Yarışı modlarından birini seç!</p>
            </div>
        </div>

        <div id="tab-games" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </main>

    <div id="game-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col">
        <div class="roblox-header p-3 flex justify-between items-center text-white z-30">
            <div>
                <span id="active-game-title" class="font-bold text-sm">3D Oyun</span>
                <span id="stat-display" class="ml-4 text-xs bg-black/40 px-2 py-1 rounded text-yellow-300 font-bold">Skor: 10</span>
            </div>
            <button onclick="closeGame()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold cursor-pointer">✕ Çıkış</button>
        </div>
        
        <div id="canvas-container" class="relative flex-1 w-full h-full overflow-hidden">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
            <div class="absolute bottom-6 right-6 z-30">
                <button onclick="triggerAction()" class="bg-gradient-to-r from-yellow-400 to-amber-600 text-black font-black px-6 py-4 rounded-full shadow-2xl border-4 border-white text-sm cursor-pointer">🔥 ANTRENMAN / ŞUT</button>
            </div>
        </div>
    </div>

    <script>
        const gamesList = [
            { id: 'muscle', title: '💪 Muscle Legends 3D', desc: 'Ağırlık kaldır, kaslan, devasa Bacon ol!', color: 'from-orange-500 to-red-600', statName: 'Kas Gücü' },
            { id: 'speed', title: '⚡ Speed Run 3D', desc: 'Koş, hızını artır ve rekor kır!', color: 'from-amber-400 to-yellow-600', statName: 'Hız' },
            { id: 'football', title: '⚽ Roblox Football 2014', desc: 'Topa vur, kaleye gol at ve skor topla!', color: 'from-green-500 to-emerald-700', statName: 'Gol Sayısı' },
            { id: 'racing', title: '🏎️ Retro Street Racing 3D', desc: 'Roblox arabası sür, engellerden kaç!', color: 'from-blue-500 to-indigo-600', statName: 'Yarış Puanı' }
        ];

        let currentGame = null, playerStat = 10, scene, camera, renderer, player, animId;
        let moveX = 0, moveZ = 0, walkCycle = 0, leftArm, rightArm, leftLeg, rightLeg;

        function renderGames() {
            document.getElementById('tab-games').innerHTML = gamesList.map(g => `
                <div class="roblox-card p-4 rounded-lg shadow cursor-pointer space-y-3" onclick='openGame(${JSON.stringify(g)})'>
                    <div class="h-32 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-lg text-center p-2">${g.title}</div>
                    <p class="text-xs text-gray-500">${g.desc}</p>
                    <button class="w-full btn-green py-2 rounded text-xs">OYUNA GİR</button>
                </div>
            `).join('');
        }

        function openGame(game) {
            currentGame = game;
            playerStat = 10;
            document.getElementById('active-game-title').innerText = game.title;
            document.getElementById('stat-display').innerText = `${game.statName}: 10`;
            document.getElementById('game-modal').classList.remove('hidden');
            setTimeout(init3D, 150);
        }

        function closeGame() {
            document.getElementById('game-modal').classList.add('hidden');
            if(animId) cancelAnimationFrame(animId);
            const c = document.querySelector('#canvas-container canvas');
            if(c) c.remove();
        }

        function triggerAction() {
            playerStat += 5;
            document.getElementById('stat-display').innerText = `${currentGame.statName}: ${playerStat}`;
            if(player && currentGame.id === 'muscle') {
                let s = 1 + (playerStat / 100);
                player.scale.set(s, s, s);
            }
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth, h = container.clientHeight;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 1000);
            camera.position.set(0, 6, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.6);
            light.position.set(10, 20, 10);
            scene.add(light);

            const floorColor = currentGame.id === 'football' ? 0x2e7d32 : 0x339933;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: floorColor }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // R6 Karakter (Kollar & Bacaklar Hareketli)
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), new THREE.MeshStandardMaterial({ color: 0x0055ff }));
            body.position.y = 2.1;
            player.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
            head.position.y = 3.2;
            player.add(head);

            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.9), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
            hair.position.y = 3.65;
            player.add(hair);

            const limbMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), limbMat);
            leftArm.position.set(-0.95, 2.1, 0);
            player.add(leftArm);

            rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), limbMat);
            rightArm.position.set(0.95, 2.1, 0);
            player.add(rightArm);

            leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), limbMat);
            leftLeg.position.set(-0.35, 0.7, 0);
            player.add(leftLeg);

            rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), limbMat);
            rightLeg.position.set(0.35, 0.7, 0);
            player.add(rightLeg);

            scene.add(player);
            setupJoystick();

            function animate() {
                animId = requestAnimationFrame(animate);
                if(moveX !== 0 || moveZ !== 0) {
                    player.position.x += moveX * 0.15;
                    player.position.z += moveZ * 0.15;
                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.6;
                    rightArm.rotation.x = -Math.sin(walkCycle) * 0.6;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.6;
                    rightLeg.rotation.x = Math.sin(walkCycle) * 0.6;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 12;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
                renderer.render(scene, camera);
            }
            animate();
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base'), stick = document.getElementById('joystick-stick');
            let dragging = false;
            base.ontouchstart = base.onmousedown = (e) => { dragging = true; e.preventDefault(); };
            window.ontouchend = window.onmouseup = () => { dragging = false; moveX = 0; moveZ = 0; stick.style.transform = 'translate(0px,0px)'; };
            window.ontouchmove = window.onmousemove = (e) => {
                if(!dragging) return;
                const rect = base.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let x = clientX - rect.left - 55, y = clientY - rect.top - 55;
                let dist = Math.sqrt(x*x + y*y), max = 35;
                if(dist > max) { x = (x/dist)*max; y = (y/dist)*max; }
                stick.style.transform = `translate(${x}px, ${y}px)`;
                moveX = x / max; moveZ = y / max;
            };
        }

        window.onload = renderGames;
    </script>
</body>
</html>
