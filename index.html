<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamerwost - Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #status-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 20px;
            font-size: 12px; z-index: 10; pointer-events: none; border: 1px solid #555;
            text-align: center;
        }
        /* Mobil Yön Tuşları */
        #mobile-controls {
            position: absolute; bottom: 100px; left: 0; width: 100%; display: flex;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .m-btn {
            width: 55px; height: 55px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%; color: white; font-size: 16px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
        }
        .m-btn:active { background: rgba(255,255,255,0.6); }
        
        #action-buttons {
            position: absolute; bottom: 105px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .act-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-weight: bold; color: white; font-size: 11px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        #btn-break { background: #ef4444; }
        #btn-place { background: #22c55e; }

        /* 12 Slotlu Envanter Çubuğu (Kaydırılabilir) */
        #inventory {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(0,0,0,0.85); padding: 6px; border-radius: 8px; z-index: 10; 
            border: 1px solid #444; max-width: 95vw; overflow-x: auto;
        }
        .inv-slot {
            width: 38px; height: 38px; background: #222; border: 2px solid #555; display: flex;
            align-items: center; justify-content: center; color: white; cursor: pointer; border-radius: 5px; font-size: 9px; flex-shrink: 0; text-align: center;
        }
        .inv-slot.active { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.7); }
    </style>
    <!-- Three.js ve PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="status-bar">Gamerwost - Bağlantı kuruluyor...</div>

    <!-- Mobil Yön Tuşları -->
    <div id="mobile-controls">
        <div class="control-group">
            <div style="display:flex; justify-content:center;"><div class="m-btn" ontouchstart="setKey('forward', true)" ontouchend="setKey('forward', false)">⬆️</div></div>
            <div style="display:flex; gap:20px;">
                <div class="m-btn" ontouchstart="setKey('left', true)" ontouchend="setKey('left', false)">⬅️</div>
                <div class="m-btn" ontouchstart="setKey('right', true)" ontouchend="setKey('right', false)">➡️</div>
            </div>
            <div style="display:flex; justify-content:center;"><div class="m-btn" ontouchstart="setKey('backward', true)" ontouchend="setKey('backward', false)">⬇️</div></div>
        </div>
    </div>

    <!-- Aksiyon Tuşları -->
    <div id="action-buttons">
        <button class="act-btn" onclick="triggerJump()" style="background:#3b82f6;">Zıpla</button>
        <button class="act-btn" id="btn-break" onclick="breakBlock()">Kır</button>
        <button class="act-btn" id="btn-place" onclick="placeBlock()">Koy</button>
    </div>

    <!-- Tam 12 Bloklu Envanter -->
    <div id="inventory">
        <div class="inv-slot active" onclick="selectBlock(1, this)" style="background: #8B4513;">Odun</div>
        <div class="inv-slot" onclick="selectBlock(2, this)" style="background: #A9A9A9;">Taş</div>
        <div class="inv-slot" onclick="selectBlock(3, this)" style="background: #228B22;">Yaprak</div>
        <div class="inv-slot" onclick="selectBlock(4, this)" style="background: #8B7355;">Toprak</div>
        <div class="inv-slot" onclick="selectBlock(5, this)" style="background: #B22222;">Tuğla</div>
        <div class="inv-slot" onclick="selectBlock(6, this)" style="background: #DEB887;">Kum</div>
        <div class="inv-slot" onclick="selectBlock(7, this)" style="background: #4682B4;">Demir</div>
        <div class="inv-slot" onclick="selectBlock(8, this)" style="background: #FFD700; color:#000;">Altın</div>
        <div class="inv-slot" onclick="selectBlock(9, this)" style="background: #00FFFF; color:#000;">Elmas</div>
        <div class="inv-slot" onclick="selectBlock(10, this)" style="background: #800080;">Nether</div>
        <div class="inv-slot" onclick="selectBlock(11, this)" style="background: #556B2F;">Çimen</div>
        <div class="inv-slot" onclick="selectBlock(12, this)" style="background: #FFFFFF; color:#000;">Yün</div>
    </div>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let blocks = [];
        let selectedBlockType = 1;

        let playerPos = { x: 0, y: 2, z: 5 };
        let velocityY = 0;
        let isGrounded = false;
        let pitch = 0, yaw = 0;

        let keys = { forward: false, backward: false, left: false, right: false };
        let otherPlayer, myHands;

        let touchX = 0, touchY = 0, isTouchingScreen = false;

        init3D();
        initReliablePeer();
        initControls();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Zemin
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x557a2b }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createSmallVerity();
            createInitialWorld();

            // Karşı Oyuncu (Görünürlük garantili model)
            otherPlayer = createFullCharacterModel();
            otherPlayer.position.set(0, 1.6, -4);
            scene.add(otherPlayer);

            // Kendi Kollarımız
            myHands = createFirstPersonHands();
            camera.add(myHands);
            scene.add(camera);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Küçük Sarı Top Verity
        function createSmallVerity() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffeb3b'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(80, 90, 14, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(176, 90, 14, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 8; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.arc(128, 130, 45, 0, Math.PI); ctx.stroke();

            const verity = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
            verity.position.set(4, 1, -4);
            scene.add(verity);
        }

        function createFullCharacterModel() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x4f46e5 }));
            body.position.y = 0.4; group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.0; group.add(head);
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.15, 0.44), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
            hair.position.y = 1.22; group.add(hair);

            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
            const lArm = new THREE.Mesh(armGeo, armMat); lArm.position.set(-0.45, 0.4, 0); group.add(lArm);
            const rArm = new THREE.Mesh(armGeo, armMat); rArm.position.set(0.45, 0.4, 0); group.add(rArm);

            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x312e81 });
            const lLeg = new THREE.Mesh(legGeo, legMat); lLeg.position.set(-0.15, -0.35, 0); group.add(lLeg);
            const rLeg = new THREE.Mesh(legGeo, legMat); rLeg.position.set(0.15, -0.35, 0); group.add(rLeg);

            return group;
        }

        function createFirstPersonHands() {
            const group = new THREE.Group();
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }));
            rArm.position.set(0.4, -0.3, -0.5);
            group.add(rArm);
            return group;
        }

        function createInitialWorld() {
            for (let i = -2; i <= 1; i++) {
                addBlock(i, 0.5, -5, 1);
                addBlock(i, 1.5, -5, 3);
            }
            addBlock(-2, 2.5, -5, 2);
            addBlock(-1, 2.5, -5, 2);
            addBlock(0, 2.5, -5, 2);
            addBlock(1, 2.5, -5, 2);
        }

        function getBlockColor(type) {
            switch(type) {
                case 1: return 0x8B4513; // Odun
                case 2: return 0xA9A9A9; // Taş
                case 3: return 0x228B22; // Yaprak
                case 4: return 0x8B7355; // Toprak
                case 5: return 0xB22222; // Tuğla
                case 6: return 0xDEB887; // Kum
                case 7: return 0x4682B4; // Demir
                case 8: return 0xFFD700; // Altın
                case 9: return 0x00FFFF; // Elmas
                case 10: return 0x800080; // Nether
                case 11: return 0x556B2F; // Çimen
                case 12: return 0xFFFFFF; // Yün
                default: return 0x8B4513;
            }
        }

        function addBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: getBlockColor(type) }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push({ mesh, x, y, z, type });
        }

        function checkCollision(nx, nz) {
            const playerRadius = 0.35;
            for (let b of blocks) {
                if (Math.abs(nx - b.x) < 0.5 + playerRadius && Math.abs(nz - b.z) < 0.5 + playerRadius) {
                    if (playerPos.y < b.y + 1.0 && playerPos.y + 1.8 > b.y) {
                        return true;
                    }
                }
            }
            return false;
        }

        // --- KESİN ÇÖZÜMLÜ OTOMATİK EŞLEŞME (Gamerwost Host/Client) ---
        function initReliablePeer() {
            const roomPrefix = "gamerwost_room_v2_";
            // İlk açan Host (1), ikinci açan Client (2) olur
            let myRoleNum = Math.floor(Math.random() * 90000) + 10000;
            
            peer = new Peer(roomPrefix + "host");

            peer.on('open', (id) => {
                document.getElementById('status-bar').innerText = 'Gamerwost - Oda Kuruldu (Oyuncu Bekleniyor...)';
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Oda dolu, demek ki 2. oyuncusun -> Host'a bağlan!
                    connectToHost(roomPrefix + "host");
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                document.getElementById('status-bar').innerText = 'Gamerwost - Oyuncu Bağlandı!';
            });
        }

        function connectToHost(hostId) {
            if (peer) { try { peer.destroy(); } catch(e){} }
            peer = new Peer();

            peer.on('open', () => {
                document.getElementById('status-bar').innerText = 'Odaya bağlanılıyor...';
                conn = peer.connect(hostId);
                setupConnectionEvents();
            });
        }

        function setupConnectionEvents() {
            if (!conn) return;

            conn.on('open', () => {
                document.getElementById('status-bar').innerText = 'Gamerwost - Multiplayer Aktif!';
            });

            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    otherPlayer.position.set(data.x, data.y, data.z);
                    otherPlayer.rotation.y = data.yaw;
                } else if (data.type === 'addBlock') {
                    addBlock(data.x, data.y, data.z, data.blockType);
                } else if (data.type === 'removeBlock') {
                    removeBlockByIndex(data.index);
                }
            });

            conn.on('close', () => {
                document.getElementById('status-bar').innerText = 'Bağlantı koptu.';
            });
        }

        function setKey(action, state) {
            keys[action] = state;
        }

        function triggerJump() {
            if (isGrounded) { velocityY = 0.12; isGrounded = false; }
        }

        function initControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.classList.contains('inv-slot')) return;
                isTouchingScreen = true;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            document.addEventListener('touchmove', (e) => {
                if (!isTouchingScreen) return;
                let dx = e.touches[0].clientX - touchX;
                let dy = e.touches[0].clientY - touchY;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;

                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('touchend', () => { isTouchingScreen = false; });
        }

        function selectBlock(type, element) {
            selectedBlockType = type;
            document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function breakBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const index = blocks.findIndex(b => b.mesh === hit.object);
                if (index > -1) {
                    scene.remove(blocks[index].mesh);
                    blocks.splice(index, 1);
                    if (conn && conn.open) conn.send({ type: 'removeBlock', index: index });
                }
            }
        }

        function placeBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0];
                const normal = hit.face.normal;
                const pos = hit.object.position.clone().add(normal);
                addBlock(pos.x, pos.y, pos.z, selectedBlockType);
                if (conn && conn.open) {
                    conn.send({ type: 'addBlock', x: pos.x, y: pos.y, z: pos.z, blockType: selectedBlockType });
                }
            }
        }

        function removeBlockByIndex(index) {
            if (blocks[index]) {
                scene.remove(blocks[index].mesh);
                blocks.splice(index, 1);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.08;
            const dir = new THREE.Vector3();
            if (keys.forward) dir.z -= 1;
            if (keys.backward) dir.z += 1;
            if (keys.left) dir.x -= 1;
            if (keys.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            let nextX = playerPos.x + dir.x * speed;
            let nextZ = playerPos.z + dir.z * speed;

            if (!checkCollision(nextX, playerPos.z)) playerPos.x = nextX;
            if (!checkCollision(playerPos.x, nextZ)) playerPos.z = nextZ;

            velocityY -= 0.006;
            playerPos.y += velocityY;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            camera.position.set(playerPos.x, playerPos.y, playerPos.z);

            if (conn && conn.open) {
                conn.send({ type: 'pos', x: playerPos.x, y: playerPos.y, z: playerPos.z, yaw: yaw });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
