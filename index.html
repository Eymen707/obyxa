<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OBYXA - Think. Create. Play.</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: Verdana, Arial, sans-serif; background-color: #e3e3e3; color: #333; overflow: hidden; touch-action: none; }
    
    header { background: linear-gradient(to bottom, #0055b3, #003380); color: white; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #001f4d; }
    .logo { font-size: 28px; font-weight: bold; font-family: 'Arial Black', sans-serif; letter-spacing: 1px; color: #fff; text-shadow: 2px 2px #000; }
    .motto { font-size: 11px; color: #ffd700; font-style: italic; }

    nav { background: #1a539a; display: flex; overflow-x: auto; border-bottom: 2px solid #0f3460; padding: 0 10px; }
    nav button { background: none; border: none; color: white; padding: 10px 16px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; }
    nav button.active { background: #e3e3e3; color: #003380; border-radius: 5px 5px 0 0; }

    .container { padding: 15px; max-width: 950px; margin: 0 auto; height: calc(100vh - 90px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page { display: none; }
    .page.active { display: block; }

    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #003380; border-bottom: 2px solid #ccc; padding-bottom: 4px; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding-bottom: 30px; }
    
    /* BUTONA ÇEVRİLDİ - MOBİLDE %100 ÇALIŞIR */
    .game-card { background: white; border: 1px solid #b5b5b5; padding: 8px; border-radius: 4px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; font-family: inherit; }
    .game-card:active { background: #e3f2fd; border-color: #0055b3; transform: scale(0.98); }
    .game-thumb { width: 100%; height: 90px; border-radius: 3px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.6); pointer-events: none; }
    .game-title { font-weight: bold; font-size: 12px; color: #003380; margin-bottom: 2px; pointer-events: none; }
    .game-info { font-size: 10px; color: #666; pointer-events: none; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .item-card { background: white; border: 1px solid #ccc; padding: 10px; text-align: center; border-radius: 4px; font-size: 12px; }
    .item-card button { background: #28a745; color: white; border: none; padding: 6px 12px; margin-top: 8px; border-radius: 3px; cursor: pointer; font-weight: bold; width: 100%; }

    .char-select { display: inline-block; padding: 8px 12px; margin: 5px; background: #ddd; border: 2px solid #999; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .char-select.selected { background: #0055b3; color: white; border-color: #001f4d; }

    /* 3D Oyun Ekranı */
    #game-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; touch-action: none; }
    #canvas3d { width: 100%; height: 100%; display: block; touch-action: none; }
    
    .mobile-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
    .exit-btn { position: absolute; top: 15px; left: 15px; background: rgba(220,53,69,0.9); color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; pointer-events: auto; cursor: pointer; font-size: 13px; z-index: 10001; }
    .controls-hint { position: absolute; top: 15px; right: 15px; color: white; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 11px; text-align: right; }

    #workout-btn { position: absolute; top: 75px; left: 15px; background: #ff8f00; color: white; border: 3px solid #ff6f00; padding: 12px 20px; font-weight: bold; border-radius: 8px; pointer-events: auto; cursor: pointer; font-size: 14px; display: none; z-index: 10002; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

    /* Joystick & Zıpla */
    #joystick-zone { position: absolute; bottom: 90px; left: 35px; width: 130px; height: 130px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: auto; touch-action: none; }
    #joystick-knob { position: absolute; top: 37px; left: 37px; width: 56px; height: 56px; background: rgba(255,255,255,0.9); border-radius: 50%; pointer-events: none; touch-action: none; }

    #jump-btn { position: absolute; bottom: 100px; right: 35px; width: 85px; height: 85px; background: rgba(0, 85, 179, 0.85); border: 3px solid rgba(255,255,255,0.95); border-radius: 50%; color: white; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo">OBYXA</div>
      <div class="motto">Think. Create. Play.</div>
    </div>
  </header>

  <nav>
    <button class="active" onclick="switchTab('games', this)">Games</button>
    <button onclick="switchTab('catalog', this)">Catalog</button>
    <button onclick="switchTab('profile', this)">My Character</button>
  </nav>

  <div class="container">
    <div id="games" class="page active">
      <div class="section-title">Featured OBYXA Games (Top 6)</div>
      <div class="game-grid">
        <button class="game-card" onclick="window.loadGame('wing')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #00acc1, #00838f);">🪽 WING & JUMP SIM</div>
          <div class="game-title">Jump & Fly Simulator</div>
          <div class="game-info">Buy wings & jump high!</div>
        </button>
        <button class="game-card" onclick="window.loadGame('muscle')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #e65100, #ffb300);">💪 MUSCLE SIMULATOR</div>
          <div class="game-title">Muscle Legends Pro</div>
          <div class="game-info">Lift weights & grow huge!</div>
        </button>
        <button class="game-card" onclick="window.loadGame('speed')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #c62828, #ef5350);">⚡ SPEED SIMULATOR</div>
          <div class="game-title">Speed Runner Sim</div>
          <div class="game-info">Run fast across tracks!</div>
        </button>
        <button class="game-card" onclick="window.loadGame('obby')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #2e7d32, #66bb6a);">🧱 OBBY PARKOUR</div>
          <div class="game-title">Escape Subspace!</div>
          <div class="game-info">142 players online</div>
        </button>
        <button class="game-card" onclick="window.loadGame('cash')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #1565c0, #42a5f5);">💵 CASH SIMULATOR</div>
          <div class="game-title">Cash Tycoon Sim</div>
          <div class="game-info">Collect rich rewards!</div>
        </button>
        <button class="game-card" onclick="window.loadGame('zombie')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #37474f, #78909c);">🧟 SURVIVAL ARENA</div>
          <div class="game-title">Zombie Ocean Rescue</div>
          <div class="game-info">76 players online</div>
        </button>
      </div>
    </div>

    <div id="catalog" class="page">
      <div class="section-title">Avatar Catalog Gear & Wings</div>
      <div class="catalog-grid">
        <div class="item-card">
          <div style="font-size:32px;">🪽</div>
          <b>Angel Wings</b>
          <button onclick="equipHat('wings')">Equip Wings</button>
        </div>
        <div class="item-card">
          <div style="font-size:32px;">👑</div>
          <b>Golden Crown</b>
          <button onclick="equipHat('crown')">Equip Hat</button>
        </div>
        <div class="item-card">
          <div style="font-size:32px;">🎩</div>
          <b>Top Hat</b>
          <button onclick="equipHat('tophat')">Equip Hat</button>
        </div>
        <div class="item-card">
          <div style="font-size:32px;">🥷</div>
          <b>Ninja Mask</b>
          <button onclick="equipHat('ninja')">Equip Hat</button>
        </div>
      </div>
    </div>

    <div id="profile" class="page">
      <div class="section-title">Character Customizer</div>
      <div style="background:#fff; padding:20px; border-radius:4px; border:1px solid #ccc; text-align:center;">
        <div style="width:80px; height:80px; background:#ffd700; margin:0 auto 10px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:36px; border:2px solid #333;">🙂</div>
        <b style="font-size:15px; color:#003380;">Choose Your Avatar Style:</b><br><br>
        <div>
          <div id="btn-noob" class="char-select selected" onclick="setCharType('noob')">Classic Noob</div>
          <div id="btn-bacon" class="char-select" onclick="setCharType('bacon')">Bacon Hair</div>
        </div>
        <p style="font-size:12px; color:#555; margin-top:15px;">Equipped Gear: <span id="current-hat-label" style="font-weight:bold; color:#0055b3;">None</span></p>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div class="mobile-ui">
      <button class="exit-btn" onclick="exitGame()">✕ Exit Game</button>
      <button id="workout-btn" onclick="trainMuscle()">💪 TRAIN MUSCLE (+1)</button>
      <div class="controls-hint">PC: W,A,S,D + Space<br>Mobile: Joystick & Jump</div>
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <div id="jump-btn">JUMP</div>
    </div>
  </div>

  <script>
    let selectedChar = 'noob';
    let activeHat = 'none';
    let musclePower = 1;
    let jumpPower = 0.24;

    function switchTab(tabId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function setCharType(type) {
      selectedChar = type;
      document.getElementById('btn-noob').classList.toggle('selected', type === 'noob');
      document.getElementById('btn-bacon').classList.toggle('selected', type === 'bacon');
      alert('Avatar changed to ' + (type === 'noob' ? 'Classic Noob' : 'Bacon Hair') + '!');
    }

    function equipHat(hatName) {
      activeHat = (activeHat === hatName) ? 'none' : hatName;
      document.getElementById('current-hat-label').innerText = activeHat.toUpperCase();
      if(hatName === 'wings') jumpPower = 0.45;
      alert(activeHat === 'none' ? 'Gear removed.' : hatName.toUpperCase() + ' equipped!');
    }

    function trainMuscle() {
      musclePower += 0.15;
      if(player) {
        torsoMesh.scale.set(1 + musclePower*0.3, 1, 1 + musclePower*0.2);
        leftArmMesh.scale.set(1 + musclePower*0.4, 1, 1 + musclePower*0.4);
        rightArmMesh.scale.set(1 + musclePower*0.4, 1, 1 + musclePower*0.4);
      }
      document.getElementById('workout-btn').innerText = `💪 TRAIN MUSCLE (Power: ${musclePower.toFixed(1)})`;
    }

    let scene, camera, renderer, player, torsoMesh, leftArmMesh, rightArmMesh, leftLeg, rightLeg, hatMesh;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocityY = 0, gravity = -0.012, isGrounded = false;
    let touchMoveX = 0, touchMoveY = 0;
    let platforms = [];
    let animTime = 0;
    let animFrame;
    let currentGameType = '';

    window.loadGame = function(type) {
      currentGameType = type;
      musclePower = 1;
      document.getElementById('workout-btn').style.display = (type === 'muscle') ? 'block' : 'none';
      document.getElementById('game-container').style.display = 'block';
      init3D(type);
    }

    function exitGame() {
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('workout-btn').style.display = 'none';
      if(animFrame) cancelAnimationFrame(animFrame);
    }

    function init3D(type) {
      platforms = [];
      scene = new THREE.Scene();
      scene.background = new THREE.Color(type === 'zombie' ? 0x111122 : 0x87ceeb);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(20, 40, 20);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x777777));

      player = new THREE.Group();
      
      const headMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
      head.position.y = 1.4;
      
      const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const faceMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const leftEye = new THREE.Mesh(eyeGeo, faceMat); leftEye.position.set(-0.2, 1.5, 0.41);
      const rightEye = new THREE.Mesh(eyeGeo, faceMat); rightEye.position.set(0.2, 1.5, 0.41);
      const smile = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.1), faceMat); smile.position.set(0, 1.25, 0.41);
      player.add(head); player.add(leftEye); player.add(rightEye); player.add(smile);

      if (selectedChar === 'bacon') {
        const hairMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.9), hairMat);
        hair.position.set(0, 1.85, 0);
        player.add(hair);
      }

      const torsoMat = new THREE.MeshLambertMaterial({ color: selectedChar === 'bacon' ? 0x111111 : 0x0055b3 });
      torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), torsoMat);
      torsoMesh.position.y = 0.4;
      player.add(torsoMesh);

      const legGeo = new THREE.BoxGeometry(0.45, 1, 0.45);
      const legMat = new THREE.MeshLambertMaterial({ color: selectedChar === 'bacon' ? 0x333333 : 0x85b42c });
      leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.25, -0.7, 0);
      rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.25, -0.7, 0);
      player.add(leftLeg); player.add(rightLeg);

      const armGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
      const armMat = new THREE.MeshLambertMaterial({ color: selectedChar === 'bacon' ? 0xffffff : 0xffd700 });
      leftArmMesh = new THREE.Mesh(armGeo, armMat); leftArmMesh.position.set(-0.7, 0.4, 0);
      rightArmMesh = new THREE.Mesh(armGeo, armMat); rightArmMesh.position.set(0.7, 0.4, 0);
      player.add(leftArmMesh); player.add(rightArmMesh);

      if(activeHat !== 'none') {
        let hatGeo = activeHat === 'wings' ? new THREE.BoxGeometry(1.4, 0.6, 0.2) : (activeHat === 'crown' ? new THREE.CylinderGeometry(0.5, 0.4, 0.3, 6) : new THREE.BoxGeometry(0.8, 0.3, 0.8));
        let hatMat = new THREE.MeshLambertMaterial({ color: activeHat === 'wings' ? 0xffffff : (activeHat === 'crown' ? 0xffd700 : 0x222222) });
        hatMesh = new THREE.Mesh(hatGeo, hatMat);
        hatMesh.position.set(0, activeHat === 'wings' ? 0.6 : 1.95, activeHat === 'wings' ? -0.3 : 0);
        player.add(hatMesh);
      }

      player.position.set(0, 3, 0);
      scene.add(player);

      if(type === 'obby') {
        createPlatform(0, 0, 0, 10, 1, 10, 0x2e7d32);
        for(let i = 1; i <= 12; i++) {
          createPlatform(0, i * 1.4, -i * 5.5, 4, 0.8, 4, i % 2 === 0 ? 0xd32f2f : 0xfbc02d);
        }
        createPlatform(0, 18.5, -70, 10, 1, 10, 0x00acc1);
      } else if(type === 'wing') {
        createPlatform(0, 0, 0, 30, 1, 30, 0x00838f);
        createPlatform(0, 6, -15, 8, 1, 8, 0x00acc1);
        createPlatform(0, 14, -30, 6, 1, 6, 0x26c6da);
      } else if(type === 'speed') {
        createPlatform(0, 0, -40, 12, 1, 120, 0x222222);
      } else {
        createPlatform(0, 0, 0, 50, 1, 50, 0x263238);
        createPlatform(0, 1, -12, 8, 0.5, 8, 0xff8f00);
      }

      setupControls();
      animate();
    }

    function createPlatform(x, y, z, w, h, d, color) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshLambertMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      
      platforms.push({
        minX: x - w / 2, maxX: x + w / 2,
        minY: y - h / 2, maxY: y + h / 2,
        minZ: z - d / 2, maxZ: z + d / 2
      });
    }

    function setupControls() {
      window.onkeydown = (e) => {
        if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
        if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
        if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
        if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        if(e.code === 'Space') jump();
      };
      window.onkeyup = (e) => {
        if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
        if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
        if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
        if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
      };

      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      
      zone.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
      zone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.targetTouches[0];
        const rect = zone.getBoundingClientRect();
        const dx = touch.clientX - (rect.left + rect.width / 2);
        const dy = touch.clientY - (rect.top + rect.height / 2);
        const dist = Math.min(Math.hypot(dx, dy), 42);
        const angle = Math.atan2(dy, dx);

        knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        touchMoveX = (Math.cos(angle) * dist) / 42;
        touchMoveY = (Math.sin(angle) * dist) / 42;
      }, { passive: false });

      zone.addEventListener('touchend', (e) => {
        e.preventDefault();
        knob.style.transform = 'translate(0px, 0px)';
        touchMoveX = 0; touchMoveY = 0;
      }, { passive: false });

      const jumpBtn = document.getElementById('jump-btn');
      jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
      jumpBtn.onclick = jump;
    }

    function jump() {
      if(isGrounded) {
        velocityY = jumpPower;
        isGrounded = false;
      }
    }

    function animate() {
      animFrame = requestAnimationFrame(animate);

      let speed = (currentGameType === 'speed') ? 0.22 : 0.14;
      let dx = 0, dz = 0;

      if (moveForward) dz -= speed;
      if (moveBackward) dz += speed;
      if (moveLeft) dx -= speed;
      if (moveRight) dx += speed;

      if (Math.abs(touchMoveX) > 0.1 || Math.abs(touchMoveY) > 0.1) {
        dx = touchMoveX * speed;
        dz = touchMoveY * speed;
      }

      if (dx !== 0 || dz !== 0) {
        player.position.x += dx;
        player.position.z += dz;
        player.rotation.y = Math.atan2(dx, dz);

        animTime += 0.35;
