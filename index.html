<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GAMERWOST 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #game-container { width: 100vw; height: 100vh; position: relative; }
    
    /* Mobil Kontroller */
    .touch-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
    #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(138,43,226,0.8); border-radius: 50%; border: 2px solid #fff; }
    #jump-btn { position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px; background: rgba(0,229,255,0.6); border: 3px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
    #jump-btn:active { transform: scale(0.9); background: rgba(0,229,255,0.9); }
    
    /* UI Başlık */
    #ui-header { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #8a2be2; pointer-events: none; }
  </style>
  <!-- Three.js 3D Motoru -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <div id="ui-header">GAMERWOST 3D</div>
  <div class="touch-ui">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">ZILPA</div>
  </div>
</div>

<script>
  // --- 1. SAHNE VE KURULUM ---
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0b2e);
  scene.fog = new THREE.FogExp2(0x1a0b2e, 0.015);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // --- 2. IŞIKLANDIRMA (KOGAMA TARZI CANLI HAVA) ---
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(40, 60, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 150;
  const d = 40;
  dirLight.shadow.camera.left = -d;
  dirLight.shadow.camera.right = d;
  dirLight.shadow.camera.top = d;
  dirLight.shadow.camera.bottom = -d;
  scene.add(dirLight);

  // --- 3. GAMERWOST LOGO DOKUSU (CANVAS İLE BİREBİR) ---
  function createLogoTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#2b1464';
    ctx.fillRect(0, 0, 512, 512);

    const grad = ctx.createLinearGradient(50, 50, 450, 450);
    grad.addColorStop(0, '#9d4edd');
    grad.addColorStop(0.5, '#4895ef');
    grad.addColorStop(1, '#4cc9f0');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(256, 230, 180, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2b1464';
    ctx.beginPath();
    ctx.arc(270, 230, 110, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = grad;
    ctx.fillRect(230, 190, 180, 80);

    // D-Pad (+)
    ctx.fillStyle = '#c77dff';
    ctx.fillRect(130, 210, 50, 16);
    ctx.fillRect(147, 193, 16, 50);

    // Tuşlar
    ctx.fillStyle = '#4cc9f0';
    ctx.beginPath(); ctx.arc(360, 180, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(380, 210, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(360, 240, 12, 0, Math.PI*2); ctx.fill();

    return new THREE.CanvasTexture(canvas);
  }

  const logoTexture = createLogoTexture();

  // --- 4. KARAKTER OLUŞTURMA (GAMERWOST BLOK MODELİ) ---
  const playerGroup = new THREE.Group();

  // Gövde
  const torsoMat = [
    new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
    new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
    new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
    new THREE.MeshStandardMaterial({ color: 0x2b1464 }),
    new THREE.MeshStandardMaterial({ map: logoTexture }), // Ön taraf
    new THREE.MeshStandardMaterial({ color: 0x2b1464 })
  ];
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 0.8), torsoMat);
  torso.position.y = 1.7;
  torso.castShadow = true;
  playerGroup.add(torso);

  // Kafa
  const headMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.3 });
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), headMat);
  head.position.y = 2.85;
  head.castShadow = true;
  playerGroup.add(head);

  // Şapka
  const capMat = new THREE.MeshStandardMaterial({ color: 0x1e4ba0 });
  const capTop = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.3, 0.95), capMat);
  capTop.position.set(0, 3.3, 0);
  const capVisor = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.05, 0.4), capMat);
  capVisor.position.set(0, 3.2, 0.55);
  playerGroup.add(capTop, capVisor);

  // Kol ve Bacaklar
  const cyanMat = new THREE.MeshStandardMaterial({ color: 0x1bb5a6 });
  const purpleMat = new THREE.MeshStandardMaterial({ color: 0x2b1464 });

  function createLimb(colorMat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, 0.5), colorMat);
    mesh.castShadow = true;
    return mesh;
  }

  const leftArm = createLimb(cyanMat); leftArm.position.set(-1.0, 1.6, 0);
  const rightArm = createLimb(cyanMat); rightArm.position.set(1.0, 1.6, 0);
  const leftLeg = createLimb(purpleMat); leftLeg.position.set(-0.4, 0.65, 0);
  const rightLeg = createLimb(purpleMat); rightLeg.position.set(0.4, 0.65, 0);

  playerGroup.add(leftArm, rightArm, leftLeg, rightLeg);
  scene.add(playerGroup);

  // --- 5. KOGAMA TARZI HARİTA / PARKUR ---
  const floorGeo = new THREE.BoxGeometry(60, 2, 60);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x100826, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.y = -1;
  floor.receiveShadow = true;
  scene.add(floor);

  // Renkli Blok Platformlar
  const colors = [0xff0055, 0x00e5ff, 0xffbe0b, 0x8a2be2, 0x4cc9f0];
  const platforms = [];

  for(let i = 0; i < 25; i++) {
    const w = 3 + Math.random() * 4;
    const h = 1 + Math.random() * 6;
    const d = 3 + Math.random() * 4;
    const pGeo = new THREE.BoxGeometry(w, h, d);
    const pMat = new THREE.MeshStandardMaterial({ 
      color: colors[i % colors.length],
      roughness: 0.3,
      metalness: 0.1
    });
    const platform = new THREE.Mesh(pGeo, pMat);
    platform.position.set(
      (Math.random() - 0.5) * 45,
      h / 2,
      (Math.random() - 0.5) * 45
    );
    platform.receiveShadow = true;
    platform.castShadow = true;
    scene.add(platform);
    platforms.push(platform);
  }

  // dev 3D GAMERWOST Logosu (Arka Planda)
  const logoSignGeo = new THREE.BoxGeometry(12, 12, 1);
  const logoSignMat = new THREE.MeshStandardMaterial({ map: logoTexture, roughness: 0.2 });
  const logoSign = new THREE.Mesh(logoSignGeo, logoSignMat);
  logoSign.position.set(0, 12, -25);
  logoSign.castShadow = true;
  scene.add(logoSign);

  // --- 6. HAREKET VE FİZİK MANTIĞI ---
  let moveVector = { x: 0, z: 0 };
  let velocityY = 0;
  let isGrounded = true;
  const speed = 0.18;
  const gravity = -0.015;
  const jumpForce = 0.35;

  // --- 7. DOKUNMATİK JOYSICK ---
  const joystickZone = document.getElementById('joystick-zone');
  const joystickKnob = document.getElementById('joystick-knob');
  let dragging = false;
  let touchId = null;
  let center = { x: 0, y: 0 };

  joystickZone.addEventListener('touchstart', (e) => {
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    dragging = true;
    const rect = joystickZone.getBoundingClientRect();
    center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
    updateJoystick(touch);
  });

  window.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    for(let touch of e.changedTouches) {
      if(touch.identifier === touchId) updateJoystick(touch);
    }
  });

  window.addEventListener('touchend', (e) => {
    for(let touch of e.changedTouches) {
      if(touch.identifier === touchId) {
        dragging = false;
        joystickKnob.style.transform = `translate(0px, 0px)`;
        moveVector = { x: 0, z: 0 };
      }
    }
  });

  function updateJoystick(touch) {
    let dx = touch.clientX - center.x;
    let dy = touch.clientY - center.y;
    let dist = Math.hypot(dx, dy);
    let maxRadius = 35;

    if(dist > maxRadius) {
      dx = (dx / dist) * maxRadius;
      dy = (dy / dist) * maxRadius;
    }

    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    moveVector.x = dx / maxRadius;
    moveVector.z = dy / maxRadius;
  }

  // Zıplama Butonu
  document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(isGrounded) {
      velocityY = jumpForce;
      isGrounded = false;
    }
  });

  // --- 8. OYUN DÖNGÜSÜ & ANIMASYON ---
  let walkTime = 0;

  function animate() {
    requestAnimationFrame(animate);

    // Hareket & Yerçekimi
    playerGroup.position.x += moveVector.x * speed;
    playerGroup.position.z += moveVector.z * speed;

    velocityY += gravity;
    playerGroup.position.y += velocityY;

    // Basit Zemin Kontrolü
    if(playerGroup.position.y <= 0) {
      playerGroup.position.y = 0;
      velocityY = 0;
      isGrounded = true;
    }

    // Karakter Dönüş Yönü
    if(moveVector.x !== 0 || moveVector.z !== 0) {
      const angle = Math.atan2(moveVector.x, moveVector.z);
      playerGroup.rotation.y = angle;

      // Yürüme Animasyonu
      walkTime += 0.2;
      leftArm.rotation.x = Math.sin(walkTime) * 0.6;
      rightArm.rotation.x = -Math.sin(walkTime) * 0.6;
      leftLeg.rotation.x = -Math.sin(walkTime) * 0.6;
      rightLeg.rotation.x = Math.sin(walkTime) * 0.6;
    } else {
      leftArm.rotation.x = 0; rightArm.rotation.x = 0;
      leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
    }

    // Kamera Takibi (Kogama / Roblox Açısı)
    camera.position.x = playerGroup.position.x;
    camera.position.y = playerGroup.position.y + 6;
    camera.position.z = playerGroup.position.z + 10;
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

    renderer.render(scene, camera);
  }

  // Ekran Boyutu Değişimi
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
