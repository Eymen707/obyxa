<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obyxa - Retro Roblox Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #7887ff;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }
        .control-btn {
            position: absolute;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.4);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            cursor: pointer;
        }
        #jump-btn {
            right: 30px;
            width: 80px;
            height: 80px;
            font-size: 16px;
        }
        #joystick-base {
            left: 30px;
            bottom: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            position: absolute;
            z-index: 10;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>OBYXA - Classic Obby</h2>
        <div>Coins: <span id="coins">0</span> | Stage: <span id="stage">1</span>/3</div>
        <div style="font-size: 12px; margin-top: 5px;">Use WASD / Arrow Keys or On-screen Joystick to Move. Space to Jump!</div>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>
    <div id="jump-btn" class="control-btn">JUMP</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        const player = {
            x: 100,
            y: 300,
            width: 35,
            height: 50,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpForce: -11,
            grounded: false
        };

        let coins = 0;
        let stage = 1;
        let cameraX = 0;

        // Controls
        const keys = { left: false, right: false, up: false };
        let joystickActive = false;
        let joystickX = 0;

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') jump();
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        // Touch Joystick
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        joystickBase.addEventListener('touchstart', handleTouch, {passive: false});
        joystickBase.addEventListener('touchmove', handleTouch, {passive: false});
        joystickBase.addEventListener('touchend', () => {
            joystickActive = false;
            joystickX = 0;
            joystickStick.style.transform = `translate(0px, 0px)`;
        });

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            let dx = touch.clientX - cx;
            dx = Math.max(-30, Math.min(30, dx));
            joystickStick.style.transform = `translate(${dx}px, 0px)`;
            joystickX = dx / 30;
            joystickActive = true;
        }

        document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        document.getElementById('jump-btn').addEventListener('click', jump);

        function jump() {
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
        }

        // Level Platforms & Obstacles
        const platforms = [
            { x: 0, y: 450, w: 400, h: 100, type: 'normal' },
            { x: 450, y: 400, w: 120, h: 20, type: 'normal' },
            { x: 620, y: 340, w: 120, h: 20, type: 'normal' },
            { x: 800, y: 450, w: 200, h: 100, type: 'lava' }, // Lava trap
            { x: 1050, y: 380, w: 140, h: 20, type: 'normal' },
            { x: 1250, y: 310, w: 120, h: 20, type: 'normal' },
            { x: 1450, y: 450, w: 300, h: 100, type: 'finish' }
        ];

        const collectibleCoins = [
            { x: 480, y: 350, collected: false },
            { x: 660, y: 290, collected: false },
            { x: 1100, y: 330, collected: false }
        ];

        function respawn() {
            player.x = 100;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
        }

        // Game Loop
        function update() {
            // Movement logic
            if (keys.left || (joystickActive && joystickX < -0.2)) {
                player.vx = -player.speed;
            } else if (keys.right || (joystickActive && joystickX > 0.2)) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;
            player.vy += 0.5; // Gravity
            player.y += player.vy;

            player.grounded = false;

            // Platform collisions
            platforms.forEach(p => {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + p.h + player.vy
                ) {
                    if (p.type === 'lava') {
                        respawn();
                    } else if (p.type === 'finish') {
                        stage = 2;
                        document.getElementById('stage').innerText = stage;
                        respawn();
                    } else {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            });

            // Coin pickups
            collectibleCoins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 30) {
                    c.collected = true;
                    coins += 10;
                    document.getElementById('coins').innerText = coins;
                }
            });

            // Fall off screen
            if (player.y > canvas.height) {
                respawn();
            }

            // Camera follow
            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Draw Platforms
            platforms.forEach(p => {
                if (p.type === 'lava') {
                    ctx.fillStyle = '#ff3300';
                } else if (p.type === 'finish') {
                    ctx.fillStyle = '#33cc33';
                } else {
                    ctx.fillStyle = '#7a7a7a';
                }
                ctx.fillRect(p.x, p.y, p.w, p.h);
                
                // Classic Roblox Studs effect
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(p.x, p.y, p.w, 8);
            });

            // Draw Coins
            collectibleCoins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#cca100';
                    ctx.stroke();
                }
            });

            // Draw Classic Noob Avatar
            // Head (Yellow)
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(player.x + 2, player.y, 30, 30);
            // Face Eyes & Smile
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 8, player.y + 10, 4, 8);
            ctx.fillRect(player.x + 22, player.y + 10, 4, 8);
            ctx.fillRect(player.x + 12, player.y + 20, 10, 3);

            // Torso (Blue)
            ctx.fillStyle = '#0055b3';
            ctx.fillRect(player.x + 4, player.y + 30, 26, 25);

            // Legs (Green)
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(player.x + 6, player.y + 55, 10, 20);
            ctx.fillRect(player.x + 18, player.y + 55, 10, 20);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
