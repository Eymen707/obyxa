<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gamerwost - Multiplayer Canvas Game</title>
    <!-- Tailwind CSS for modern mobile UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN for WebRTC P2P networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            overscroll-behavior: none;
            touch-action: none;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            background: #1e293b;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- Top Header -->
    <header class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 z-10 shrink-0">
        <h1 class="text-lg font-black tracking-wider text-cyan-400">gamerwost</h1>
        <div id="connection-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30">
            Offline
        </div>
    </header>

    <!-- Main Content Area / Canvas Container -->
    <div class="relative flex-1 flex items-center justify-center overflow-hidden bg-slate-950">
        <canvas id="gameCanvas" class="w-full h-full shadow-inner"></canvas>

        <!-- Menu Overlay (Host / Join screen) -->
        <div id="menu-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-20">
            <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col gap-4">
                <div class="text-center">
                    <h2 class="text-xl font-bold text-slate-100">Multiplayer Lobby</h2>
                    <p class="text-xs text-slate-400 mt-1">Host a room or join a friend via PeerJS</p>
                </div>

                <!-- Host Button -->
                <button id="btn-host" class="w-full py-3.5 px-4 bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/20 text-sm">
                    Host New Game
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">or join</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <!-- Join Section -->
                <div class="flex flex-col gap-2">
                    <input type="text" id="input-host-id" placeholder="Enter Host ID..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                    <button id="btn-join" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm">
                        Join Game
                    </button>
                </div>

                <div id="status-msg" class="text-xs text-center text-slate-400 min-h-[1.5rem] flex items-center justify-center"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Virtual Controls / HUD footer -->
    <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between z-10 shrink-0 text-xs text-slate-400">
        <div>Use <span class="text-cyan-400 font-semibold">WASD / Arrow Keys</span> or <span class="text-cyan-400 font-semibold">Touch & Drag</span> to move.</div>
        <div id="room-display" class="font-mono text-slate-300"></div>
    </div>

    <script>
        // Game State & Networking Variables
        let peer = null;
        let conn = null;
        let isHost = false;
        let myId = '';
        
        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player objects
        const localPlayer = {
            x: 100,
            y: 100,
            size: 36,
            color: '#38bdf8',
            speed: 4,
            vx: 0,
            vy: 0
        };

        const remotePlayer = {
            x: 200,
            y: 200,
            size: 36,
            color: '#f43f5e',
            active: false
        };

        // Input tracking
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let isTouchMoving = false;
        let touchTargetX = 0;
        let touchTargetY = 0;

        // UI Elements
        const menuOverlay = document.getElementById('menu-overlay');
        const btnHost = document.getElementById('btn-host');
        const btnJoin = document.getElementById('btn-join');
        const inputHostId = document.getElementById('input-host-id');
        const statusMsg = document.getElementById('status-msg');
        const connectionBadge = document.getElementById('connection-badge');
        const roomDisplay = document.getElementById('room-display');

        // Resize Canvas dynamically to fit container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Initialize PeerJS connection handling
        function initPeer(customId = undefined) {
            statusMsg.textContent = 'Initializing connection...';
            
            // Create Peer instance
            peer = customId ? new Peer(customId) : new Peer();

            peer.on('open', (id) => {
                myId = id;
                if (isHost) {
                    statusMsg.textContent = `Room ready! ID: ${id}`;
                    roomDisplay.textContent = `ID: ${id}`;
                    updateConnectionBadge('Waiting for peer...', 'yellow');
                } else {
                    statusMsg.textContent = `Connected to server. Joining...`;
                }
            });

            // When someone connects to us (Host mode)
            peer.on('connection', (connection) => {
                if (conn) {
                    connection.close(); // Only allow 1 connection for this simple demo
                    return;
                }
                conn = connection;
                setupConnectionEvents();
                isHost = true;
                updateConnectionBadge('Connected', 'green');
                menuOverlay.classList.add('hidden');
                roomDisplay.textContent = `Connected (Host)`;
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                statusMsg.textContent = `Error: ${err.type}`;
                updateConnectionBadge('Error', 'red');
            });
        }

        // Setup DataChannel event listeners
        function setupConnectionEvents() {
            conn.on('open', () => {
                updateConnectionBadge('Connected', 'green');
                menuOverlay.classList.add('hidden');
                roomDisplay.textContent = `Connected (${isHost ? 'Host' : 'Client'})`;
            });

            conn.on('data', (data) => {
                if (data.type === 'position') {
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                    remotePlayer.active = true;
                }
            });

            conn.on('close', () => {
                updateConnectionBadge('Disconnected', 'red');
                remotePlayer.active = false;
                statusMsg.textContent = 'Peer disconnected. Refresh to restart.';
                setTimeout(() => location.reload(), 2500);
            });
        }

        // Host Button Click
        btnHost.addEventListener('click', () => {
            isHost = true;
            // Generate a short deterministic readable room code
            const randomCode = 'gw-' + Math.random().toString(36).substring(2, 7);
            initPeer(randomCode);
        });

        // Join Button Click
        btnJoin.addEventListener('click', () => {
            const hostId = inputHostId.value.trim();
            if (!hostId) {
                statusMsg.textContent = 'Please enter a valid Host ID.';
                return;
            }
            isHost = false;
            initPeer();
            
            // Wait for peer open then connect
            setTimeout(() => {
                if (peer && !peer.destroyed) {
                    statusMsg.textContent = `Connecting to ${hostId}...`;
                    conn = peer.connect(hostId);
                    setupConnectionEvents();
                }
            }, 1000);
        });

        function updateConnectionBadge(text, color) {
            connectionBadge.textContent = text;
            connectionBadge.className = `px-2.5 py-1 rounded-full text-xs font-semibold border ${
                color === 'green' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' :
                color === 'yellow' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' :
                'bg-red-500/20 text-red-400 border-red-500/30'
            }`;
        }

        // Input Listeners (Keyboard)
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Touch / Mouse Drag Listeners for Mobile movement
        canvas.addEventListener('pointerdown', (e) => {
            isTouchMoving = true;
            const rect = canvas.getBoundingClientRect();
            touchTargetX = e.clientX - rect.left;
            touchTargetY = e.clientY - rect.top;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isTouchMoving) return;
            const rect = canvas.getBoundingClientRect();
            touchTargetX = e.clientX - rect.left;
            touchTargetY = e.clientY - rect.top;
        });

        window.addEventListener('pointerup', () => {
            isTouchMoving = false;
        });

        // Main Update Loop
        function update() {
            // Keyboard movement calculation
            let dx = 0;
            let dy = 0;

            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            if (dx !== 0 || dy !== 0) {
                localPlayer.x += dx * localPlayer.speed;
                localPlayer.y += dy * localPlayer.speed;
                isTouchMoving = false; // Keyboard overrides touch
            } else if (isTouchMoving) {
                // Smooth move towards touch target
                const distX = touchTargetX - localPlayer.x;
                const distY = touchTargetY - localPlayer.y;
                const dist = Math.hypot(distX, distY);

                if (dist > 2) {
                    localPlayer.x += (distX / dist) * Math.min(localPlayer.speed, dist);
                    localPlayer.y += (distY / dist) * Math.min(localPlayer.speed, dist);
                }
            }

            // Boundary clamping
            localPlayer.x = Math.max(localPlayer.size / 2, Math.min(canvas.width - localPlayer.size / 2, localPlayer.x));
            localPlayer.y = Math.max(localPlayer.size / 2, Math.min(canvas.height - localPlayer.size / 2, localPlayer.y));

            // Send position update via PeerJS DataChannel if connected
            if (conn && conn.open) {
                conn.send({
                    type: 'position',
                    x: localPlayer.x,
                    y: localPlayer.y
                });
            }
        }

        // Render Loop
        function draw() {
            // Clear screen
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle background grid pattern
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Remote Player if active
            if (remotePlayer.active) {
                ctx.shadowColor = remotePlayer.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = remotePlayer.color;
                ctx.fillRect(
                    remotePlayer.x - remotePlayer.size / 2,
                    remotePlayer.y - remotePlayer.size / 2,
                    remotePlayer.size,
                    remotePlayer.size
                );
                ctx.shadowBlur = 0;

                // Remote label
                ctx.fillStyle = '#94a3b8';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Peer', remotePlayer.x, remotePlayer.y - remotePlayer.size / 2 - 8);
            }

            // Draw Local Player
            ctx.shadowColor = localPlayer.color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = localPlayer.color;
            ctx.fillRect(
                localPlayer.x - localPlayer.size / 2,
                localPlayer.y - localPlayer.size / 2,
                localPlayer.size,
                localPlayer.size
            );
            ctx.shadowBlur = 0;

            // Local label
            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('You', localPlayer.x, localPlayer.y - localPlayer.size / 2 - 8);
        }

        // Core Game Engine Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize default player positions in center
        window.onload = () => {
            localPlayer.x = window.innerWidth / 2;
            localPlayer.y = window.innerHeight / 2;
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
