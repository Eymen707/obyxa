<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GAMERWOST — Classic Voxel Multiplayer</title>
  <!-- Tailwind CSS for clean HUD styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- PeerJS for P2P Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #78a7ff;
      font-family: 'Inter', sans-serif;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Classic Minecraft style hotbar slot */
    .hotbar-slot {
      width: 48px;
      height: 48px;
      background: rgba(20, 22, 32, 0.78);
      border: 3px solid #4b5563;
      transition: transform 0.08s ease, border-color 0.08s ease;
    }
    .hotbar-slot.active {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.95);
      transform: scale(1.08);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.55);
    }
    /* Subtle glassmorphism HUD panels */
    .hud-glass {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    /* Crosshair */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      mix-blend-mode: difference;
    }
    #crosshair::before {
      top: 8px;
      left: 0;
      width: 18px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 8px;
      width: 2px;
      height: 18px;
    }
    /* Custom scrollbar for logs/players */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- 3D WebGL Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Center Crosshair -->
  <div id="crosshair"></div>

  <!-- Top-Left: Game Brand & Multiplayer PeerJS Panel -->
  <div class="fixed top-3 left-3 z-30 flex flex-col gap-2 max-w-[330px] w-full pointer-events-auto">
    <!-- Brand + Status Header -->
    <div class="hud-glass rounded-xl px-3.5 py-2.5 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-cyan-400 flex items-center justify-center font-extrabold text-slate-950 text-lg shadow">
          G
        </div>
        <div>
          <div class="text-white font-extrabold tracking-wider text-sm leading-none">GAMERWOST</div>
          <div class="text-[11px] text-cyan-300 font-medium mt-0.5 flex items-center gap-1.5">
            <span id="net-dot" class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
            <span id="net-status">Initializing Peer...</span>
          </div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Players</div>
        <div id="player-count" class="text-white font-bold text-sm mono">1</div>
      </div>
    </div>

    <!-- PeerJS 10-Digit ID & Connect Box -->
    <div id="mp-panel" class="hud-glass rounded-xl p-3 shadow-lg flex flex-col gap-2.5">
      <!-- Local 10-digit ID -->
      <div>
        <div class="flex items-center justify-between text-[11px] text-slate-300 font-semibold mb-1">
          <span>YOUR 10-DIGIT PEER ID</span>
          <span class="text-cyan-400">Share to play</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div id="my-peer-id" class="mono flex-1 bg-slate-950/80 border border-slate-700 text-cyan-300 font-bold text-sm px-2.5 py-1.5 rounded-lg tracking-widest text-center select-all">
            ----------
          </div>
          <button id="copy-id-btn" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-lg border border-slate-600 transition cursor-pointer">
            Copy
          </button>
        </div>
      </div>

      <!-- Connect to Remote 10-digit ID -->
      <div>
        <div class="text-[11px] text-slate-300 font-semibold mb-1">JOIN FRIEND (10-DIGIT ID)</div>
        <div class="flex items-center gap-1.5">
          <input
            id="remote-id-input"
            type="text"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter 10-digit ID"
            class="mono flex-1 bg-slate-950/80 border border-slate-700 focus:border-cyan-400 focus:outline-none text-white text-sm px-2.5 py-1.5 rounded-lg tracking-widest placeholder:text-slate-500 placeholder:tracking-normal"
          />
          <button id="connect-btn" class="bg-gradient-to-r from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 active:scale-95 text-white text-xs font-extrabold px-3.5 py-2 rounded-lg shadow transition cursor-pointer">
            Join
          </button>
        </div>
      </div>

      <!-- Manual World Reset Button -->
      <div class="flex items-center justify-between pt-1 border-t border-slate-700/70">
        <span class="text-[10px] text-slate-400">World auto-resets on connect</span>
        <button id="reset-world-btn" class="text-[11px] text-amber-300 hover:text-amber-200 font-bold underline cursor-pointer">
          Reset World
        </button>
      </div>
    </div>
  </div>

  <!-- Top-Right: Toast Notification & Live Controls Banner -->
  <div class="fixed top-3 right-3 z-30 flex flex-col items-end gap-2 pointer-events-none">
    <div id="lock-hint" class="hud-glass rounded-xl px-3.5 py-2 text-xs text-slate-200 font-medium shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
      <span>Click canvas to lock cursor &amp; play • <b>ESC</b> for mouse</span>
    </div>
    <div id="toast-container" class="flex flex-col items-end gap-1.5"></div>
  </div>

  <!-- Bottom: Selected Block Label + 9-Slot Classic Hotbar -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-1.5 pointer-events-auto">
    <div id="selected-block-name" class="px-3 py-0.5 rounded-full bg-slate-950/70 text-white text-xs font-bold tracking-wide border border-slate-700/70 shadow">
      Grass Block
    </div>
    <div id="hotbar" class="flex items-center gap-1.5 p-1.5 rounded-2xl hud-glass shadow-2xl">
      <!-- Populated dynamically via JS -->
    </div>
    <div class="text-[11px] text-white/90 font-semibold drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] hidden sm:block">
      WASD: Move • Space: Jump • Shift: Sprint • LMB: Break • RMB: Place • 1-9: Select
    </div>
  </div>

  <!-- Mobile / Touch Controls Overlay (Shown automatically on touch devices) -->
  <div id="mobile-controls" class="fixed inset-0 z-20 pointer-events-none hidden">
    <!-- Left Touch Move Pad -->
    <div class="fixed bottom-24 left-4 w-32 h-32 rounded-full bg-slate-900/40 border border-white/25 pointer-events-auto flex items-center justify-center" id="touch-joystick">
      <div id="touch-knob" class="w-12 h-12 rounded-full bg-cyan-400/70 border border-white shadow"></div>
    </div>
    <!-- Right Action Buttons -->
    <div class="fixed bottom-24 right-4 flex flex-col gap-2 pointer-events-auto">
      <div class="flex gap-2">
        <button id="btn-break" class="w-14 h-14 rounded-2xl bg-rose-600/80 border border-white/30 text-white font-extrabold text-xs shadow-lg active:scale-95">BREAK</button>
        <button id="btn-place" class="w-14 h-14 rounded-2xl bg-emerald-600/80 border border-white/30 text-white font-extrabold text-xs shadow-lg active:scale-95">PLACE</button>
      </div>
      <button id="btn-jump" class="w-full h-12 rounded-2xl bg-sky-600/80 border border-white/30 text-white font-extrabold text-xs shadow-lg active:scale-95">JUMP</button>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * GAMERWOST — Classic 3D Voxel Sandbox with Custom Character & PeerJS
     * ============================================================================
     * Core features:
     * 1. Instant start directly in the 3D world (no blocking main menu).
     * 2. Custom blocky character model matching the uploaded reference:
     *    - Light grey square head, vertical black oval eyes, curved smile,
     *      and textured royal blue baseball cap with brim.
     *    - Dark navy torso with glowing purple-to-cyan 'G' + '+' gaming emblem.
     *    - Dark purple pixelated upper arms & bright cyan/teal pixelated forearms.
     *    - Dark purple pixelated legs.
     * 3. First-person right arm viewmodel with smooth walk bob & mine/place swing.
     * 4. PeerJS P2P Multiplayer with 10-digit numeric IDs; connecting triggers a
     *    synchronized world reset so players start fresh together.
     */

    // --------------------------------------------------------------------------
    // 1. UTILITY & TOAST NOTIFICATIONS
    // --------------------------------------------------------------------------
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = {
        info: 'border-cyan-400/60 text-cyan-100',
        success: 'border-emerald-400/70 text-emerald-100',
        warn: 'border-amber-400/70 text-amber-100',
        error: 'border-rose-400/70 text-rose-100'
      };
      el.className = `hud-glass rounded-xl px-3.5 py-2 text-xs font-bold shadow-lg border ${colors[type] || colors.info} transition-all duration-300`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }

    // Generate a clean 10-digit numeric ID for PeerJS
    function generateTenDigitId() {
      let id = '';
      // First digit 1-9 so it never starts with 0
      id += Math.floor(1 + Math.random() * 9).toString();
      for (let i = 0; i < 9; i++) {
        id += Math.floor(Math.random() * 10).toString();
      }
      return id;
    }

    // --------------------------------------------------------------------------
    // 2. PROCEDURAL PIXEL-ART TEXTURES (BLOCKS & CUSTOM CHARACTER)
    // --------------------------------------------------------------------------
    function createPixelCanvas(size, drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      drawFn(ctx, size);
      return canvas;
    }

    function canvasToTexture(canvas, repeat = false) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      if (repeat) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
      }
      return tex;
    }

    // Helper for noisy pixel grid
    function fillPixelNoise(ctx, size, baseColors, seedOffset = 0) {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const hash = Math.abs(Math.sin((x + seedOffset) * 12.9898 + (y + seedOffset) * 78.233) * 43758.5453);
          const idx = Math.floor((hash % 1) * baseColors.length);
          ctx.fillStyle = baseColors[idx];
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    // Classic Voxel Block Textures (16x16 crisp pixel art)
    const BLOCK_TYPES = [
      { id: 1, name: 'Grass Block', key: 'grass' },
      { id: 2, name: 'Dirt', key: 'dirt' },
      { id: 3, name: 'Stone', key: 'stone' },
      { id: 4, name: 'Cobblestone', key: 'cobble' },
      { id: 5, name: 'Oak Planks', key: 'planks' },
      { id: 6, name: 'Oak Log', key: 'log' },
      { id: 7, name: 'Leaves', key: 'leaves' },
      { id: 8, name: 'Sand', key: 'sand' },
      { id: 9, name: 'Bricks', key: 'brick' }
    ];

    const blockMaterials = {};
    const blockPreviewDataUrls = {};

    function initBlockTextures() {
      // Dirt
      const dirtCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#866043', '#79553a', '#6d4c33', '#926a4b'], 1);
      });
      const dirtTex = canvasToTexture(dirtCanvas);

      // Grass Top
      const grassTopCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#59a837', '#4e962f', '#65b840', '#458728'], 2);
      });
      const grassTopTex = canvasToTexture(grassTopCanvas);

      // Grass Side
      const grassSideCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#866043', '#79553a', '#6d4c33', '#926a4b'], 1);
        for (let x = 0; x < s; x++) {
          const drop = 3 + ((x * 7 + 3) % 4);
          for (let y = 0; y < drop; y++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? '#59a837' : '#4e962f';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      });
      const grassSideTex = canvasToTexture(grassSideCanvas);

      // Stone
      const stoneCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#8a8a8a', '#7d7d7d', '#969696', '#707070'], 5);
      });
      const stoneTex = canvasToTexture(stoneCanvas);

      // Cobblestone
      const cobbleCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#6b6b6b', '#878787', '#585858', '#999999'], 9);
        ctx.fillStyle = '#4a4a4a';
        for (let i = 0; i < 16; i += 4) {
          ctx.fillRect(0, i, 16, 1);
          ctx.fillRect(i, 0, 1, 16);
        }
      });
      const cobbleTex = canvasToTexture(cobbleCanvas);

      // Oak Planks
      const planksCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#b8945f', '#a88450', '#c49f68', '#9c7947'], 12);
        ctx.fillStyle = '#7c5d32';
        ctx.fillRect(0, 3, 16, 1);
        ctx.fillRect(0, 7, 16, 1);
        ctx.fillRect(0, 11, 16, 1);
        ctx.fillRect(0, 15, 16, 1);
        ctx.fillRect(7, 0, 1, 4);
        ctx.fillRect(14, 4, 1, 4);
        ctx.fillRect(4, 8, 1, 4);
        ctx.fillRect(11, 12, 1, 4);
      });
      const planksTex = canvasToTexture(planksCanvas);

      // Oak Log Side & Top
      const logSideCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#665132', '#59462a', '#735c39', '#4c3b22'], 18);
        ctx.fillStyle = '#3f301b';
        for (let x = 2; x < 16; x += 4) {
          ctx.fillRect(x, 0, 1, 16);
        }
      });
      const logTopCanvas = createPixelCanvas(16, (ctx, s) => {
        ctx.fillStyle = '#665132';
        ctx.fillRect(0, 0, 16, 16);
        ctx.fillStyle = '#b8945f';
        ctx.fillRect(2, 2, 12, 12);
        ctx.fillStyle = '#9c7947';
        ctx.fillRect(4, 4, 8, 8);
        ctx.fillStyle = '#b8945f';
        ctx.fillRect(6, 6, 4, 4);
      });
      const logSideTex = canvasToTexture(logSideCanvas);
      const logTopTex = canvasToTexture(logTopCanvas);

      // Leaves
      const leavesCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#3d8c29', '#2f731e', '#4ca336', '#255c17'], 23);
      });
      const leavesTex = canvasToTexture(leavesCanvas);

      // Sand
      const sandCanvas = createPixelCanvas(16, (ctx, s) => {
        fillPixelNoise(ctx, s, ['#dfd59f', '#d4c990', '#e8dfa9', '#c9bd83'], 31);
      });
      const sandTex = canvasToTexture(sandCanvas);

      // Bricks
      const brickCanvas = createPixelCanvas(16, (ctx, s) => {
        ctx.fillStyle = '#b8b3aa';
        ctx.fillRect(0, 0, 16, 16);
        const reds = ['#9e473b', '#8f3d32', '#ab5043'];
        for (let row = 0; row < 4; row++) {
          const y = row * 4;
          const offset = (row % 2) * 4;
          for (let col = -1; col < 3; col++) {
            ctx.fillStyle = reds[(row + col + 4) % reds.length];
            ctx.fillRect(col * 8 + offset + 1, y, 7, 3);
          }
        }
      });
      const brickTex = canvasToTexture(brickCanvas);

      // Assign materials (multi-material for Grass & Log)
      blockMaterials[1] = [
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassTopTex }),
        new THREE.MeshLambertMaterial({ map: dirtTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex })
      ];
      blockMaterials[2] = new THREE.MeshLambertMaterial({ map: dirtTex });
      blockMaterials[3] = new THREE.MeshLambertMaterial({ map: stoneTex });
      blockMaterials[4] = new THREE.MeshLambertMaterial({ map: cobbleTex });
      blockMaterials[5] = new THREE.MeshLambertMaterial({ map: planksTex });
      blockMaterials[6] = [
        new THREE.MeshLambertMaterial({ map: logSideTex }),
        new THREE.MeshLambertMaterial({ map: logSideTex }),
        new THREE.MeshLambertMaterial({ map: logTopTex }),
        new THREE.MeshLambertMaterial({ map: logTopTex }),
        new THREE.MeshLambertMaterial({ map: logSideTex }),
        new THREE.MeshLambertMaterial({ map: logSideTex })
      ];
      blockMaterials[7] = new THREE.MeshLambertMaterial({ map: leavesTex });
      blockMaterials[8] = new THREE.MeshLambertMaterial({ map: sandTex });
      blockMaterials[9] = new THREE.MeshLambertMaterial({ map: brickTex });

      // Save preview icons for the hotbar
      blockPreviewDataUrls[1] = grassSideCanvas.toDataURL();
      blockPreviewDataUrls[2] = dirtCanvas.toDataURL();
      blockPreviewDataUrls[3] = stoneCanvas.toDataURL();
      blockPreviewDataUrls[4] = cobbleCanvas.toDataURL();
      blockPreviewDataUrls[5] = planksCanvas.toDataURL();
      blockPreviewDataUrls[6] = logSideCanvas.toDataURL();
      blockPreviewDataUrls[7] = leavesCanvas.toDataURL();
      blockPreviewDataUrls[8] = sandCanvas.toDataURL();
      blockPreviewDataUrls[9] = brickCanvas.toDataURL();
    }

    // --------------------------------------------------------------------------
    // 3. CUSTOM CHARACTER TEXTURES & 3D MODEL (MATCHING UPLOADED REFERENCE)
    // --------------------------------------------------------------------------
    const characterMaterials = {};

    function initCharacterMaterials() {
      // 1. Face Texture (Light grey head, two black vertical oval eyes, small black smile)
      const faceCanvas = createPixelCanvas(64, (ctx, s) => {
        ctx.fillStyle = '#d4d6db';
        ctx.fillRect(0, 0, s, s);
        // Subtle pixel shading around edges
        ctx.fillStyle = '#c4c7ce';
        ctx.fillRect(0, 0, s, 4);
        ctx.fillRect(0, s - 4, s, 4);

        // Left & Right vertical oval eyes
        ctx.fillStyle = '#111318';
        ctx.beginPath();
        ctx.ellipse(23, 30, 3.6, 6.8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(41, 30, 3.6, 6.8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle white eye glint
        ctx.fillS
