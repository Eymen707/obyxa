<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAMERWOST</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b071a; font-family: sans-serif; color: #fff; }
    
    /* LAUNCHER / MENÜ */
    #launcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: radial-gradient(circle at center, #1b0c3a 0%, #080314 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .badge { background: rgba(255, 170, 0, 0.2); border: 1px solid #ffaa00; color: #ffaa00; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
    .title { font-size: 38px; font-weight: 900; background: linear-gradient(45deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
    .play-btn { background: #8b5cf6; border: none; color: #fff; padding: 14px 40px; border-radius: 12px; font-size: 18px; font-weight: bold; box-shadow: 0 0 20px rgba(139,92,246,0.5); cursor: pointer; }
    
    /* OYUN TUŞLARI */
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
    
    #joystick-base { position: absolute; bottom: 40px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
    #joystick-stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #a855f7; border-radius: 50%; border: 2px solid #fff; }
    
    #jump-btn { position: absolute; bottom: 45px; right: 30px; width: 75px; height: 75px; background: #06b6d4; border: 3px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; pointer-events: auto; box-shadow: 0 0 15px rgba(6,182,212,0.5); }
    #exit-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; pointer-events: auto; }
  </style>
</head>
<body>

  <!-- LAUNCHER -->
  <div id="launcher">
    <div class="badge">Uygulama Hali Gelişme Aşamasında</div>
    <div class="title">GAMERWOST</div>
    <div class="subtitle">Yapımcı: obyxa</div>
    <button class="play-btn" onclick="startGame()">OYUNA BAŞLA</button>
  </div>

  <!-- OYUN ALANI -->
  <canvas id="game-canvas"></canvas>
  
  <div class="ui-layer" id="ui-layer">
    <button id="exit-btn" onclick="stopGame()">MENÜ</button>
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    <div id="jump-btn">ZILPA</div>
  </div>

<script>
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  let animationId = null;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // OYUN DURUMU
  let player = {
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,
    radius: 20,
    isGrounded: true
  };

  // ENGELLER VE PLATFORMLAR (İçinden geçilemez)
  const blocks = [
    { x: -150, y: -150, w: 100, h: 60, color: '#ef4444' },
    { x: 100, y: -100, w: 80, h: 80, color: '#3b82f6' },
    { x: -80, y: 120, w: 120, h: 70, color: '#10b981' },
    { x: 120, y: 100, w: 90, h: 90, color: '#f59e0b' }
  ];

  let moveInput = { x: 0, y: 0 };

  // DOKUNMATİK JOYSICK MANTIĞI
  const joyBase = document.getElementById('joystick-base');
  const joyStick = document.getElementById('joystick-stick');
  let joyActive = false, joyTouchId = null, joyCenter = { x: 0, y: 0 };

  joyBase.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joyActive = true;
    const r = joyBase.getBoundingClientRect();
    joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 };
    updateJoy(t);
  });

  window.addEventListener('touchmove', (e) => {
    if(!joyActive) return;
    for(let t of e.changedTouches) {
      if(t.identifier === joyTouchId) updateJoy(t);
    }
  });

  window.addEventListener('touchend', (e) => {
    for(let t of e.changedTouches) {
      if(t.identifier === joyTouchId) {
        joyActive = false;
        joyStick.style.transform = 'translate(0px, 0px)';
        moveInput = { x: 0, y: 0 };
      }
    }
  });

  function updateJoy(t) {
    let dx = t.clientX - joyCenter.x;
    let dy = t.clientY - joyCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxR = 30;
    if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    moveInput.x = dx / maxR;
    moveInput.y = dy / maxR;
  }

  // ZIPLAMA
  document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(player.isGrounded) {
      player.vz = 8;
      player.isGrounded = false;
    }
  });

  function startGame() {
    document.getElementById('launcher').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    player.x = 0; player.y = 0; player.z = 0;
    loop();
  }

  function stopGame() {
    document.getElementById('launcher').style.display = 'flex';
    document.getElementById('ui-layer').style.display = 'none';
    cancelAnimationFrame(animationId);
  }

  // ÇARPIŞMA KONTROLÜ (DUVARDAN GEÇME ENGELLENDİ)
  function checkCollision(nx, ny) {
    for(let b of blocks) {
      if (nx + player.radius > b.x && nx - player.radius < b.x + b.w &&
          ny + player.radius > b.y && ny - player.radius < b.y + b.h) {
        return true;
      }
    }
    return false;
  }

  function update() {
    // Hareket
    let speed = 4;
    let nextX = player.x + moveInput.x * speed;
    let nextY = player.y + moveInput.y * speed;

    if(!checkCollision(nextX, player.y)) player.x = nextX;
    if(!checkCollision(player.x, nextY)) player.y = nextY;

    // Yerçekimi & Zıplama
    player.z += player.vz;
    if(player.z > 0) {
      player.vz -= 0.5;
    } else {
      player.z = 0;
      player.vz = 0;
      player.isGrounded = true;
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Kamera Merkezi
    const cx = canvas.width / 2 - player.x;
    const cy = canvas.height / 2 - player.y;

    // Zemin Grid
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for(let x = -500; x <= 500; x += 50) {
      ctx.beginPath(); ctx.moveTo(x + cx, -500 + cy); ctx.lineTo(x + cx, 500 + cy); ctx.stroke();
    }
    for(let y = -500; y <= 500; y += 50) {
      ctx.beginPath(); ctx.moveTo(-500 + cx, y + cy); ctx.lineTo(500 + cx, y + cy); ctx.stroke();
    }

    // Bloklar / Engeller
    for(let b of blocks) {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x + cx, b.y + cy, b.w, b.h);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(b.x + cx, b.y + cy, b.w, b.h);
    }

    // GAMERWOST Karakteri (Görsel Renklerinde: Mor Gövde, Turkuaz Kollar, Mavi Şapka)
    const px = player.x + cx;
    const py = player.y + cy - player.z;

    // Gölge
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(player.x + cx, player.y + cy, player.radius, player.radius/2, 0, 0, Math.PI*2);
    ctx.fill();

    // Gövde (Mor)
    ctx.fillStyle = '#2b1464';
    ctx.fillRect(px - 15, py - 20, 30, 30);

    // Kollar (Turkuaz)
    ctx.fillStyle = '#1bb5a6';
    ctx.fillRect(px - 23, py - 18, 7, 22);
    ctx.fillRect(px + 16, py - 18, 7, 22);

    // Kafa & Şapka (Mavi)
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath(); ctx.arc(px, py - 28, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e4ba0';
    ctx.fillRect(px - 11, py - 38, 22, 7);

    // GAMERWOST 'G' Logosu (Göğüste)
    ctx.fillStyle = '#a855f7';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('G', px - 4, py - 2);
  }

  function loop() {
    update();
    render();
    animationId = requestAnimationFrame(loop);
  }
</script>
</body>
</html>
