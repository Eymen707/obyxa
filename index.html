<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GAMERWOST</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }
        
        /* UI Overlay */
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 1px 1px 2px #000; font-size: 14px; z-index: 10; }
        .panel { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        input, button { padding: 5px 10px; margin: 2px; border: none; border-radius: 4px; font-weight: bold; }
        button { background: #5c3cbf; color: white; cursor: pointer; }
        button:active { background: #3c2480; }
        
        /* Hotbar */
        #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 6px; z-index: 10; }
        .slot { width: 40px; height: 40px; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; text-align: center; font-weight: bold; background: rgba(255,255,255,0.1); }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.3); }

        /* Mobile Controls */
        #mobile-controls { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 5; }
        .touch-btn { position: absolute; pointer-events: auto; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
        .touch-btn:active { background: rgba(255,255,255,0.5); }
        #btn-up { bottom: 110px; left: 70px; }
        #btn-down { bottom: 10px; left: 70px; }
        #btn-left { bottom: 60px; left: 15px; }
        #btn-right { bottom: 60px; left: 125px; }
        #btn-jump { bottom: 30px; right: 20px; width: 65px; height: 65px; }
        #btn-break { bottom: 110px; right: 20px; background: rgba(255,50,50,0.4); }
        #btn-place { bottom: 110px; right: 85px; background: rgba(50,255,50,0.4); }
        
        /* Mobile Detection Override */
        @media (pointer: coarse) {
            #mobile-controls { display: block; }
        }
    </style>
    <!-- Three.js & PeerJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui">
        <div class="panel">
            <h2>GAMERWOST</h2>
            <div id="peer-info">My ID: <span id="my-id">Connecting...</span></div>
            <div>
                <input type="text" id="join-id" placeholder="Enter Host ID">
                <button id="btn-connect">Join World</button>
            </div>
            <div>
                <button id="btn-verity">Toggle AI Verity</button>
            </div>
        </div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-type="1">Dirt</div>
        <div class="slot" data-type="2">Grass</div>
        <div class="slot" data-type="3">Stone</div>
        <div class="slot" data-type="4">Wood</div>
        <div class="slot" data-type="5">Sculk</div>
        <div class="slot" data-type="6">Mud</div>
        <div class="slot" data-type="7">Froglight</div>
    </div>

    <!-- Mobile UI Controls -->
    <div id="mobile-controls">
        <div class="touch-btn" id="btn-up">W</div>
        <div class="touch-btn" id="btn-down">S</div>
        <div class="touch-btn" id="btn-left">A</div>
        <div class="touch-btn" id="btn-right">D</div>
        <div class="touch-btn" id="btn-jump">JUMP</div>
        <div class="touch-btn" id="btn-break">MINE</div>
        <div class="touch-btn" id="btn-place">PLACE</div>
    </div>

    <script>
        // --- GAME ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Blocks & Textures (Procedural Colors for Minecraft 1.19 Vibe)
        const blockTypes = {
            1: { name: 'Dirt', color: 0x8B5A2B },
            2: { name: 'Grass', color: 0x4C9A2A },
            3: { name: 'Stone', color: 0x808080 },
            4: { name: 'Wood', color: 0x5C4033 },
            5: { name: 'Sculk', color: 0x052F3D },     // 1.19 Item
            6: { name: 'Mud', color: 0x3C2F2F },       // 1.19 Item
            7: { name: 'Froglight', color: 0xFCE880 } // 1.19 Item
        };

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const materials = {};
        for(let id in blockTypes) {
            materials[id] = new THREE.MeshLambertMaterial({ color: blockTypes[id].color });
        }

        const worldBlocks = new Map();
        function getKey(x, y, z) { return `${x},${y},${z}`; }

        function addBlock(x, y, z, type, sync = true) {
            const key = getKey(x, y, z);
            if (worldBlocks.has(key)) return;

            const mesh = new THREE.Mesh(geometry, materials[type]);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            worldBlocks.set(key, { mesh, type });

            if (sync) sendNetworkData({ action: 'place', x, y, z, type });
        }

        function removeBlock(x, y, z, sync = true) {
            const key = getKey(x, y, z);
            if (worldBlocks.has(key)) {
                const data = worldBlocks.get(key);
                scene.remove(data.mesh);
                worldBlocks.delete(key);
                if (sync) sendNetworkData({ action: 'break', x, y, z });
            }
        }

        // Generate Terrain
        for (let x = -8; x <= 8; x++) {
            for (let z = -8; z <= 8; z++) {
                addBlock(x, 0, z, 1, false);
                addBlock(x, 1, z, 2, false);
            }
        }

        // --- PLAYER CONTROLS & PHYSICS ---
        let playerPos = new THREE.Vector3(0, 3, 0);
        let velocity = new THREE.Vector3();
        let yaw = 0, pitch = 0;
        let selectedType = 1;
        const keys = {};

        // Mobile / Touch controls state
        let touchMove = { w: false, s: false, a: false, d: false };

        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Hotbar Selector
        document.querySelectorAll('.slot').forEach(slot => {
            slot.addEventListener('click', () => {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                slot.classList.add('active');
                selectedType = parseInt(slot.dataset.type);
            });
        });

        // Pointer Lock for Mouse Camera
        renderer.domElement.addEventListener('click', () => {
            if (!isTouchDevice()) renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            }
        });

        // Touch Look Controls for Mobile
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0 && e.target === renderer.domElement) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0 && e.target === renderer.domElement) {
                let dx = e.touches[0].clientX - touchStartX;
                let dy = e.touches[0].clientY - touchStartY;
                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        function isTouchDevice() { return 'ontouchstart' in window || navigator.maxTouchPoints > 0; }

        // Mobile Buttons Bindings
        function setupTouchBtn(id, keyProp) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); touchMove[keyProp] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); touchMove[keyProp] = false; });
        }
        setupTouchBtn('btn-up', 'w');
        setupTouchBtn('btn-down', 's');
        setupTouchBtn('btn-left', 'a');
        setupTouchBtn('btn-right', 'd');

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (playerPos.y <= 2.1) velocity.y = 0.15; });
        document.getElementById('btn-break').addEventListener('touchstart', (e) => { e.preventDefault(); performRaycast(true); });
        document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); performRaycast(false); });

        // Mining & Placing Raycast
        const raycaster = new THREE.Raycaster();
        function performRaycast(isBreak) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.distance < 6) {
                    const p = hit.point.clone();
                    if (isBreak) {
                        p.sub(hit.face.normal.clone().multiplyScalar(0.4));
                        removeBlock(Math.round(p.x), Math.round(p.y), Math.round(p.z));
                    } else {
                        p.add(hit.face.normal.clone().multiplyScalar(0.4));
                        addBlock(Math.round(p.x), Math.round(p.y), Math.round(p.z), selectedType);
                    }
                }
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                if (e.button === 0) performRaycast(true);  // Left Click -> Break
                if (e.button === 2) performRaycast(false); // Right Click -> Place
            }
        });

        // --- PEERJS MULTIPLAYER ---
        let peer = new Peer();
        let connections = [];
        const remotePlayers = {};

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        document.getElementById('btn-connect').addEventListener('click', () => {
            const hostId = document.getElementById('join-id').value.trim();
            if (hostId) {
                const conn = peer.connect(hostId);
                setupConnection(conn);
            }
        });

        function setupConnection(conn) {
            conn.on('open', () => {
                connections.push(conn);
                conn.on('data', (data) => handleNetworkData(data, conn.peer));
            });
            conn.on('close', () => {
                if (remotePlayers[conn.peer]) {
                    scene.remove(remotePlayers[conn.peer]);
                    delete remotePlayers[conn.peer];
                }
            });
        }

        function sendNetworkData(data) {
            connections.forEach(conn => conn.send(data));
        }

        function handleNetworkData(data, peerId) {
            if (data.action === 'move') {
                if (!remotePlayers[peerId]) {
                    // Create Player Mesh
                    const pGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0x9b59b6 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    scene.add(pMesh);
                    remotePlayers[peerId] = pMesh;
                }
                remotePlayers[peerId].position.set(data.x, data.y, data.z);
            } else if (data.action === 'place') {
                addBlock(data.x, data.y, data.z, data.type, false);
            } else if (data.action === 'break') {
                removeBlock(data.x, data.y, data.z, false);
            }
        }

        // --- AI VERITY ENTITY ---
        let aiVerity = null;
        let aiEnabled = false;

        document.getElementById('btn-verity').addEventListener('click', () => {
            aiEnabled = !aiEnabled;
            if (aiEnabled && !aiVerity) {
                const g = new THREE.CylinderGeometry(0.3, 0.3, 2, 8);
                const m = new THREE.MeshBasicMaterial({ color: 0xff1111 });
                aiVerity = new THREE.Mesh(g, m);
                aiVerity.position.set(5, 2, 5);
                scene.add(aiVerity);
            } else if (!aiEnabled && aiVerity) {
                scene.remove(aiVerity);
                aiVerity = null;
            }
        });

        // --- GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Movement Logic
            const speed = 0.1;
            let moveF = (keys['KeyW'] || touchMove.w ? 1 : 0) - (keys['KeyS'] || touchMove.s ? 1 : 0);
            let moveS = (keys['KeyD'] || touchMove.d ? 1 : 0) - (keys['KeyA'] || touchMove.a ? 1 : 0);

            if (keys['Space']) {
                if (playerPos.y <= 2.1) velocity.y = 0.15;
            }

            // Gravity
            velocity.y -= 0.008;
            playerPos.y += velocity.y;
            if (playerPos.y < 2) { playerPos.y = 2; velocity.y = 0; }

            // Direction calculation
            let dir = new THREE.Vector3(moveS, 0, -moveF).normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            playerPos.add(dir.multiplyScalar(speed));

            // Camera update
            camera.position.copy(playerPos);
            camera.rotation.set(0, 0, 0);
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Broadcast Position
            sendNetworkData({ action: 'move', x: playerPos.x, y: playerPos.y, z: playerPos.z });

            // AI Verity Follower Logic
            if (aiVerity) {
                aiVerity.position.lerp(playerPos, 0.01);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
