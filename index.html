<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mamerwost Classic 0.30</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        #hud {
            display: block;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9);
            font-size: 22px;
            line-height: 18px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
        #top-bar {
            position: fixed;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            pointer-events: none;
        }
        #version-tag {
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #777;
            padding: 6px 8px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 240px;
        }
        .peer-line {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #55ff55;
            font-weight: bold;
        }
        .join-line {
            display: flex;
            gap: 4px;
        }
        .hud-input {
            background: #111;
            border: 1px solid #888;
            color: #fff;
            padding: 3px 5px;
            font-size: 11px;
            width: 105px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .hud-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 5px;
            pointer-events: auto;
        }
        .mini-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #aaa;
            color: #fff;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
        }
        .mini-btn:active {
            background: #444;
        }

        /* Hotbar */
        #hotbar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.65);
            border: 3px solid #444;
            pointer-events: auto;
        }
        .slot {
            width: 38px;
            height: 38px;
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .slot.active {
            border: 3px solid #fff;
            background: rgba(255,255,255,0.22);
        }
        .slot-preview {
            width: 22px;
            height: 22px;
            image-rendering: pixelated;
            background-size: cover;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }
        .dpad {
            position: fixed;
            bottom: 62px;
            left: 14px;
            width: 132px;
            height: 132px;
            pointer-events: auto;
        }
        .dpad-btn {
            position: absolute;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.22);
            border: 2px solid rgba(255,255,255,0.55);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.45); }
        #btn-up { top: 0; left: 44px; }
        #btn-down { bottom: 0; left: 44px; }
        #btn-left { top: 44px; left: 0; }
        #btn-right { top: 44px; right: 0; }

        .action-pad {
            position: fixed;
            bottom: 62px;
            right: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
            pointer-events: auto;
        }
        .act-row {
            display: flex;
            gap: 10px;
        }
        .act-btn {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            background: rgba(255,255,255,0.22);
            border: 2px solid rgba(255,255,255,0.55);
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .act-btn:active { background: rgba(255,255,255,0.5); }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 16px;
            pointer-events: auto;
        }
        .modal-box {
            background: #2b2b2b;
            border: 3px solid #999;
            padding: 16px;
            width: 100%;
            max-width: 440px;
            color: #fff;
        }
        .mc-btn {
            background: #727272;
            border: 3px solid;
            border-color: #aaa #333 #333 #aaa;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .mc-input {
            background: #000;
            border: 2px solid #888;
            color: #fff;
            padding: 8px;
            font-size: 14px;
            width: 100%;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .inv-item {
            background: #1a1a1a;
            border: 2px solid #666;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 10px;
            text-align: center;
        }
        .inv-item:hover, .inv-item:active {
            border-color: #fff;
            background: #3a3a3a;
        }
        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }

        /* Chat */
        #chat-box {
            position: fixed;
            top: 108px;
            left: 8px;
            width: 240px;
            max-height: 110px;
            overflow-y: auto;
            font-size: 11px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }
        .chat-line {
            background: rgba(0,0,0,0.45);
            padding: 2px 6px;
            margin-bottom: 2px;
        }
        #chat-input-bar {
            display: none;
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            z-index: 60;
            pointer-events: auto;
            gap: 6px;
        }
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- DIRECT IN-GAME HUD -->
<div id="hud">
    <div id="crosshair">+</div>

    <div id="top-bar">
        <div id="version-tag">
            <div><strong>Mamerwost Classic 0.30</strong></div>
            <div class="peer-line">
                <span>ID: <span id="my-peer-id">Loading...</span></span>
                <button class="mini-btn" style="padding:2px 5px;" onclick="copyPeerId()">Copy</button>
            </div>
            <div class="join-line">
                <input type="text" id="join-id-input" class="hud-input" placeholder="mamer-XXX">
                <button class="mini-btn" style="padding:2px 6px;" onclick="joinFriend()">Join</button>
            </div>
            <div id="players-count" style="color:#ffff55; font-size:11px;">Players: 1</div>
        </div>

        <div class="hud-actions">
            <button class="mini-btn" onclick="toggleChat()">Chat (T)</button>
            <button class="mini-btn" onclick="toggleModal('inv-modal')">Blocks (B)</button>
            <button class="mini-btn" onclick="toggleModal('mod-modal')">Mods (M)</button>
        </div>
    </div>

    <div id="chat-box"></div>

    <div id="chat-input-bar">
        <input type="text" id="chat-input" class="mc-input" placeholder="Type message...">
        <button class="mc-btn" onclick="sendChat()" style="padding: 8px 14px;">Send</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div class="dpad">
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-right">▶</div>
        </div>
        <div class="action-pad">
            <div class="act-row">
                <div class="act-btn" id="btn-break">BREAK</div>
                <div class="act-btn" id="btn-place">PLACE</div>
            </div>
            <div class="act-row">
                <div class="act-btn" id="btn-jump" style="width: 118px;">JUMP</div>
            </div>
        </div>
    </div>

    <div id="hotbar"></div>
</div>

<!-- BLOCK INVENTORY MODAL -->
<div id="inv-modal" class="modal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Classic 0.30 Blocks</strong>
            <button class="mini-btn" onclick="toggleModal('inv-modal')">X</button>
        </div>
        <div class="inv-grid" id="inv-grid"></div>
    </div>
</div>

<!-- MODS MODAL -->
<div id="mod-modal" class="modal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong>Mamerwost Classic Mods</strong>
            <button class="mini-btn" onclick="toggleModal('mod-modal')">X</button>
        </div>
        <div class="mod-row">
            <span>TNT Explosive Mode (Auto-ignite)</span>
            <input type="checkbox" id="mod-tnt" checked>
        </div>
        <div class="mod-row">
            <span>Moon Gravity (Low Gravity)</span>
            <input type="checkbox" id="mod-gravity">
        </div>
        <div class="mod-row">
            <span>Super Speed Boost</span>
            <input type="checkbox" id="mod-speed">
        </div>
        <div class="mod-row">
            <span>Night & Torch Glow Mode</span>
            <input type="checkbox" id="mod-night" onchange="toggleNightMode()">
        </div>
        <div class="mod-row">
            <span>Fly Mode (Hold Jump)</span>
            <input type="checkbox" id="mod-fly">
        </div>
        <button class="mc-btn" style="width:100%; margin-top:12px;" onclick="toggleModal('mod-modal')">Done</button>
    </div>
</div>

<script>
// ==================== PIXEL TEXTURE GENERATOR ====================
function createPixelTexture(drawFn) {
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    const ctx = c.getContext('2d');
    drawFn(ctx);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    return { tex, url: c.toDataURL() };
}

function noiseFill(ctx, baseColors, count = 80) {
    ctx.fillStyle = baseColors[0];
    ctx.fillRect(0, 0, 16, 16);
    for (let i = 0; i < count; i++) {
        ctx.fillStyle = baseColors[Math.floor(Math.random() * baseColors.length)];
        ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
    }
}

const BLOCKS = {
    1: {
        name: 'Grass',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#55b832', '#47a127', '#66cc3d', '#3e8e22'], 120);
        })
    },
    2: {
        name: 'Dirt',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#866043', '#704f36', '#966c4a', '#593d28'], 120);
        })
    },
    3: {
        name: 'Cobblestone',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#7a7a7a', '#5c5c5c', '#949494', '#474747'], 150);
            ctx.strokeStyle = '#3d3d3d';
            ctx.strokeRect(1, 1, 6, 5);
            ctx.strokeRect(8, 2, 7, 6);
            ctx.strokeRect(2, 8, 7, 6);
        })
    },
    4: {
        name: 'Oak Planks',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#b8945f', '#a6824e', '#c7a26b'], 70);
            ctx.fillStyle = '#6e522b';
            for (let y = 0; y < 16; y += 4) ctx.fillRect(0, y, 16, 1);
        })
    },
    5: {
        name: 'Oak Log',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#665132', '#524026', '#78603c'], 90);
            ctx.fillStyle = '#3d2f1b';
            for (let x = 2; x < 16; x += 4) ctx.fillRect(x, 0, 1, 16);
        })
    },
    6: {
        name: 'Leaves',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#2d7a1e', '#1f5c13', '#3b9628', '#15420c'], 130);
        })
    },
    7: {
        name: 'Sand',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#dfd69b', '#cfc588', '#ede4ab'], 110);
        })
    },
    8: {
        name: 'Bricks',
        tex: createPixelTexture(ctx => {
            ctx.fillStyle = '#b5b5b5';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#9c4338';
            for (let y = 0; y < 16; y += 4) {
                const offset = (y / 4) % 2 === 0 ? 0 : 4;
                ctx.fillRect(offset, y, 7, 3);
                ctx.fillRect((offset + 8) % 16, y, 7, 3);
            }
        })
    },
    9: {
        name: 'TNT',
        tex: createPixelTexture(ctx => {
            ctx.fillStyle = '#db3226';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#f2f2f2';
            ctx.fillRect(0, 5, 16, 6);
            ctx.fillStyle = '#111';
            ctx.fillRect(2, 6, 3, 1); ctx.fillRect(3, 6, 1, 4);
            ctx.fillRect(6, 6, 1, 4); ctx.fillRect(7, 7, 1, 1); ctx.fillRect(8, 6, 1, 4);
            ctx.fillRect(10, 6, 3, 1); ctx.fillRect(11, 6, 1, 4);
        })
    },
    10: {
        name: 'Gold Block',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#fcee4b', '#ebd328', '#fff88f'], 80);
            ctx.strokeStyle = '#d4af17';
            ctx.strokeRect(0, 0, 16, 16);
        })
    },
    11: {
        name: 'Diamond Block',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#5cebe3', '#3cc7bf', '#9cfaf4'], 80);
            ctx.strokeStyle = '#269e97';
            ctx.strokeRect(0, 0, 16, 16);
        })
    },
    12: {
        name: 'Sponge',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#d9d636', '#c2bf27', '#ebe852'], 90);
            ctx.fillStyle = '#878516';
            ctx.fillRect(3, 3, 2, 2); ctx.fillRect(10, 4, 2, 2);
            ctx.fillRect(5, 10, 2, 2); ctx.fillRect(11, 11, 2, 2);
        })
    },
    13: {
        name: 'Glass',
        transparent: true,
        tex: createPixelTexture(ctx => {
            ctx.clearRect(0, 0, 16, 16);
            ctx.strokeStyle = '#d8f5f7';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, 14, 14);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(3, 3, 2, 2);
            ctx.fillRect(4, 4, 2, 2);
        })
    },
    14: {
        name: 'Red Wool',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#b82e2e', '#9e2222', '#cc3d3d'], 120);
        })
    },
    15: {
        name: 'Glowstone',
        tex: createPixelTexture(ctx => {
            noiseFill(ctx, ['#ffda66', '#d99e2b', '#fff2b2', '#8f5e14'], 140);
        })
    }
};

const MATERIALS = {};
for (const [id, data] of Object.entries(BLOCKS)) {
    MATERIALS[id] = new THREE.MeshLambertMaterial({
        map: data.tex.tex,
        transparent: !!data.transparent,
        opacity: data.transparent ? 0.65 : 1.0
    });
}

// ==================== THREE.JS SCENE SETUP ====================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 22, 68);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 100);
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);

// ==================== CLASSIC 0.30 WORLD ENGINE ====================
const WORLD_SIZE = 32;
const worldBlocks = new Map();
const blockMeshes = new Map();
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

function keyOf(x, y, z) {
    return `${x},${y},${z}`;
}

function setBlock(x, y, z, id, broadcast = false) {
    x = Math.round(x); y = Math.round(y); z = Math.round(z);
    const k = keyOf(x, y, z);

    if (blockMeshes.has(k)) {
        scene.remove(blockMeshes.get(k));
        blockMeshes.delete(k);
        worldBlocks.delete(k);
    }

    if (id && MATERIALS[id]) {
        const mesh = new THREE.Mesh(boxGeo, MATERIALS[id]);
        mesh.position.set(x, y, z);
        mesh.userData = { x, y, z, id };
        scene.add(mesh);
        blockMeshes.set(k, mesh);
        worldBlocks.set(k, id);

        if (id === 9 && document.getElementById('mod-tnt').checked) {
            setTimeout(() => explodeTNT(x, y, z), 1800);
        }
    }

    if (broadcast) {
        sendPeerData({ type: 'block', x, y, z, id });
    }
}

function explodeTNT(cx, cy, cz) {
    if (worldBlocks.get(keyOf(cx, cy, cz)) !== 9) return;
    addChatMessage('System', 'BOOM! TNT exploded!');
    for (let dx = -2; dx <= 2; dx++) {
        for (let dy = -2; dy <= 2; dy++) {
            for (let dz = -2; dz <= 2; dz++) {
                if (dx*dx + dy*dy + dz*dz <= 5 && (cy + dy) > -3) {
                    setBlock(cx + dx, cy + dy, cz + dz, 0, true);
                }
            }
        }
    }
}

function generateClassicWorld() {
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
        for (let z = -WORLD_SIZE / 2;
