<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GAMERWOST</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* SOL ALT OBYXA İMZASI */
        #watermark {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }

        /* ESKİ ROBLOX MENÜ KONSEPTİ */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #e6e6e6;
            z-index: 500;
            display: flex;
            flex-direction: column;
        }
        .roblox-header {
            background: linear-gradient(to bottom, #0055b3, #003673);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #002244;
            color: white;
        }
        .roblox-logo-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 2px 2px 0px #ba0000;
            font-family: 'Impact', Arial, sans-serif;
        }
        .roblox-nav {
            background: #19437d;
            height: 30px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            font-size: 12px;
            color: #cce0ff;
            font-weight: bold;
            border-bottom: 1px solid #0d274c;
        }
        .menu-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #2a1548 0%, #0d0718 100%);
            color: white;
        }
        .game-title-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .game-title-box h1 {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #a855f7, #6366f1, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(168, 85, 247, 0.4);
            margin-bottom: 5px;
        }
        .play-btn {
            background: linear-gradient(to bottom, #00cc44, #00882d);
            border: 2px solid #00551c;
            border-radius: 8px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 15px 60px;
            cursor: pointer;
            box-shadow: 0 6px 0 #004416, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #004416;
        }

        /* OYUN İÇİ ARAYÜZ VE NİŞANGAH */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        /* HOTBAR VE ENVANTER */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }
        .hotbar-slot {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            position: relative;
        }
        .hotbar-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 11px;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
        }

        /* MOBİL KONTROLLER VE JOYSTICK */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 150;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(168, 85, 247, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .action-btns {
            position: absolute;
            bottom: 40px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 150;
        }
        .btn-action {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .btn-action:active {
            background: rgba(168, 85, 247, 0.8);
        }

        /* CRAFTING PENCERESİ */
        #craft-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #a855f7;
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 300;
            display: none;
            width: 280px;
        }
        #craft-menu h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #a855f7;
            font-size: 20px;
        }
        .craft-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
        }
        .craft-btn {
            background: #a855f7;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <!-- THREE.JS KÜTÜPHANESİ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="watermark">OBYXA</div>

    <!-- ESKİ ROBLOX MENÜSÜ -->
    <div id="menu-screen">
        <div class="roblox-header">
            <div class="roblox-logo-text">ROBLOX</div>
            <div style="font-size: 12px;">Giriş Yapıldı</div>
        </div>
        <div class="roblox-nav">
            <span>My ROBLOX</span> | <span>Games</span> | <span>Catalog</span> | <span>People</span> | <span>Forum</span>
        </div>
        <div class="menu-content">
            <div class="game-title-box">
                <h1>GAMERWOST</h1>
                <p style="color: #aaa; letter-spacing: 1px;">MINIBLOX & MINECRAFT EDITION</p>
            </div>
            <button class="play-btn" onclick="startGame()">OYNA</button>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-container"></div>
    <div id="crosshair"></div>

    <!-- HOTBAR -->
    <div id="hotbar">
        <div class="hotbar-slot active" onclick="selectSlot(0)">Toprak<span class="slot-count" id="cnt-1">10</span></div>
        <div class="hotbar-slot" onclick="selectSlot(1)">Taş<span class="slot-count" id="cnt-2">5</span></div>
        <div class="hotbar-slot" onclick="selectSlot(2)">Odun<span class="slot-count" id="cnt-3">5</span></div>
        <div class="hotbar-slot" onclick="selectSlot(3)">Yaprak<span class="slot-count" id="cnt-4">5</span></div>
        <div class="hotbar-slot" onclick="selectSlot(4)">Tahta<span class="slot-count" id="cnt-5">0</span></div>
    </div>

    <!-- MOBİL KONTROLLER -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div class="action-btns">
        <div class="btn-action" onclick="doBreak()">KIR</div>
        <div class="btn-action" onclick="doPlace()">KOY</div>
        <div class="btn-action" onclick="doJump()">ZIPLA</div>
        <div class="btn-action" onclick="toggleCraft()">CRAFT</div>
    </div>

    <!-- CRAFT MENÜSÜ -->
    <div id="craft-menu">
        <h2>Üretim (Craft)</h2>
        <div class="craft-item">
            <div>
                <div>4x Tahta</div>
                <small style="color: #aaa;">Gereksinim: 1 Odun</small>
            </div>
            <button class="craft-btn" onclick="craftPlanks()">Üret</button>
        </div>
        <button class="craft-btn" style="width: 100%; margin-top: 10px; background: #555;" onclick="toggleCraft()">Kapat</button>
    </div>

    <script>
        // OYUN DEĞİŞKENLERİ
        let scene, camera, renderer;
        let blocks = [];
        let player, playerBody;
        let selectedBlockType = 1; // 1: Toprak, 2: Taş, 3: Odun, 4: Yaprak, 5: Tahta
        let inventory = { 1: 10, 2: 5, 3: 5, 4: 5, 5: 0 };

        // HAREKET DEĞİŞKENLERİ
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocityY = 0;
        let isGrounded = false;
        const gravity = -0.015;
        const speed = 0.12;

        // DOKUNMATİK VE BAKIŞ
        let touchStartX = 0, touchStartY = 0;
        let cameraPitch = 0, cameraYaw = 0;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            initEngine();
            createWorld();
            createCharacter();
            setupControls();
            animate();
        }

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6eb1ff);
            scene.fog = new THREE.FogExp2(0x6eb1ff, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // IŞIKLANDIRMA
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);
        }

        // DOKULAR VE MATERYALLER
        function getBlockMaterial(type) {
            const colors = {
                1: 0x557a2b, // Toprak/Çim
                2: 0x7d7d7d, // Taş
                3: 0x5c4033, // Odun
                4: 0x2e8b57, // Yaprak
                5: 0xc4a482  // Tahta
            };
            return new THREE.MeshStandardMaterial({ color: colors[type] || 0xffffff, roughness: 0.8 });
        }

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        function createWorld() {
            // Taban Arazi
            for (let x = -12; x <= 12; x++) {
                for (let z = -12; z <= 12; z++) {
                    let height = Math.floor(Math.sin(x * 0.3) + Math.cos(z * 0.3)) + 1;
                    for (let y = 0; y <= height; y++) {
                        let type = (y === height) ? 1 : 2;
                        spawnBlock(x, y, z, type);
                    }

                    // Ağaçlar
                    if (x % 5 === 0 && z % 5 === 0 && Math.random() > 0.4) {
                        for (let ty = height + 1; ty <= height + 3; ty++) {
                            spawnBlock(x, ty, z, 3);
                        }
                        for (let lx = -1; lx <= 1; lx++) {
                            for (let lz = -1; lz <= 1; lz++) {
                                for (let ly = height + 3; ly <= height + 4; ly++) {
                                    if (!(lx === 0 && lz === 0 && ly === height + 3)) {
                                        spawnBlock(x + lx, ly, z + lz, 4);
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function spawnBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(blockGeometry, getBlockMaterial(type));
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { type: type };
            scene.add(mesh);
            blocks.push(mesh);
        }

        // ÖZEL ROBLOX KARAKTERİ (GAMERWOST LOGOLU)
        function createCharacter() {
            player = new THREE.Group();

            // Gövde Canvas (Logo Çizimi)
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2e1065';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#a855f7';
            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('G+', 128, 128);

            const torsoTexture = new THREE.CanvasTexture(canvas);
            const torsoMat = new THREE.MeshStandardMaterial({ map: torsoTexture });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xe5c1cd });

            // Gövde
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), torsoMat);
            torso.position.y = 0.45;
            player.add(torso);

            // Kafa
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
            head.position.y = 1.15;
            player.add(head);

            // Mavi Şapka
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.15, 0.6), blueMat);
            cap.position.set(0, 1.4, 0.05);
            player.add(cap);

            // Kollar
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), blueMat);
            armL.position.set(-0.6, 0.4, 0);
            player.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), blueMat);
            armR.position.set(0.6, 0.4, 0);
            player.add(armR);

            // Bacaklar
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), darkMat);
            legL.position.set(-0.2, -0.4, 0);
            player.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), darkMat);
            legR.position.set(0.2, -0.4, 0);
            player.add(legR);

            player.position.set(0, 5, 0);
            scene.add(player);
        }

        // KONTROLLER VE GİRDİLER
        function setupControls() {
            // Klavye Kontrolleri
            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'Space') doJump();
                if (e.code === 'KeyE') toggleCraft();
                if (e.key >= '1' && e.key <= '5') selectSlot(parseInt(e.key) - 1);
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            // Dokunmatik Kamera Kontrolü (Ekran Sürükleme)
            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.touches) {
                    if (touch.clientX > window.innerWidth / 2) {
                        let deltaX = touch.clientX - touchStartX;
                        let deltaY = touch.clientY - touchStartY;
                        
                        cameraYaw -= deltaX * 0.005;
                        cameraPitch -= deltaY * 0.005;
                        cameraPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraPitch));

                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    }
                }
            });

            // Joystick Kontrolü
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');

            zone.addEventListener('touchstart', (e) => { joystickActive = true; });
            window.addEventListener('touchend', () => { 
                joystickActive = false; 
                knob.style.top = '35px';
                knob.style.left = '35px';
                joystickVector = { x: 0, y: 0 };
            });

            zone.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                let rect = zone.getBoundingClientRect();
                let touch = e.touches[0];
                let x = touch.clientX - rect.left - 60;
                let y = touch.clientY - rect.top - 60;
                le
