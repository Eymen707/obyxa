<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>obyxa001 - Retro Roblox 2014 & Simülatör</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap');

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Source Sans Pro', Arial, sans-serif;
            background-color: #e3e3e3;
            color: #222222;
            min-height: 100vh;
        }

        .roblox-header {
            background: linear-gradient(180deg, #0074e8 0%, #004fb0 100%);
            border-bottom: 2px solid #00367d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .roblox-card {
            background-color: #ffffff;
            border: 1px solid #c3c3c3;
        }

        .game-card {
            background: #ffffff;
            border: 1px solid #c3c3c3;
            transition: all 0.15s ease;
        }
        .game-card:hover {
            border-color: #0055b3;
            box-shadow: 0 4px 12px rgba(0, 85, 179, 0.3);
            transform: translateY(-2px);
        }

        .btn-green {
            background: linear-gradient(180deg, #02b700 0%, #008200 100%);
            border: 1px solid #004d00;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ÜST MENÜ (HEADER) -->
    <header class="roblox-header text-white h-16 flex items-center justify-between px-4 sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-black italic text-xl px-3 py-1 rounded border border-red-800 transform -rotate-1 shadow-md">
                obyxa<span class="text-yellow-300">001</span>
            </div>
            <span class="font-bold text-sm hidden sm:inline">Retro Roblox 2014</span>
        </div>

        <div class="flex items-center space-x-3 text-xs font-semibold">
            <div class="bg-blue-950 px-3 py-1.5 rounded border border-blue-500/50 flex items-center gap-2">
                <span class="text-green-400 font-bold">R$</span>
                <span>86,400</span>
                <span class="text-amber-400 font-bold ml-2">TIX</span>
                <span>19,250</span>
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK CONTAINER -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-4">
        
        <div class="roblox-card p-4 rounded-lg shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-blue-600">Popüler Retro Oyunlar</h1>
                <p class="text-xs text-gray-500">Oynamak istediğin oyuna tıkla!</p>
            </div>
        </div>

        <!-- OYUN KARTLARI GRİDİ -->
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JavaScript Oyun Kartlarını Buraya Basacak -->
        </div>

    </main>

    <!-- OYUN OYNAMA PENCERESİ (MODAL) -->
    <div id="game-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-center items-center p-2">
        <div class="w-full max-w-lg bg-slate-900 text-white rounded-t-lg p-3 flex justify-between items-center">
            <span id="active-game-title" class="font-bold text-sm">Oyun</span>
            <button onclick="closeGame()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">✕ Kapat</button>
        </div>
        
        <div class="relative w-full max-w-lg h-[350px] bg-black rounded-b-lg overflow-hidden flex flex-col items-center justify-center">
            <canvas id="game-canvas" width="400" height="300" class="bg-slate-800 border border-slate-700"></canvas>
            
            <div id="game-controls" class="w-full p-2 bg-slate-900 flex justify-around text-xs font-bold">
                <button onclick="handleInput('LEFT')" class="bg-blue-600 px-4 py-2 rounded">◀ Sol</button>
                <button onclick="handleInput('ACTION')" class="bg-green-600 px-6 py-2 rounded text-sm">⚡ TIKLA / ZIPLA</button>
                <button onclick="handleInput('RIGHT')" class="bg-blue-600 px-4 py-2 rounded">Sağ ▶</button>
            </div>
        </div>
    </div>

    <script>
        const gamesList = [
            { id: 'muscle', title: '💪 Muscle Legends 2014', desc: 'Tıkla ve kaslarını geliştir!', color: 'from-orange-500 to-red-600' },
            { id: 'speed', title: '⚡ Speed Run Simulator', desc: 'Engellerden kaç ve hızlan!', color: 'from-amber-400 to-yellow-600' },
            { id: 'sword', title: '⚔️ Sword Fight Arena', desc: 'Kılıcını salla ve puan topla!', color: 'from-blue-500 to-indigo-600' }
        ];

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = gamesList.map(g => `
                <div class="game-card p-4 rounded-lg shadow cursor-pointer space-y-3" onclick="openGame('${g.id}', '${g.title}')">
                    <div class="h-32 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-xl shadow-inner">
                        ${g.title.split(' ')[0]} ${g.title.split(' ')[1]}
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-gray-800">${g.title}</h3>
                        <p class="text-xs text-gray-500">${g.desc}</p>
                    </div>
                    <button class="w-full btn-green py-2 rounded text-xs">OYNA</button>
                </div>
            `).join('');
        }

        let canvas, ctx;
        let currentGameId = null;
        let gameInterval = null;
        let score = 0;
        let playerX = 180;

        function openGame(id, title) {
            currentGameId = id;
            document.getElementById('active-game-title').innerText = title;
            document.getElementById('game-modal').classList.remove('hidden');
            
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            score = 0;
            playerX = 180;

            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 1000 / 30); // 30 FPS
        }

        function closeGame() {
            document.getElementById('game-modal').classList.add('hidden');
            if(gameInterval) clearInterval(gameInterval);
        }

        function handleInput(type) {
            if(type === 'LEFT') playerX = Math.max(10, playerX - 20);
            if(type === 'RIGHT') playerX = Math.min(350, playerX + 20);
            if(type === 'ACTION') score += 10;
        }

        function updateGame() {
            // Arka planı temizle
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Skor Yazısı
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Source Sans Pro';
            ctx.fillText('Skor / Güç: ' + score, 15, 30);

            if(currentGameId === 'muscle') {
                // Kas Simülatörü (Karakter)
                ctx.fillStyle = '#ffccaa'; // Kafa
                ctx.fillRect(playerX + 10, 100, 20, 20);
                
                ctx.fillStyle = '#0055ff'; // Gövde (Skor arttıkça büyür)
                let size = Math.min(100, score / 2);
                ctx.fillRect(playerX - size/4, 120, 40 + size/2, 50 + size/2);

                ctx.fillStyle = '#f59e0b';
                ctx.fillText('Gelişmek için "⚡ TIKLA" butonuna bas!', 50, 260);
            } 
            else if(currentGameId === 'speed') {
                // Koşu Oyunu
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(playerX, 200, 30, 40);

                ctx.fillStyle = '#ef4444';
                ctx.fillRect(100, (score * 5) % 250, 40, 20);

                ctx.fillStyle = '#ffffff';
                ctx.fillText('Sol / Sağ butonları ile hareket et!', 60, 260);
            } 
            else {
                // Kılıç Arena
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(playerX, 180, 30, 50);

                // Kılıç
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(playerX + 30, 190, 25, 6);

                ctx.fillStyle = '#ffffff';
                ctx.fillText('Saldırmak için "⚡ TIKLA" butonuna bas!', 50, 260);
            }
        }

        window.onload = renderGames;
    </script>
</body>
</html>
