<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GAMERWOST - Direct Play</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0814; color: #fff; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: #0f172a; }
        .hidden { display: none !important; }
        
        .logo-title { font-size: 2.5rem; font-weight: 900; color: #a855f7; margin-bottom: 15px; }
        
        .hub-container { width: 90%; max-width: 600px; text-align: center; }
        .game-card { background: rgba(255,255,255,0.08); border: 2px solid #a855f7; border-radius: 12px; padding: 20px; margin-top: 15px; cursor: pointer; }
        .game-card button { margin-top: 10px; width: 100%; padding: 12px; background: #9333ea; border: none; color: white; font-weight: bold; border-radius: 8px; font-size: 1rem; }
        
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }
        
        .touch-btn { position: absolute; pointer-events: auto; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; width: 65px; height: 65px; }
        #btn-jump { bottom: 40px; right: 20px; background: rgba(59, 130, 246, 0.6); }
        #btn-destroy { bottom: 120px; right: 20px; background: rgba(239, 68, 68, 0.6); }
        #btn-build { bottom: 40px; right: 95px; background: rgba(34, 197, 94, 0.6); }

        .d-pad { position: absolute; bottom: 30px; left: 20px; pointer-events: auto; display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 5px; }
        .d-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .d-btn:active { background: #a855f7; }

        #exit-btn { position: absolute; top: 15px; right: 15px; pointer-events: auto; padding: 10px 15px; background: #dc2626; border: none; color: white; border-radius: 6px; font-weight: bold; }
        #canvas-container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- LOBİ (DİREKT AÇILIR) -->
    <div id="hub-screen" class="screen">
        <div class="hub-container">
            <h1 class="logo-title">GAMERWOST</h1>
            <p style="color: #94a3b8;">Giriş yapmaya gerek yok! Dünyanı seç ve oyna.</p>
            
            <div class="game-card">
                <h2>Blok Dünyası v1</h2>
                <p style="color: #4ade80; margin-top: 5px;">Çevrimiçi / Dokunmatik Destekli</p>
                <button id="start-btn">OYUNA GİR</button>
            </div>
        </div>
    </div>

    <!-- OYUN ARAYÜZÜ -->
    <div id="game-hud" class="hidden">
        <div class="crosshair"></div>
        <button id="exit-btn">Çıkış</button>
        
        <!-- Yon Butonları -->
        <div class="d-pad">
            <div></div>
            <div class="d-btn" id="btn-up">▲</div>
            <div></div>
            <div class="d-btn" id="btn-left">◄</div>
            <div></div>
            <div class="d-btn" id="btn-right">►</div>
            <div></div>
            <div class="d-btn" id="btn-down">▼</div>
            <div></div>
        </div>

        <div id="btn-destroy" class="touch-btn">KIR</div>
        <div id="btn-build" class="touch-btn">KOY</div>
        <div id="btn-jump" class="touch-btn">ZIPLA</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const hubScreen = document.getElementById('hub-screen');
        const gameHud = document.getElementById('game-hud');
        const startBtn = document.getElementById('start-btn');
        const exitBtn = document.getElementById('exit-btn');

        startBtn.addEventListener('click', startGame);
        exitBtn.addEventListener('click', () => location.reload());

        let scene, camera, renderer, blocks = [];
        let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false;
        let velY = 0, isGrounded = false;
        let yaw = 0, pitch = 0;

        function createAvatar() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), new THREE.MeshLambertMaterial({ color: 0x5b21b6 }));
            body.position.y = 0.5;
            group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xe2e8f0 }));
            head.position.y = 1.3;
            group.add(head);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.2, 0.65), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
            cap.position.y = 1.65;
            group.add(cap);

            return group;
        }

        function startGame() {
            hubScreen.classList.add('hidden');
            gameHud.classList.remove('hidden');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38bdf8);
            scene.fog = new THREE.FogExp2(0x38bdf8, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(10, 20, 10);
            scene.add(light);

            // Zemin Oluştur
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshLambertMaterial({ color: 0x22c55e });
            for (let x = -8; x <= 8; x++) {
                for (let z = -8; z <= 8; z++) {
                    const b = new THREE.Mesh(geo, mat);
                    b.position.set(x, 0, z);
                    scene.add(b);
                    blocks.push(b);
                }
            }

            // Avatar Temsili
            const avatar = createAvatar();
            avatar.position.set(2, 0.5, 2);
            scene.add(avatar);

            bindControls();
            loop();
        }

        function bindControls() {
            // Yön Butonları Touch Mantığı
            const setupBtn = (id, setVar) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); setVar(true); };
                el.ontouchend = (e) => { e.preventDefault(); setVar(false); };
                el.onmousedown = () => setVar(true);
                el.onmouseup = () => setVar(false);
            };

            setupBtn('btn-up', v => moveFwd = v);
            setupBtn('btn-down', v => moveBwd = v);
            setupBtn('btn-left', v => moveLft = v);
            setupBtn('btn-right', v => moveRgt = v);

            // Zıplama
            document.getElementById('btn-jump').onclick = () => {
                if (isGrounded) { velY = 0.3; isGrounded = false; }
            };

            // Blok Koy/Kır
            const ray = new THREE.Raycaster();
            document.getElementById('btn-destroy').onclick = () => {
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = ray.intersectObjects(blocks);
                if(hits.length > 0) {
                    scene.remove(hits[0].object);
                    blocks = blocks.filter(b => b !== hits[0].object);
                }
            };

            document.getElementById('btn-build').onclick = () => {
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = ray.intersectObjects(blocks);
                if(hits.length > 0) {
                    const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({ color: 0xa855f7 }));
                    b.position.copy(hits[0].object.position.clone().add(hits[0].face.normal));
                    scene.add(b);
                    blocks.push(b);
                }
            };

            // Ekran Kaydırarak Kamerayı Çevirme
            let lastX = 0, lastY = 0;
            window.addEventListener('touchstart', (e) => {
                if(e.touches[0].clientX > window.innerWidth / 2) {
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                for(let t of e.touches) {
                    if(t.clientX > window.innerWidth / 2) {
                        yaw -= (t.clientX - lastX) * 0.005;
                        pitch -= (t.clientY - lastY) * 0.005;
                        pitch = Math.max(-1.4, Math.min(1.4, pitch));
                        lastX = t.clientX;
                        lastY = t.clientY;
                    }
                }
            });
        }

        function loop() {
            requestAnimationFrame(loop);

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            const dir = new THREE.Vector3();
            if (moveFwd) dir.z -= 0.1;
            if (moveBwd) dir.z += 0.1;
            if (moveLft) dir.x -= 0.1;
            if (moveRgt) dir.x += 0.1;
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.add(dir);

            velY -= 0.015;
            camera.position.y += velY;

            if (camera.position.y <= 2.2) {
                camera.position.y = 2.2;
                velY = 0;
                isGrounded = true;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
