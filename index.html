<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>obyxa001 - Retro Roblox 2014 & 3D Simulator Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: Arial, sans-serif; background-color: #e3e3e3; margin: 0; padding: 0; }
        .roblox-header { background: linear-gradient(180deg, #0074e8 0%, #004fb0 100%); border-bottom: 2px solid #00367d; }
        .roblox-card { background-color: #ffffff; border: 1px solid #c3c3c3; }
        .btn-green { background: linear-gradient(180deg, #02b700 0%, #008200 100%); border: 1px solid #004d00; color: white; font-weight: bold; }
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; z-index: 100; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: radial-gradient(circle, #ffffff 0%, #a1a5ab 100%); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="roblox-header text-white h-16 flex items-center justify-between px-4 sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-sm">obyxa001 - Retro 3D Studio</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold cursor-pointer flex items-center gap-1">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-4">
        <div class="roblox-card p-4 rounded-lg shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-blue-600">3D Simulator & Game Worlds</h1>
                <p class="text-xs text-gray-500">Choose a game mode: Muscle, Speed, Football or Racing!</p>
            </div>
        </div>

        <div id="tab-games" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-lg max-w-sm w-full p-4 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm">⚙️ Settings</h3>
                <button onclick="toggleSettings()" class="text-red-600 font-bold cursor-pointer">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold mb-1">Language</label>
                    <select id="setting-lang" class="w-full p-2 border rounded">
                        <option value="en" selected>English</option>
                        <option value="tr">Türkçe</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold mb-1">FPS Limit</label>
                    <select id="setting-fps" class="w-full p-2 border rounded">
                        <option value="60">60 FPS (Recommended)</option>
                        <option value="30">30 FPS (Battery Saver)</option>
                        <option value="max">Unlimited FPS</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME MODAL -->
    <div id="game-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col">
        <div class="roblox-header p-3 flex justify-between items-center text-white z-30">
            <div>
                <span id="active-game-title" class="font-bold text-sm">3D Game</span>
                <span id="stat-display" class="ml-4 text-xs bg-black/40 px-2 py-1 rounded text-yellow-300 font-bold">Score: 10</span>
            </div>
            <button onclick="closeGame()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold cursor-pointer">✕ Exit</button>
        </div>
        
        <div id="canvas-container" class="relative flex-1 w-full h-full overflow-hidden">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
            <div class="absolute bottom-6 right-6 z-30">
                <button onclick="triggerAction()" class="bg-gradient-to-r from-yellow-400 to-amber-600 text-black font-black px-6 py-4 rounded-full shadow-2xl border-4 border-white text-sm cursor-pointer">🔥 TRAIN / KICK</button>
            </div>
        </div>
    </div>

    <script>
        const gamesList = [
            { id: 'muscle', title: '💪 Muscle Legends 3D', desc: 'Lift weights, gain muscle, become a giant Bacon!', color: 'from-orange-500 to-red-600', statName: 'Muscle Power' },
            { id: 'speed', title: '⚡ Speed Run 3D', desc: 'Run fast, boost your speed and break records!', color: 'from-amber-400 to-yellow-600', statName: 'Speed' },
            { id: 'football', title: '⚽ Roblox Football 2014', desc: 'Kick the ball, score goals in the 3D stadium!', color: 'from-green-500 to-emerald-700', statName: 'Goals' },
            { id: 'racing', title: '🏎️ Retro Street Racing 3D', desc: 'Drive a retro block car and dodge obstacles!', color: 'from-blue-500 to-indigo-600', statName: 'Race Score' }
        ];

        let currentGame = null, playerStat = 10, scene, camera, renderer, player, animId;
        let moveX = 0, moveZ = 0, walkCycle = 0, leftArm, rightArm, leftLeg, rightLeg;

        function renderGames() {
            document.getElementById('tab-games').innerHTML = gamesList.map(g => `
                <div class="roblox-card p-4 rounded-lg shadow cursor-pointer space-y-3" onclick='openGame(${JSON.stringify(g)})'>
                    <div class="h-32 rounded bg-gradient-to-r ${g.color} flex items-center justify-center text-white font-black text-lg text-center p-2">${g.title}</div>
                    <p class="text-xs text-gray-500">${g.desc}</p>
                    <button class="w-full btn-green py-2 rounded text-xs">PLAY GAME</button>
                </div>
            `).join('');
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function openGame(game) {
            currentGame = game;
            playerStat = 10;
            document.getElementById('active-game-title').innerText = game.title;
            document.getElementById('stat-display').innerText = `${game.statName}: 10`;
            document.getElementById('game-modal').classList.remove('hidden');
            setTimeout(init3D, 150);
        }

        function closeGame() {
            document.getElementById('game-modal').classList.add('hidden');
            if(animId) cancelAnimationFrame(animId);
            const c = document.querySelector('#canvas-container canvas');
            if(c) c.remove();
        }

        function triggerAction() {
            playerStat += 5;
            document.getElementById('stat-display').innerText = `${currentGame.statName}: ${playerStat}`;
            if(player && currentGame.id === 'muscle') {
                let s = 1 + (playerStat / 100);
                player.scale.set(s, s, s);
            }
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth, h = container.clientHeight;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 1000);
            camera.position.set(0, 6, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.6);
            light.position.set(10, 20, 10);
            scene.add(light);

            const floorColor = currentGame.id === 'football' ? 0x2e7d32 : 0x339933;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: floorColor }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 2014 BACON HAIR CHARACTER MODEL (Black Jacket, Blue Shirt, White Hands)[span_1](start_span)[span_1](end_span)
            player = new THREE.Group();
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            body.position.y = 2.1;
            player.add(body);

            const innerShirt = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.62), new THREE.MeshStandardMaterial({ color: 0x0055ff }));
            innerShirt.position.y = 2.1;
            player.add(innerShirt);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xf5f5f5 }));
            head.position.y = 3.2;
            player.add(head);

            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.35, 0.95), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
            hair.position.set(0, 3.65, 0);
            player.add(hair);

            const hairTuft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
            hairTuft.position.set(0, 3.4, 0.45);
            player.add(hairTuft);

            const armMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const handMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const legMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            leftArm = new THREE.Group();
            const lArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.5), armMat);
            lArmMesh.position.y = -0.2;
            const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), handMat);
            lHand.position.y = -0.8;
            leftArm.add(lArmMesh, lHand);
            leftArm.position.set(-0.95, 2.6, 0);
            player.add(leftArm);

            rightArm = new THREE.Group();
            const rArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.5), armMat);
            rArmMesh.position.y = -0.2;
            const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), handMat);
            rHand.position.y = -0.8;
            rightArm.add(rArmMesh, rHand);
            rightArm.position.set(0.95, 2.6, 0);
            player.add(rightArm);

            leftLeg = new THREE.Group();
            const lLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.5), legMat);
            lLegMesh.position.y = -0.3;
            const lShoe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), shoeMat);
            lShoe.position.y = -0.8;
            leftLeg.add(lLegMesh, lShoe);
            leftLeg.position.set(-0.35, 1.4, 0);
            player.add(leftLeg);

            rightLeg = new THREE.Group();
            const rLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.5), legMat);
            rLegMesh.position.y = -0.3;
            const rShoe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), shoeMat);
            rShoe.position.y = -0.8;
            rightLeg.add(rLegMesh, rShoe);
            rightLeg.position.set(0.35, 1.4, 0);
            player.add(rightLeg);

            scene.add(player);
            setupJoystick();

            function animate() {
                animId = requestAnimationFrame(animate);
                if(moveX !== 0 || moveZ !== 0) {
                    player.position.x += moveX * 0.2;
                    player.position.z += moveZ * 0.2;
                    player.rotation.y = Math.atan2(moveX, moveZ);

                    walkCycle += 0.25;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.7;
                    rightArm.rotation.x = -Math.sin(walkCycle) * 0.7;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.7;
                    rightLeg.rotation.x = Math.sin(walkCycle) * 0.7;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 12;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
                renderer.render(scene, camera);
            }
            animate();
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            let touchId = null;

            const handleStart = (e) => {
                const t = e.changedTouches ? e.changedTouches[0] : e;
                touchId = t.identifier !== undefined ? t.identifier : 'mouse';
                updateJoystick(t);
            };

            const handleMove = (e) => {
                const touches = e.changedTouches || [e];
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    if (t.identifier === touchId || touchId === 'mouse') {
                        updateJoystick(t);
                    }
                }
            };

            const handleEnd = (e) => {
                moveX = 0;
                moveZ = 0;
                touchId = null;
                stick.style.transform = `translate(0px, 0px)`;
            };

            base.addEventListener('touchstart', handleStart, {passive: false});
            window.addEventListener('touchmove', handleMove, {passive: false});
            window.addEventListener('touchend', handleEnd);
            window.addEventListener('touchcancel', handleEnd);

            base.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            function updateJoystick(t) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let x = t.clientX - centerX;
                let y = t.clientY - centerY;
                let dist = Math.sqrt(x*x + y*y);
                let maxDist = 40;

                if (dist > maxDist) {
                    x = (x / dist) * maxDist;
                    y = (y / dist) * maxDist;
                }

                stick.style.transform = `translate(${x}px, ${y}px)`;
                moveX = x / maxDist;
                moveZ = y / maxDist;
            }
        }

        window.onload = renderGames;
    </script>
</body>
</html>
