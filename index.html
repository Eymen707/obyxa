<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamerwost - Otomatik Online</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #status-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 20px;
            font-size: 11px; z-index: 10; pointer-events: none; border: 1px solid #555;
            text-align: center;
        }
        #hud {
            position: absolute; top: 50px; left: 10px; color: white; background: rgba(0,0,0,0.6);
            padding: 8px; border-radius: 6px; font-size: 11px; z-index: 10; pointer-events: none;
        }
        #mobile-controls {
            position: absolute; bottom: 90px; left: 20px; display: grid;
            grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; z-index: 10;
        }
        .m-btn {
            background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%; color: white; font-size: 16px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .m-btn:active { background: rgba(255,255,255,0.6); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        #action-buttons {
            position: absolute; bottom: 95px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .act-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-weight: bold; color: white; font-size: 11px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); cursor: pointer;
        }
        #btn-break { background: #ef4444; }
        #btn-place { background: #22c55e; }

        #inventory {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(0,0,0,0.85); padding: 6px; border-radius: 8px; z-index: 10; 
            border: 1px solid #444; max-width: 95vw; overflow-x: auto;
        }
        .inv-slot {
            width: 36px; height: 36px; background: #222; border: 2px solid #555; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; cursor: pointer; border-radius: 5px; font-size: 9px; flex-shrink: 0; text-align: center;
        }
        .inv-slot.active { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.7); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="status-bar">Bağlanıyor...</div>
    
    <div id="hud">
        Odun: <span id="count-wood">5</span> | Taş: <span id="count-stone">0</span>
    </div>

    <div id="mobile-controls">
        <div class="m-btn" id="btn-up" ontouchstart="setKey('forward', true)" ontouchend="setKey('forward', false)" onmousedown="setKey('forward', true)" onmouseup="setKey('forward', false)">⬆️</div>
        <div class="m-btn" id="btn-left" ontouchstart="setKey('left', true)" ontouchend="setKey('left', false)" onmousedown="setKey('left', true)" onmouseup="setKey('left', false)">⬅️</div>
        <div class="m-btn" id="btn-right" ontouchstart="setKey('right', true)" ontouchend="setKey('right', false)" onmousedown="setKey('right', true)" onmouseup="setKey('right', false)">➡️</div>
        <div class="m-btn" id="btn-down" ontouchstart="setKey('backward', true)" ontouchend="setKey('backward', false)" onmousedown="setKey('backward', true)" onmouseup="setKey('backward', false)">⬇️</div>
    </div>

    <div id="action-buttons">
        <button class="act-btn" onclick="triggerJump()" style="background:#3b82f6;">Zıpla</button>
        <button class="act-btn" id="btn-break" onclick="breakBlock()">Kır</button>
        <button class="act-btn" id="btn-place" onclick="placeBlock()">Koy</button>
    </div>

    <div id="inventory">
        <div class="inv-slot active" onclick="selectSlot(1, this)">Odun<br><span id="inv-1">5</span></div>
        <div class="inv-slot" onclick="selectSlot(2, this)">Taş<br><span id="inv-2">0</span></div>
        <div class="inv-slot" onclick="selectSlot(3, this)">Yaprak<br><span id="inv-3">0</span></div>
    </div>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let blocks = [];
        let selectedBlockType = 1;
        let inventoryItems = { 1: 5, 2: 0, 3: 0 };
        let playerPos = { x: 0, y: 3, z: 2 };
        let velocityY = 0, isGrounded = false;
        let keys = { forward: false, backward: false, left: false, right: false };

        // HERKESİN OTOMATİK BAĞLANACAĞI SABİT ODA İSMİ (İstediğin gibi değiştirebilirsin)
        const ROOM_PREFIX = "gamerwost_ana_oda_v1";

        init3D();
        initAutoPeer();
        loadWorld();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(playerPos.x, playerPos.y, playerPos.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.id = "canvas-container";
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x557a2b }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- ID Girmeden Otomatik Oda Sistemi ---
        function initAutoPeer() {
            // Önce odayı kurmayı (Host olmayı) deniyoruz
            peer = new Peer(ROOM_PREFIX);

            peer.on('open', (id) => {
                document.getElementById('status-barinnerText = "Oda Kuruldu (Host sensin!)";');
            });

            // Eğer odayı başka biri kurduysa, PeerJS hata verir ve bu yakalama bloğu çalışır -> Misafir olarak bağlanır
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    document.getElementById('status-bar').innerText = "Odaya Katılınıyor...";
                    connectAsGuest();
                }
            });

            // Host isek başkası bağlandığında:
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                document.getElementById('status-bar').innerText = "Biri Odaya Katıldı!";
            });
        }

        function connectAsGuest() {
            // Zaten açık olan odaya bağlanıyoruz
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(ROOM_PREFIX);
                setupConnectionEvents();
            });
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                document.getElementById('status-bar').innerText = "Online Bağlantı Aktif!";
            });
            conn.on('data', (data) => {
                if (data.type === 'addBlock') {
                    addBlockToScene(data.x, data.y, data.z, data.blockType, true);
                } else if (data.type === 'removeBlock') {
                    scene.remove(blocks[data.index].mesh);
                    blocks.splice(data.index, 1);
                    saveWorld();
                }
            });
        }

        function saveWorld() {
            const savedData = blocks.map(b => ({ x: b.x, y: b.y, z: b.z, type: b.type }));
            localStorage.setItem('gamerwost_world', JSON.stringify(savedData));
        }

        function loadWorld() {
            const data = localStorage.getItem('gamerwost_world');
            if (data) {
                JSON.parse(data).forEach(b => addBlockToScene(b.x, b.y, b.z, b.type, false));
            } else {
                for (let i = -2; i <= 1; i++) {
                    addBlockToScene(i, 0.5, -5, 1, false);
                }
            }
        }

        function addBlockToScene(x, y, z, type, save = true) {
            const colors = { 1: 0x8B4513, 2: 0xA9A9A9, 3: 0x228B22 };
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: colors[type] || 0x8B4513 }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push({ mesh, x, y, z, type });
            if (save) saveWorld();
        }

        function setKey(action, state) { keys[action] = state; }
        function triggerJump() { if (isGrounded) { velocityY = 0.15; isGrounded = false; } }
        function selectSlot(slotIndex, element) {
            selectedBlockType = slotIndex;
            document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function breakBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));
            if (intersects.length > 0) {
                const hit = intersects[0];
                const index = blocks.findIndex(b => b.mesh === hit.object);
                if (index > -1) {
                    inventoryItems[blocks[index].type]++;
                    scene.remove(blocks[index].mesh);
                    blocks.splice(index, 1);
                    saveWorld();
                    if (conn && conn.open) conn.send({ type: 'removeBlock', index: index });
                }
            }
        }

        function placeBlock() {
            if (inventoryItems[selectedBlockType] <= 0) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks.map(b => b.mesh));
            if (intersects.length > 0) {
                const hit = intersects[0];
                const pos = hit.object.position.clone().add(hit.face.normal);
                inventoryItems[selectedBlockType]--;
                addBlockToScene(pos.x, pos.y, pos.z, selectedBlockType, true);
                if (conn && conn.open) conn.send({ type: 'addBlock', x: pos.x, y: pos.y, z: pos.z, blockType: selectedBlockType });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            let speed = 0.08;
            if (keys.forward) playerPos.z -= speed;
            if (keys.backward) playerPos.z += speed;
            if (keys.left) playerPos.x -= speed;
            if (keys.right) playerPos.x += speed;

            camera.position.set(playerPos.x, playerPos.y, playerPos.z);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
