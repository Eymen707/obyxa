<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OBYXA - Classic Roblox Style</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: Verdana, sans-serif; background: #e3e3e3; color: #333; overflow: hidden; }
    
    header { background: linear-gradient(to bottom, #0055b3, #003380); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #001f4d; }
    .logo { font-size: 24px; font-weight: bold; font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px #000; }
    .motto { font-size: 11px; color: #ffd700; font-style: italic; }

    nav { background: #1a539a; display: flex; border-bottom: 2px solid #0f3460; }
    nav button { background: none; border: none; color: white; padding: 10px 15px; font-weight: bold; font-size: 13px; cursor: pointer; }
    nav button.active { background: #e3e3e3; color: #003380; border-radius: 5px 5px 0 0; }

    .container { padding: 12px; max-width: 900px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .game-card { background: white; border: 1px solid #ccc; padding: 8px; border-radius: 4px; text-align: center; cursor: pointer; }
    .game-thumb { width: 100%; height: 80px; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; margin-bottom: 6px; }

    /* 3D Canvas & UI */
    #game-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    .mobile-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .exit-btn { position: absolute; top: 12px; left: 12px; background: rgba(220,53,69,0.9); color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 5px; pointer-events: auto; z-index: 10001; }

    /* Touch Controls */
    #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; touch-action: none; }
    #joystick-knob { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; }
    
    #jump-btn { position: absolute; bottom: 35px; right: 25px; width: 75px; height: 75px; background: rgba(255,255,255,0.35); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; }
    #jump-btn:active { background: rgba(255,255,255,0.7); }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo">OBYXA</div>
      <div class="motto">Think. Create. Play.</div>
    </div>
  </header>

  <nav>
    <button class="active" onclick="switchTab('games', this)">Oyunlar</button>
    <button onclick="switchTab('catalog', this)">Katalog</button>
  </nav>

  <div class="container">
    <div id="games" class="page active">
      <h3 style="margin-bottom:10px;">Popüler Oyunlar</h3>
      <div class="game-grid">
        <div class="game-card" onclick="startGame('obby')">
          <div class="game-thumb" style="background:#2e7d32;">PARKUR</div>
          <b>Classic Obby</b>
        </div>
        <div class="game-card" onclick="startGame('race')">
          <div class="game-thumb" style="background:#c62828;">YARIŞ</div>
          <b>Speed Race</b>
        </div>
        <div class="game-card" onclick="startGame('zombie')">
          <div class="game-thumb" style="background:#37474f;">HAYATTA KALMA</div>
          <b>Zombie Block</b>
        </div>
      </div>
    </div>

    <div id="catalog" class="page">
      <p style="padding:10px;">Şapkalar Oyun İçi Kullanılabilir!</p>
    </div>
  </div>

  <div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div class="mobile-ui">
      <button class="exit-btn" onclick="exitGame()">← Çıkış</button>
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <div id="jump-btn">ZIPLA</div>
    </div>
  </div>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    let scene, camera, renderer, player;
    let leftLeg, rightLeg, leftArm, rightArm;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocityY = 0, gravity = -0.012, isGrounded = false;
    let touchMoveX = 0, touchMoveY = 0;
    let platforms = [];
    let animTime = 0;
    let animFrame;

    function startGame(type) {
      document.getElementById('game-container').style.display = 'block';
      init3D(type);
    }

    function exitGame() {
      document.getElementById('game-container').style.display = 'none';
      if(animFrame) cancelAnimationFrame(animFrame);
    }

    function init3D(type) {
      platforms = [];
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Işıklandırma
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x666666));

      // AVATAR OLUŞTURMA (Noob)
      player = new THREE.Group();
      
      // Baş
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
      head.position.y = 1.4;
      player.add(head);

      // Gövde
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0x0055b3 }));
      torso.position.y = 0.4;
      player.add(torso);

      // Bacaklar
      const legGeo = new THREE.BoxGeometry(0.45, 1, 0.45);
      const legMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
      leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.25, -0.7, 0);
      rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.25, -0.7, 0);
      player.add(leftLeg);
      player.add(rightLeg);

      // Kollar
      const armGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
      const armMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
      leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-0.7, 0.4, 0);
      rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.position.set(0.7, 0.4, 0);
      player.add(leftArm);
      player.add(rightArm);

      player.position.set(0, 3, 0);
      scene.add(player);

      // MAP YAPISI VE FİZİK BLOKLARI
      if(type === 'obby') {
        createPlatform(0, 0, 0, 8, 1, 8, 0x00ff00); // Başlangıç
        for(let i = 1; i <= 8; i++) {
          createPlatform(0, i * 1.5, -i * 6, 4, 0.8, 4, i % 2 === 0 ? 0xff0000 : 0xffff00);
        }
        createPlatform(0, 14, -54, 10, 1, 10, 0x00ffff); // Bitiş
      } else if(type === 'race') {
        createPlatform(0, 0, -50, 12, 1, 120, 0x333333);
      } else {
        createPlatform(0, 0, 0, 40, 1, 40, 0x225522);
      }

      setupControls();
      animate();
    }

    function createPlatform(x, y, z, w, h, d, color) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshLambertMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      
      // Çarpışma Bounding Box Verisi
      platforms.push({
        minX: x - w / 2, maxX: x + w / 2,
        minY: y - h / 2, maxY: y + h / 2,
        minZ: z - d / 2, maxZ: z + d / 2,
        mesh: mesh
      });
    }

    function setupControls() {
      // Klavye
      window.onkeydown = (e) => {
        if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
        if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
        if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
        if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        if(e.code === 'Space') jump();
      };
      window.onkeyup = (e) => {
        if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
        if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
        if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
        if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
      };

      // Mobil Joystick
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let touchId = null;

      zone.ontouchstart = (e) => {
        touchId = e.changedTouches[0].identifier;
      };

      zone.ontouchmove = (e) => {
        for(let touch of e.changedTouches) {
          if(touch.identifier === touchId) {
            const rect = zone.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + rect.width / 2);
            const dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);

            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            touchMoveX = (Math.cos(angle) * dist) / 35;
            touchMoveY = (Math.sin(angle) * dist) / 35;
          }
        }
      };

      zone.ontouchend = zone.ontouchcancel = () => {
        knob.style.transform = 'translate(0px, 0px)';
        touchMoveX = 0;
        touchMoveY = 0;
      };

      // Mobil Zıpla
      const jumpBtn = document.getElementById('jump-btn');
      jumpBtn.ontouchstart = (e) => { e.preventDefault(); jump(); };
      jumpBtn.onclick = jump;
    }

    function jump() {
      if(isGrounded) {
        velocityY = 0.23;
        isGrounded = false;
      }
    }

    function animate() {
      animFrame = requestAnimationFrame(animate);

      // Hareket Vektörleri
      let speed = 0.14;
      let dx = 0, dz = 0;

      if (moveForward) dz -= speed;
      if (moveBackward) dz += speed;
      if (moveLeft) dx -= speed;
      if (moveRight) dx += speed;

      if (Math.abs(touchMoveX) > 0.1 || Math.abs(touchMoveY) > 0.1) {
        dx = touchMoveX * speed;
        dz = touchMoveY * speed;
      }

      // X ve Z Hareket Ve Dönüş Yönü
      if (dx !== 0 || dz !== 0) {
        player.position.x += dx;
        player.position.z += dz;
        player.rotation.y = Math.atan2(dx, dz);

        // Yürüme Animasyonu
        animTime += 0.25;
        leftLeg.rotation.x = Math.sin(animTime) * 0.6;
        rightLeg.rotation.x = -Math.sin(animTime) * 0.6;
        leftArm.rotation.x = -Math.sin(animTime) * 0.6;
        rightArm.rotation.x = Math.sin(animTime) * 0.6;
      } else {
        // Durma Duruşu
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
      }

      // Y-Aksis Fizik (Ağırlık ve Zıplama)
      player.position.y += velocityY;
      velocityY += gravity;

      // KATI BLOK ÇARPIŞMA KONTROLÜ (Solid Collision)
      isGrounded = false;
      const playerRadius = 0.4;
      const playerFeet = player.position.y - 1.2;

      for (let p of platforms) {
        // AABB Çarpışma Testi
        if (player.position.x + playerRadius > p.minX &&
            player.position.x - playerRadius < p.maxX &&
            player.position.z + playerRadius > p.minZ &&
            player.position.z - playerRadius < p.maxZ) {
          
          // Ayak zemine değiyor mu?
          if (playerFeet <= p.maxY && playerFeet >= p.maxY - 0.4 && velocityY <= 0) {
            player.position.y = p.maxY + 1.2;
            velocityY = 0;
            isGrounded = true;
            break;
          }
        }
      }

      // Düşme Kontrolü (Respawn)
      if (player.position.y < -15) {
        player.position.set(0, 4, 0);
        velocityY = 0;
      }

      // Kamera Takibi
      camera.position.x = player.position.x;
      camera.position.y = player.position.y + 3.5;
      camera.position.z = player.position.z + 7.5;
      camera.lookAt(player.position.x, player.position.y + 0.8, player.position.z);

      renderer.render(scene, camera);
    }

    window.onresize = () => {
      if(renderer && camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    };
  </script>
</body>
</html>
