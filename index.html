<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamerwost 0.0.1</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #7ec0ee;
            font-family: monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            font-size: 14px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }
        /* Kontrol Butonları (Mobil) */
        .control-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            line-height: 50px;
            font-size: 14px;
            cursor: pointer;
        }
        #btn-up { bottom: 130px; left: 90px; width: 50px; height: 50px; }
        #btn-down { bottom: 10px; left: 90px; width: 50px; height: 50px; }
        #btn-left { bottom: 70px; left: 30px; width: 50px; height: 50px; }
        #btn-right { bottom: 70px; left: 150px; width: 50px; height: 50px; }
        #btn-jump { bottom: 70px; left: 90px; width: 50px; height: 50px; font-size: 11px; line-height: 50px; }

        #action-buttons {
            position: absolute;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            width: 80px;
            height: 50px;
            background: rgba(0, 50, 150, 0.6);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-weight: bold;
        }
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .slot {
            width: 45px;
            height: 45px;
            border: 2px solid white;
            background: rgba(0,0,0,0.4);
            color: white;
            text-align: center;
            line-height: 45px;
            font-size: 12px;
        }
        .slot.active { border-color: yellow; }
    </style>
</head>
<body>

    <div id="ui">
        GAMERWOST 0.0.1 (CLASSIC)<br>
        <span id="peer-status">GLOBAL PEERJS: CONNECTING...</span><br>
        <span id="player-count">PLAYERS ONLINE: 1</span>
    </div>

    <div id="crosshair">+</div>

    <!-- Mobil Yön Kontrolleri -->
    <div id="btn-up" class="control-btn">▲</div>
    <div id="btn-down" class="control-btn">▼</div>
    <div id="btn-left" class="control-btn">◄</div>
    <div id="btn-right" class="control-btn">►</div>
    <div id="btn-jump" class="control-btn">JUMP</div>

    <div id="action-buttons">
        <button class="action-btn" id="btn-break">BREAK</button>
        <button class="action-btn" id="btn-place">PLACE</button>
    </div>

    <div id="hotbar">
        <div class="slot active">1<br>GRASS</div>
        <div class="slot">2<br>COBBLE</div>
    </div>

    <!-- Three.js ve PeerJS Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script>
        // --- 1. SAHNE VE DÜZ DÜNYA KURULUMU ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.Fog(0x7ec0ee, 20, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Düz Dünya (Zemin)
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // --- 2. KARAKTER MODELİ (Kollar ve Gövde Dahil) ---
        function createPlayerModel() {
            const group = new THREE.Group();

            // Gövde
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.3);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3b146b }); // Mor tişört
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            group.add(body);

            // Kafa
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xd8d8d8 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.55;
            group.add(head);

            // Sol Kol
            const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            const armMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.45, 1.0, 0);
            group.add(leftArm);

            // Sağ Kol
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.45, 1.0, 0);
            group.add(rightArm);

            // Bacaklar
            const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x240d42 });
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.15, 0.4, 0);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.15, 0.4, 0);
            group.add(leftLeg);
            group.add(rightLeg);

            return group;
        }

        // Kendi karakterimiz
        camera.position.set(0, 2, 5);
        let playerPos = { x: 0, y: 0, z: 0 };

        // --- 3. PEERJS OTOMATİK KÜRESEL BAĞLANTI ---
        // Tüm dünyanın aynı odada buluşması için sabit bir prefix kullanıyoruz
        const ROOM_PREFIX = "gamerwost_global_room_v1_";
        let peer = null;
        let connections = {};
        let onlineCount = 1;

        function initPeer() {
            // Rastgele bir ID yerine sunucu havuzuna dahil oluyoruz
            peer = new Peer({
                host: '0.peerjs.com',
                port: 443,
                secure: true
            });

            peer.on('open', (id) => {
                document.getElementById('peer-status').innerText = "GLOBAL PEERJS: CONNECTED";
                console.log('Bağlandı, ID:', id);
                
                // Ağdaki diğer oyuncuları bulmak için kendi ID'mizi broadcast edebiliriz
                // Basit global buluşma için herkese açık ortak ID'ye bağlanma denemesi:
                connectToGlobalRoom();
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                console.error("Peer error:", err);
                document.getElementById('peer-status').innerText = "PEERJS: RECONNECTING...";
                setTimeout(initPeer, 3000); // Hata olursa tekrar dene
            });
        }

        function connectToGlobalRoom() {
            // Test amaçlı sabit ana ID üzerinden oda ağı kurma mantığı
            // Not: Gerçek tam küresel liste için bir signaling listesi gerekir ancak PeerJS peer-to-peer mantığıyla 
            // rastgele bağlantı kurar. Otomatik eşleşme için her istemci gelen bağlantıları kabul eder.
        }

        function setupConnection(conn) {
            connections[conn.peer] = { conn: conn, model: createPlayerModel() };
            scene.add(connections[conn.peer].model);
            onlineCount++;
            document.getElementById('player-count').innerText = "PLAYERS ONLINE: " + onlineCount;

            conn.on('data', (data) => {
                if (data.type === 'move' && connections[conn.peer]) {
                    connections[conn.peer].model.position.set(data.x, data.y, data.z);
                }
            });

            conn.on('close', () => {
                scene.remove(connections[conn.peer].model);
                delete connections[conn.peer];
                onlineCount = Math.max(1, onlineCount - 1);
                document.getElementById('player-count').innerText = "PLAYERS ONLINE: " + onlineCount;
            });
        }

        initPeer();

        // --- 4. HAREKET KONTROLLERİ ---
        let moveState = { forward: false, backward: false, left: false, right: false };

        document.getElementById('btn-up').addEventListener('touchstart', () => moveState.forward = true);
        document.getElementById('btn-up').addEventListener('touchend', () => moveState.forward = false);
        document.getElementById('btn-down').addEventListener('touchstart', () => moveState.backward = true);
        document.getElementById('btn-down').addEventListener('touchend', () => moveState.backward = false);
        document.getElementById('btn-left').addEventListener('touchstart', () => moveState.left = true);
        document.getElementById('btn-left').addEventListener('touchend', () => moveState.left = false);
        document.getElementById('btn-right').addEventListener('touchstart', () => moveState.right = true);
        document.getElementById('btn-right').addEventListener('touchend', () => moveState.right = false);

        // --- 5. OYUN DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);

            // Basit hareket mantığı
            let speed = 0.05;
            if (moveState.forward) camera.position.z -= speed;
            if (moveState.backward) camera.position.z += speed;
            if (moveState.left) camera.position.x -= speed;
            if (moveState.right) camera.position.x += speed;

            renderer.render(scene, camera);
        }
        animate();

        // Ekran boyutu değişimi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
