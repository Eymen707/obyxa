<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamerwost - Minecraft Web Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0f1020; color: #fff; overflow: hidden; height: 100vh; }
        
        #ui { position: absolute; top: 15px; left: 15px; z-index: 5; pointer-events: none; font-size: 0.9rem; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; z-index: 5; pointer-events: none; }
        
        /* Joystick Container */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; z-index: 10; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #a855f7; border-radius: 50%; box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            pointer-events: none;
        }

        /* Action Buttons (Jump, Break, Place) */
        #action-buttons {
            position: absolute; right: 30px; bottom: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 10;
        }
        .act-btn {
            width: 65px; height: 65px; border-radius: 50%; border: 2px solid white; color: white;
            font-size: 1.2rem; font-weight: bold; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); outline: none;
        }
        #btn-jump { background: rgba(59, 130, 246, 0.8); }
        #btn-break { background: rgba(239, 68, 68, 0.8); }
        #btn-place { background: rgba(16, 185, 129, 0.8); }

        /* Inventory Bar */
        #inventory {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 10px; z-index: 5;
            border: 2px solid #7c3aed;
        }
        .slot {
            width: 40px; height: 40px; border: 2px solid #555; display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; border-radius: 6px; background: #222; font-size: 0.7rem; text-align: center;
        }
        .slot.active { border-color: #a855f7; box-shadow: 0 0 10px #a855f7; }

        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Three.js & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui">
        <div>World: <span id="modeText">Gamerwost Public</span></div>
        <div>Blocks: <span id="blockCount">0</span></div>
    </div>

    <div id="crosshair"></div>

    <!-- Virtual Joystick -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Action Buttons -->
    <div id="action-buttons">
        <button class="act-btn" id="btn-break" onclick="doAction('break')">⛏</button>
        <button class="act-btn" id="btn-place" onclick="doAction('place')">➕</button>
        <button class="act-btn" id="btn-jump" onclick="doJump()">⬆</button>
    </div>

    <div id="inventory">
        <div class="slot active" style="background:#55aa55;" onclick="selectBlock(1, this)">Grass</div>
        <div class="slot" style="background:#8b4513;" onclick="selectBlock(2, this)">Dirt</div>
        <div class="slot" style="background:#808080;" onclick="selectBlock(3, this)">Stone</div>
        <div class="slot" style="background:#deb887;" onclick="selectBlock(4, this)">Wood</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let blocks = {};
        let selectedBlockType = 1;
        let raycaster = new THREE.Raycaster();
        
        // Movement state via joystick
        let moveVector = { x: 0, z: 0 };
        let velocity = new THREE.Vector3();
        let canJump = false;

        const blockColors = {
            1: 0x55aa55,
            2: 0x8b4513,
            3: 0x808080,
            4: 0xdeb887
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            loadWorld();
            initJoystick();
            initLookControls();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // World Persistence
        function saveWorld() {
            localStorage.setItem('gamerwost_world_v2', JSON.stringify(blocks));
        }

        function loadWorld() {
            const saved = localStorage.getItem('gamerwost_world_v2');
            if(saved) {
                blocks = JSON.parse(saved);
                rebuildWorld();
            } else {
                for(let x = -4; x <= 4; x++) {
                    for(let z = -4; z <= 4; z++) {
                        createBlock(x, 0, z, 1, false);
                    }
                }
            }
        }

        function rebuildWorld() {
            scene.children.forEach(child => {
                if(child.isMesh && child.geometry.type === 'BoxGeometry') scene.remove(child);
            });
            for(let key in blocks) {
                let [x, y, z] = key.split(',').map(Number);
                createBlock(x, y, z, blocks[key], false);
            }
        }

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        function createBlock(x, y, z, type, save = true) {
            const key = `${x},${y},${z}`;
            blocks[key] = type;
            const mat = new THREE.MeshLambertMaterial({ color: blockColors[type] });
            const cube = new THREE.Mesh(boxGeo, mat);
            cube.position.set(x, y, z);
            cube.userData = { x, y, z, type };
            scene.add(cube);
            if(save) { saveWorld(); updateCount(); }
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if(!blocks[key]) return;
            delete blocks[key];
            scene.children.forEach(child => {
                if(child.isMesh && child.userData && child.userData.x === x && child.userData.y === y && child.userData.z === z) {
                    scene.remove(child);
                }
            });
            saveWorld();
            updateCount();
        }

        function updateCount() {
            document.getElementById('blockCount').innerText = Object.keys(blocks).length;
        }

        function selectBlock(type, el) {
            selectedBlockType = type;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        // Touch Joystick Logic
        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let maxDist = 35;

            zone.addEventListener('touchmove', (e) => {
                let touch = e.touches[0];
                let rect = zone.getBoundingClientRect();
                let centerX = rect.left + rect.width / 2;
                let centerY = rect.top + rect.height / 2;
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if(dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.x = dx / maxDist;
                moveVector.z = dy / maxDist;
            });

            zone.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                moveVector.x = 0;
                moveVector.z = 0;
            });
        }

        // Camera Look (Drag anywhere on screen)
        function initLookControls() {
            let isDragging = false;
            let lastX = 0, lastY = 0;

            document.addEventListener('touchstart', (e) => {
                if(e.target.tagName === 'DIV' && e.target.id === 'canvas-container') {
                    isDragging = true;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                }
            });

            document.addEventListener('touchmove', (e) => {
                if(!isDragging) return;
                let clientX = e.touches[0].clientX;
                let clientY = e.touches[0].clientY;
                let deltaX = clientX - lastX;
                let deltaY = clientY - lastY;

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));

                lastX = clientX;
                lastY = clientY;
            });

            document.addEventListener('touchend', () => { isDragging = false; });
            
            // PC Mouse support
            document.addEventListener('mousemove', (e) => {
                if(e.buttons === 2 || document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
            document.body.addEventListener('click', () => { document.body.requestPointerLock(); });
        }

        function doJump() {
            if(canJump) { velocity.y += 8; canJump = false; }
        }

        function doAction(actionType) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if(intersects.length > 0) {
                const intersect = intersects[0];
                const pos = intersect.object.userData;
                if(pos && pos.y !== undefined) {
                    if(actionType === 'break') {
                        removeBlock(pos.x, pos.y, pos.z);
                    } else if(actionType === 'place') {
                        const normal = intersect.face.normal;
                        createBlock(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z, selectedBlockType);
                    }
                }
            }
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.y -= 9.8 * 3.0 * delta;
            camera.translateX(moveVector.x * 8.0 * delta);
            camera.translateZ(moveVector.z * 8.0 * delta);
            camera.position.y += velocity.y * delta;

            if(camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
                canJump = true;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
        updateCount();
    </script>
</body>
</html>
